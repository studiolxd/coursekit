name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --group dev
      - run: uv run ruff check .
      - run: uv run pytest -q
      - name: install as a tool
        run: |
          uv tool install .
          coursekit --version

  # The capture with a real browser (Playwright and the Chrome of the runner, with no window) and the OCR, the faces and the
  # video of `coursekit capture`: the capture extra, which the job above does not install (its tests are skipped there).
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg libgl1  # libgl1: what OpenCV needs on Linux
      - run: uv sync --group dev --extra capture
      - run: uv run pytest -q tests/test_capture.py tests/test_capture_browser.py tests/test_media_checks.py
