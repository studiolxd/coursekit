[project]
name = "slxd-coursekit"
version = "0.1.0.dev0"
description = "AI-assisted e-learning course production: brief, instructional design, writing, review, media, assembly and SCORM delivery."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Studio LXD", email = "hello@studiolxd.com" }]
requires-python = ">=3.12"
dependencies = [
    "pyyaml>=6.0",
    "ruamel.yaml>=0.18",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
media = []

[project.urls]
Repository = "https://github.com/studiolxd/coursekit"

[project.scripts]
coursekit = "coursekit.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/coursekit"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
