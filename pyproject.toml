[project]
name = "slxd-coursekit"
version = "0.5.0"
description = "AI-assisted e-learning course production: brief, instructional design, writing, review, media, assembly and SCORM delivery."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Studio LXD", email = "hello@studiolxd.com" }]
requires-python = ">=3.12,<3.14"
dependencies = [
    "pyyaml>=6.0",
    "ruamel.yaml>=0.18",
    "openpyxl>=3.1",
    "markdown-it-py>=3.0",
    "markitdown[pdf,docx,pptx,xlsx,xls,outlook]>=0.1",
    "pillow>=10",
]

[project.optional-dependencies]
media = []
capture = [
    "playwright>=1.48",
    "rapidocr-onnxruntime>=1.3",
    "opencv-python>=4.8,<5",  # the one rapidocr needs (one OpenCV only: two would overwrite each other); 5 drops the face detector
    "pyobjc-framework-Vision>=10; sys_platform == 'darwin'",
]

[project.urls]
Repository = "https://github.com/studiolxd/coursekit"

[project.scripts]
coursekit = "coursekit.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/coursekit"]

[tool.ruff]
line-length = 140
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["real_defaults: the rules of the package as shipped (no suite adjustments)"]
