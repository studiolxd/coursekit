[project]
name = "slxd-coursekit"
version = "0.8.0"
description = "AI-assisted e-learning course production: brief, instructional design, writing, review, media, assembly and SCORM delivery."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Studio LXD", email = "hello@studiolxd.com" }]
requires-python = ">=3.12,<3.15"
dependencies = [
    "pyyaml>=6.0",
    "ruamel.yaml>=0.18",
    "openpyxl>=3.1",
    "markdown-it-py>=3.0",
    "pillow>=10",
]

[project.optional-dependencies]
media = []
# The documents of brief/sources and of the brand material (PDF, Word, PowerPoint, Excel, Outlook) converted to text. It brings
# onnxruntime, pandas and numpy: most of the weight of an installation.
docs = ["markitdown[pdf,docx,pptx,xlsx,xls,outlook]>=0.1"]
capture = [
    "playwright>=1.48",
    "rapidocr>=3.10,<4",  # the OCR of the pixels; it ships its models, so nothing is downloaded when it reads
    "onnxruntime>=1.24.1",  # the engine rapidocr runs its models on (it does not bring one); 1.24.1 is the first for Python 3.14
    "opencv-python-headless>=4.8,<5",  # the one rapidocr needs (one OpenCV only: two would overwrite each other); 5 drops the face detector
    "pyobjc-framework-Vision>=10; sys_platform == 'darwin'",
    "pyte>=0.8.2",  # the terminal emulator of the terminal mode
]

[project.urls]
Repository = "https://github.com/studiolxd/coursekit"

[project.scripts]
coursekit = "coursekit.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.13", "types-PyYAML>=6.0"]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/coursekit"]

# The reference of the commands, for `coursekit help COMMAND` (coursekit/manual.py).
[tool.hatch.build.targets.wheel.force-include]
"docs/en/03-commands.md" = "coursekit/manual/en/03-commands.md"
"docs/es/03-commands.md" = "coursekit/manual/es/03-commands.md"

[tool.ruff]
line-length = 140
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RET", "PTH"]
ignore = ["SIM905"]  # a sentence written as text and split reads better in the tests than a list of words

[tool.mypy]
# The whole package, with every function annotated: a new module is typed from the start.
files = ["src/coursekit"]
python_version = "3.12"
follow_imports = "silent"
ignore_missing_imports = true
check_untyped_defs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
warn_return_any = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["real_defaults: the rules of the package as shipped (no suite adjustments)"]
