# Real captures of an application that coursekit makes itself (`coursekit capture`), for the resources that show a real
# interface (`depicts: interface`, recipes `screenshot` and `screen-recording`): instead of waiting for a person to drop the
# file in media/recordings/<id>, an agent drives the application and coursekit captures it, with the permission of a person.
#
# Nothing is captured until a project turns it on. Then a person, never an agent:
#   - logs in once per application with `coursekit capture login PROFILE` (a browser of their own machine opens with a
#     profile kept outside the project; coursekit never sees or stores the password);
#   - gives a permission that expires with `coursekit capture allow CODE [ID…] --mode browser|desktop`.
# Use an account or an environment of tests with invented data: what hides real data is a safety net, not the main measure.
enabled: false

grant_minutes: 60              # how long a permission of `coursekit capture allow` lasts unless it says --minutes

modes: [browser, desktop]      # the ways of capturing a project allows: browser (a web application, driven in a browser
                               # coursekit opens) and desktop (a window of a program of the machine)

# The web applications, one profile each: the key is the name `coursekit capture login NAME` uses (lowercase letters,
# digits and hyphens). Every address the capture opens must be on one of its `allow_domains` (a domain covers its
# subdomains), so it never wanders to other sites; put the single sign-on domain there too if the login goes through one.
# `account` is only a label of which account it is (e.g. "demo admin"), never a user name or a password. `login_url`
# (optional) is the start of the address of the login page: landing there means the session expired, and the capture stops
# until a person logs in again (`coursekit capture login`); the agent never logs in.
#   acme-admin:
#     start_url: https://app.acme.example/
#     allow_domains: [app.acme.example, sso.acme.example]
#     login_url: https://sso.acme.example/login
#     account: demo administrator
profiles: {}

browser:
  visible: true                # the browser is seen while it captures (a person can watch); false runs it hidden, for a
                               # machine with no screen (a server, the tests of coursekit)

screenshot:
  max_edge: 1920               # px: the largest side of what the agent sees (its coordinates are in that space)
  device_scale: 2              # browser: pixels per CSS pixel of the saved captures (2 = sharp on high-density screens)

# What is hidden in a capture. In a web application the text on screen is replaced in the page itself (with invented people,
# companies and data of the course language, see lang/<code>.yaml › capture_people) before anything is captured; in a
# recording or a window of a program it is found by reading the pixels (OCR) and covered. Either way a person reviews the
# result before it is used (`coursekit capture review` and `approve`).
redact:
  # The kinds of data that are looked for, by id, with the regular expression that finds them (Python syntax). The ids
  # email, phone, iban, card, national_id and ip are also checked by coursekit (the digits of a phone, the check digits of
  # an IBAN, a card or a Spanish DNI/NIE, the numbers of an IP) where the text is exact, in the page; on the pixels any text
  # with that shape is covered, because the reading can be wrong. A project adds its own (an employee number, a file
  # reference) with an id and an expression; a mapping merges key by key, so `card: null` turns one off.
  patterns:
    email: '[\w.+-]+@[\w-]+(?:\.[\w-]+)+'
    iban: '\b[A-Z]{2}\d{2}(?:[ ]?[A-Z0-9]{4}){2,7}(?:[ ]?[A-Z0-9]{1,4})?\b'
    card: '\b(?:\d[ -]?){12,18}\d\b'
    national_id: '\b(?:\d{8}|[XYZ]\d{7})[- ]?[A-Z]\b'
    phone: '(?<![\w.])\+?\d[\d ().-]{7,}\d(?!\w|\.\d)'
    ip: '\b(?:\d{1,3}\.){3}\d{1,3}\b'
  names: true                  # names of people: a known first name followed by one or two words in capitals
  extra_terms: []              # words always hidden, whatever case (a real company, a project, a place): ["Bravant"]
  selectors: []                # browser: CSS of the parts of a page always blurred (an account menu, a photo): [".user-card"]
                               # (photos and avatars whose class, id or alt says so are blurred anyway)
  pixel_check: true            # browser: every screen is also read on the pixels (text in images, canvas) and what is
                               # still there is covered; needs an OCR (the capture extra or tesseract), else it says so
  faces: true                  # faces in photos and avatars (on the pixels: needs the capture extra)
  pixels: pixelate             # how it is covered on the pixels: pixelate | blur | solid
  padding: 4                   # px around what is covered
  ocr: auto                    # who reads the pixels: auto (Apple Vision on macOS, else rapidocr, else tesseract) | vision |
                               # rapidocr | tesseract (Vision and rapidocr come with the capture extra)
  video_fps: 4                 # frames read per second of a video; what is found stays covered until the next one read

# `coursekit capture replay`: the steps of the brief repeated at the pace of a person, and the video of the stretches between
# `record: start` and `record: stop` (a session of the agent only writes the steps: it thinks between actions, and its video
# would be full of pauses).
replay:
  pause_ms: 700                # after each step
  move_ms: 450                 # the pointer travels to each target in this time
  type_delay_ms: 70            # between letters
  fps: 30                      # frames per second of the video
  cursor: true                 # a visible pointer and a ring on each click (the screencast does not draw the system one)

raw:
  keep_days: 7                 # the original of a recording, kept outside the project to cover it again after a rejection;
                               # deleted when the capture is approved, or after these days
