# Export settings for phase 9 (slxd MCP create_export). One SCORM package per unit:
# each unit is one creator content.
export:
  deliveryType: lms
  standard: scorm_1_2              # scorm_1_2 | scorm_2004
  reporting: passed_incomplete     # passed_incomplete | completed_incomplete
  scoreSource: quiz                # quiz | lessonProgress
file_name: "{code}-U{unit:02d}-v{version}-{standard}.zip"   # inside courses/<CODE>/delivery/
