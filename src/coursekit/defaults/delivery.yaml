# Export settings for phase 9 (slxd MCP create_export). One SCORM package per unit:
# each unit is one creator content.
export:
  deliveryType: lms
  standard: scorm_1_2              # scorm_1_2 | scorm_2004
  reporting: passed_incomplete     # passed_incomplete | completed_incomplete
  scoreSource: quiz                # quiz | lessonProgress
# Where the tests of the course go and in which format. A course may set its own in course.yaml › delivery › assessment.
assessment:
  placement: unit                  # unit: the tests of each unit go inside its package
                                   # separate: all the tests of the course go in one package of their own after the units (one
                                   # more unit to assemble and deliver, "Assessment"); the units then report their progress and
                                   # that package the score
  format: platform                 # platform: the tests are lessons of the packages (creator or html)
                                   # aiken | gift | moodle-xml | qti: the questions of the tests leave the packages as a question
                                   # bank to import in the LMS; the scored simulations stay in a package. With the creator backend
                                   # the questions go in a content of their own and creator exports the bank (gift, moodle-xml,
                                   # qti); with html `coursekit delivery questions` writes it (aiken, gift, moodle-xml). Each format
                                   # takes some question types only (aiken: single-choice; gift and moodle-xml: single-choice,
                                   # multi-select, true-false, match, sorting-groups, short-answer, fill-in-the-blank; qti: those
                                   # and sorting; moodle-xml also sorting, as the ordering type of Moodle 4.4 or later), and
                                   # `coursekit verify` refuses the others in assessment.md
# Whether the options of the questions are shown in a different order to each learner, in the practice of the content and in
# the tests. It applies to single-choice, multi-select and sorting-groups (the other types: sorting and order-words are always
# shuffled, true-false never). A course may set its own in course.yaml › delivery › shuffle_options, and a question its own
# with the key `shuffle: yes|no` (in the words of the course language). creator: the shuffleOptions of the brick; html: the
# player; moodle-xml: the shuffleanswers of the question (gift and aiken cannot say it: the quiz of Moodle decides).
shuffle_options:
  practice: true
  assessment: true
# Whether the questions of each test are shown in a different order to each learner (and on each attempt). creator: the
# shuffleQuestions of the quiz of the lesson; html: the player. A question bank (aiken, gift, moodle-xml, qti) cannot carry it:
# the order is a setting of the quiz of the LMS (in Moodle, "Shuffle" in the page of the questions of the quiz), and
# `coursekit delivery questions` reminds of it. A course may set its own in course.yaml › delivery › shuffle_questions.
shuffle_questions: true
# Review of the course by the client before delivering (`coursekit client`). With required: true,
# `deliver` is refused until the client approves (or the review is skipped with a reason). A course can
# override it in its course.yaml.
client_review:
  required: false
file_name: "{code}-U{unit:02d}-v{version}-{standard}.zip"   # inside courses/<CODE>/delivery/
