# Export settings for phase 9 (slxd MCP create_export). One SCORM package per unit:
# each unit is one creator content.
export:
  deliveryType: lms
  standard: scorm_1_2              # scorm_1_2 | scorm_2004
  reporting: passed_incomplete     # passed_incomplete | completed_incomplete
  scoreSource: quiz                # quiz | lessonProgress
# Where the tests of the course go and in which format. A course may set its own in course.yaml › delivery › assessment.
assessment:
  placement: unit                  # unit: the tests of each unit go inside its package
                                   # separate: all the tests of the course go in one package of their own after the units (one
                                   # more unit to assemble and deliver, "Assessment"); the units then report their progress and
                                   # that package the score
  format: platform                 # platform: the tests are lessons of the packages (creator or html)
                                   # aiken | gift | moodle-xml: the questions of the tests leave the packages as a question bank to
                                   # import in the LMS (`coursekit delivery questions`); the scored simulations stay in a package.
                                   # Each format takes some question types only (aiken: single-choice; gift and moodle-xml:
                                   # single-choice, multi-select, true-false, match, sorting-groups, short-answer,
                                   # fill-in-the-blank), and `coursekit verify` refuses the others in assessment.md
# Review of the course by the client before delivering (`coursekit client`). With required: true,
# `deliver` is refused until the client approves (or the review is skipped with a reason). A course can
# override it in its course.yaml.
client_review:
  required: false
file_name: "{code}-U{unit:02d}-v{version}-{standard}.zip"   # inside courses/<CODE>/delivery/
