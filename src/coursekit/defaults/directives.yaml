# Registry of the content directives (:::name) and the creator brick each one becomes.
# Source: slxd creator brick catalog (MCP list_brick_types; apps/creator/src/lib/mcp/
# brick-authoring/guidance.ts). Refresh it when creator adds bricks: ask the agent to compare
# with list_brick_types and update this file.
#
# role:
#   interactive  counts towards the interactive minimum of a content section
#   question     practice / assessment question (needs "objetivo:")
#   static       highlighted text, does not count as interactive
# Bricks that are not directives are listed in `not_directives` (plain Markdown, multimedia
# placeholders, or deliberately unused). Every creator brick must be in one of the two lists:
# `coursekit directives check` reports the ones that are not (/sync-directives updates the file).
synced_with_creator: 2026-10-08

directives:
  # collection
  accordion:          {brick: ACCORDION,          role: interactive, use: "Contenido largo dividido en secciones plegables que se abren a demanda."}
  tabs:               {brick: TABS,               role: interactive, use: "Vistas alternativas de contenido relacionado en pestañas."}
  carousel:           {brick: CAROUSEL,           role: interactive, use: "Diapositivas paso a paso, con portada y resumen opcionales."}
  carousel-quotes:    {brick: CAROUSEL_QUOTES,    role: interactive, use: "Conjunto rotatorio de citas o testimonios."}
  flashcards:         {brick: FLASHCARD_CAROUSEL, role: interactive, use: "Memorizar y recordar, una tarjeta cada vez (término ↔ definición)."}
  flashcard-gallery:  {brick: FLASHCARD_GALLERY,  role: interactive, use: "Rejilla de tarjetas para autoevaluar el recuerdo."}
  labelled-graphic:   {brick: LABELLED_GRAPHIC,   role: interactive, use: "Imagen con puntos calientes que explican sus partes (diagramas)."}
  timeline:           {brick: TIMELINE,           role: interactive, use: "Hechos o pasos cronológicos o secuenciales."}
  dialog:             {brick: DIALOG,             role: interactive, use: "Conversación guionizada entre personajes (roleplay, ejemplos resueltos)."}
  # question
  single-choice:      {brick: SINGLE_CHOICE,      role: question, use: "Comprobar la comprensión con una única opción correcta."}
  multi-select:       {brick: MULTI_SELECT,       role: question, use: "Evaluar cuando varias opciones pueden ser correctas."}
  true-false:         {brick: TRUE_FALSE,         role: question, use: "Comprobación rápida de una afirmación."}
  sorting:            {brick: SORTING,            role: question, use: "Ordenar elementos en la secuencia correcta."}
  match:              {brick: MATCH,              role: question, use: "Emparejar elementos de la izquierda con los de la derecha."}
  sorting-groups:     {brick: SORTING_GROUPS,     role: question, use: "Clasificar elementos en sus categorías."}
  fill-in-the-blank:  {brick: FILL_IN_THE_BLANK,  role: question, use: "Recordar palabras concretas dentro de una frase (huecos)."}
  order-words:        {brick: ORDER_WORDS,        role: question, use: "Reconstruir frases a partir de palabras desordenadas."}
  short-answer:       {brick: SHORT_ANSWER,       role: question, use: "Respuesta libre comparada con una lista de respuestas aceptadas."}
  # game (count as interactive; use sparingly, for review or reward)
  word-search:        {brick: WORD_SEARCH,        role: interactive, use: "Sopa de letras; refuerzo de vocabulario."}
  wordle:             {brick: WORDLE,             role: interactive, use: "Adivinar la palabra; vocabulario."}
  hangman:            {brick: HANGMAN,            role: interactive, use: "Ahorcado; vocabulario."}
  pasapalabra:        {brick: PASAPALABRA,        role: interactive, use: "Rosco con una pista por letra; repaso amplio de un tema."}
  memory:             {brick: MEMORY,             role: interactive, use: "Parejas de memoria; recuerdo y asociación."}
  trivial:            {brick: TRIVIAL,            role: interactive, use: "Trivial por categorías; repaso gamificado."}
  # static text
  note:               {brick: NOTE,               role: static, use: "Nota, consejo o advertencia separada del texto principal."}
  highlight:          {brick: HIGHLIGHT,          role: static, use: "Destacar una idea clave."}
  quote:              {brick: QUOTE,              role: static, use: "Cita de una persona experta o fuente, con atribución."}

not_directives:
  HEADING: "### / #### en Markdown"
  TEXT: "párrafos en Markdown"
  LIST: "listas en Markdown"
  TABLE: "tablas en Markdown"
  CODE: "bloques de código en Markdown"
  CHART: "sin uso por ahora (los datos van en tablas o en un placeholder Infografía)"
  SEPARATOR: "lo decide el montaje en creator"
  IMAGE: "placeholder Imagen / Infografía / Esquema/Diagrama / GIF animado"
  IMAGE_TEXT: "placeholder Imagen junto al texto (montaje)"
  IMAGE_CAROUSEL: "varios placeholders Imagen seguidos (montaje)"
  IMAGE_GALLERY: "varios placeholders Imagen seguidos (montaje)"
  VIDEO: "placeholder Vídeo"
  VIDEO_CAROUSEL: "varios placeholders Vídeo seguidos (montaje)"
  VIDEO_GALLERY: "varios placeholders Vídeo seguidos (montaje)"
  AUDIO: "placeholder Audio"
  EMBED: "placeholder Simulación interactiva / Demo interactiva en terminal"
  ATTACHMENT: "sin uso por ahora"
  PUZZLE: "juego con imagen: sin uso por ahora"
  SLIDING_PUZZLE: "juego con imagen: sin uso por ahora"

# Common e-learning components that are NOT creator bricks, and what to use instead.
component_equivalents:
  stepper: carousel (o timeline si es una secuencia temporal)
  hotspots: labelled-graphic
  reveal: accordion o flashcards
  toggle-compare: tabs
  checklist: multi-select (como autoevaluación)
  tooltips: note o glosario en accordion
  modal: accordion
  escenario-rama: dialog (las ramas complejas, placeholder "Simulación interactiva")
  terminal-simulado: placeholder "Demo interactiva en terminal" (se produce como EMBED)
