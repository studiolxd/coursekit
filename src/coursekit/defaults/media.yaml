# Multimedia production: for each placeholder type (its id: `lang/<language>.yaml › media_types` says how it is written in
# the content), the options in order of preference.
# `coursekit media plan` keeps, for each asset, the options whose requirements are met:
#   env: VAR   the variable is set (in .env or the shell); a list [A, B] needs all of them
#   bin: CMD   the command is installed
#   mcp: TOOL  the agent has that MCP tool (only the agent can check it)
#   media: X   the command X is on the PATH (`coursekit setup --media` installs piper and stable-ts)
#   path: P    the path exists inside the project (e.g. tools/remotion/node_modules)
#   none       always available (the agent does it itself)
# `only:` limits an option to some content — the agent decides from the placeholder's description: `terminal` (it shows a
# terminal), `decorative` (an image that sets the scene and explains nothing: a header, people at work, a place, a generic
# object; what shows something specific of the content is generated or drawn), `illustration` (an illustration that goes with
# a concept of the content and reinforces it: not a diagram, not a photograph, not a scene of a simulation).
# An id may appear twice: once limited with `only:` and higher, once without it and lower.
# `shows: interface` marks an option that works from real material of an application (a capture or a recording that a person
# provides): it is offered only for a resource that `depicts` a real interface (see `depicts` below).
# The agent uses the first option it can actually run and records it in the manifest.
# A generator option may fix `model`, `resolution` and `variants` (versions per image to choose from; default 1): they
# keep the cost of the credits under control, e.g. {id: magnific-mcp, …, model: seedream-5-flash, resolution: 1.5k, variants: 1}.

# Visual style of the scenes, characters and objects of the simulations and of the illustrations (generated or drawn). A course
# changes it in course.yaml › media › visual. How they must look in detail goes in theme/branding/media-style.md (house style),
# with reference images in theme/branding/style/.
visual:
  style: illustration          # flat | pixel-art | 3d | isometric | illustration | photo
  fallback: flat               # the style when there is no image generator: the illustration role draws it as SVG

# The illustrations taken from the illustration sources of the brand (`coursekit media stock`): `color` filters the search
# (black: the line versions; null: any), and the taken SVG is recoloured, its dark colours to the role `ink` of the tokens and
# its light ones to the role `paper` (an accent the script asks for is added by hand afterwards).
stock:
  color: black
  ink: text
  paper: background

# The fonts of the brand every resource made on this machine is drawn with (a video, an SVG exported as PNG), so it does not
# depend on the fonts installed: a stylesheet of the project with @font-face rules (its font files next to it, inside the
# project). auto: theme/branding/fonts/fonts.css of the course, else of the project, when it exists; null: the machine's.
fonts: auto

# Connectors that the media and illustration agents may use in the sessions without an interface (`--headless`, the handoff,
# Claude Code only), by their name as Claude Code lists them, e.g. [magnific, ElevenLabs]: a server of the project (.mcp.json)
# by its name there, any other name a connector of the account in claude.ai. Log in to each once with /mcp in a session with an
# interface. The options with `needs: {mcp: …}` (images_generate, creative_generate_speech…) come from them. With an interface
# the person approves them.
connectors: []

# Voice-over for video and audio. A course uses ONE provider for all its narration:
# course.yaml › media.voice, chosen with `coursekit voice set` when several are available.
# `coursekit tts --course CODE` uses it.
voice:
  - {id: elevenlabs-api, needs: {env: ELEVENLABS_API_KEY}, how: "TTS with per-character timestamps (exact captions without aligning)"}
  - {id: azure-api, needs: {env: [AZURE_SPEECH_KEY, AZURE_SPEECH_REGION]}, how: "Azure AI Speech, neural voices"}
  - {id: google-api, needs: {env: GOOGLE_TTS_API_KEY}, how: "Google Cloud TTS, Chirp 3 HD"}
  - {id: gemini-api, needs: {env: GEMINI_API_KEY}, how: "Gemini TTS (Gemini API), voices with a style instruction"}
  - {id: elevenlabs-mcp, needs: {mcp: creative_generate_speech}, how: "Claude's ElevenLabs connector (without coursekit tts)"}
  - {id: piper, needs: {media: piper, env: PIPER_VOICE}, how: "Local draft, Piper voice (speakers 0 and 1 for multi-speaker voices)"}
# The Gemini voice (provider `gemini`). A course changes them in course.yaml › media › gemini.
gemini:
  # Model of the Gemini API. `coursekit voice set CODE gemini` writes it in the course (course.yaml › media.voice.model), so a
  # course keeps the model it started with when this default changes. gemini-3.8-flash-lite-tts costs less;
  # gemini-3.1-flash-tts-preview is the earlier preview model.
  model: gemini-3.8-flash-tts
  # How to say it: emotions, delivery, pace, volume (e.g. "calm, warm and clear, like a teacher explaining"). It is sent with
  # every piece of the script, so the tone does not change between them. Empty: the voice as it is.
  style: ""
  # Longest piece of a script per request, in UTF-8 bytes (a long script is split at the ends of its sentences). The model
  # returns at most about ten minutes of audio per request; about 4500 bytes are three to four minutes of speech.
  chunk_bytes: 4500
  # flex: half the price, the same request, and the answer in minutes instead of seconds (up to 15); when Google has no
  # capacity it answers 429 or 503, and coursekit tries again a few times. standard: the full price and the quickest answer.
  # For a whole course at once there is also the batch (`coursekit tts-batch`): the same half price, the audio in hours.
  tier: flex
  flex_fallback: true      # when flex still has no capacity after the attempts, the request goes in the standard tier
subtitles:
  - {id: elevenlabs-timestamps, needs: {env: ELEVENLABS_API_KEY}, how: "VTT from the ElevenLabs timestamps"}
  - {id: stable-ts, needs: {media: stable-ts}, how: "Align the script with the audio (stable-ts, word by word) → VTT (coursekit subtitles)"}

types:
  image:
    # decorative images come from the catalog first (licensed, no credits); what is specific to the content is generated
    - {id: creator-stock, needs: {mcp: search_stock_images}, only: decorative, how: "Licensed stock from creator (Pexels, Pixabay, Unsplash, Freepik) + import_stock_image; nothing that fits the style of the course: go on with the next option"}
    # a concept illustration comes first from the illustration sources of the brand (theme/branding/links.md), recoloured
    - {id: magnific-stock, needs: {env: MAGNIFIC_API_KEY, path: theme/branding/illustration-sources.json}, only: illustration, how: "An illustration of the illustration sources of the brand, recoloured to it (coursekit media stock); nothing that fits: go on with the next option"}
    - {id: magnific-api, needs: {env: MAGNIFIC_API_KEY}, how: "Image generated with the Magnific API"}
    - {id: magnific-mcp, needs: {mcp: images_generate}, how: "Claude's Magnific connector"}
    - {id: agent-svg, needs: none, how: "Illustration drawn by the agent as SVG with the theme colours and exported to PNG (creator does not take SVG as an image); portraits of characters as flat busts"}
    - {id: creator-stock, needs: {mcp: search_stock_images}, how: "Licensed stock from creator (Pexels, Pixabay, Unsplash, Freepik) + import_stock_image"}
    - {id: screenshot, needs: none, shows: interface, how: "A real capture of the application that a person provides (media/recordings/<id>.png): the agent only crops it and marks it (numbers, frames, arrows) and never redraws it. Without the capture the asset stays scripted with a brief of what to capture (media/scripts/<id>.md)"}
  infographic:
    - {id: agent-svg, needs: none, how: "SVG written by the agent with the theme tokens (coursekit theme show); icons with search_stock_icons"}
    - {id: magnific-api, needs: {env: MAGNIFIC_API_KEY}, how: "Generated supporting illustration"}
    - {id: screenshot, needs: none, shows: interface, how: "A real capture of the application that a person provides (media/recordings/<id>.png): the agent only crops it and marks it (numbers, frames, arrows) and never redraws it. Without the capture the asset stays scripted with a brief of what to capture (media/scripts/<id>.md)"}
  diagram:
    - {id: agent-svg, needs: none, how: "SVG written by the agent with the theme tokens"}
    - {id: screenshot, needs: none, shows: interface, how: "A real capture of the application that a person provides (media/recordings/<id>.png): the agent only crops it and marks it (numbers, frames, arrows) and never redraws it. Without the capture the asset stays scripted with a brief of what to capture (media/scripts/<id>.md)"}
  animated_gif:
    - {id: vhs, needs: {bin: vhs}, only: terminal, how: ".tape script → GIF (only if it shows a terminal)"}
    - {id: agent-svg-animated, needs: none, how: "SVG animated with CSS (processes, diagrams that build up); in creator it goes up as an EMBED package (coursekit media embed)"}
    - {id: remotion-gif, needs: {bin: node, path: tools/remotion/node_modules}, how: "Short Remotion animation exported to GIF"}
    - {id: screen-recording, needs: {bin: ffmpeg}, shows: interface, how: "A short real recording of the application that a person provides (media/recordings/<id>.mp4), cut and converted to GIF with ffmpeg. Without it the asset stays scripted with a recording brief"}
  terminal_demo:
    - {id: asciinema, needs: {bin: asciinema}, only: terminal, how: ".cast recording + web player in an EMBED package (copyable text)"}
    - {id: vhs, needs: {bin: vhs}, only: terminal, how: "Video alternative: .tape script → MP4"}
  video:
    - {id: montage, needs: {bin: node, path: tools/remotion/node_modules}, how: "A montage of scenes as data (media/scripts/<id>.video.yaml, `coursekit video`): the scenes of the library, of the project or of the course, in the theme of the course, each lasting what its voice lasts; a new scene, composed from the atoms of the library, when none tells the idea"}
    - {id: remotion, needs: {bin: node, path: tools/remotion/node_modules}, how: "Programmed video (React) with diagrams, theme tokens, voice-over (voice) and captions (subtitles). Remotion is free for small teams; larger companies need a licence (remotion.dev/license)"}
    - {id: vhs, needs: {bin: vhs}, only: terminal, how: "Terminal video"}
    - {id: screen-recording, needs: {bin: node, path: tools/remotion/node_modules}, shows: interface, how: "Tutorial of a real application over a real screen recording that a person provides (media/recordings/<id>.mp4): the agent adds narration, captions, zooms and highlights with Remotion and draws nothing of the interface. Without the recording the asset stays scripted with a recording brief (media/scripts/<id>.md). An official-channel video (coursekit videos) is the alternative"}
  audio:
    - {id: voice, needs: none, how: "Voice-over with the `voice` chain + transcript"}
  simulation:
    - {id: agent-html, needs: none, how: "Self-contained HTML/JS with the theme tokens.css → request_embed_upload (EMBED)"}

# Lighter media, locally and without credits. `coursekit media optimize CODE [ID…]` applies it in place to the file of the
# produced assets (run it before uploading to creator); the html backend applies it to the copy it puts in the package (the
# source file is not touched), to the images and videos above the threshold.
optimize:
  image:
    max_width: 1920       # px: a wider image is scaled down keeping its proportions (0 = never scale)
    quality: 82           # JPEG and WebP quality, 1-100
    webp_from_kb: 200     # html backend: a PNG or JPEG above this weight goes into the package as WebP
  video:
    max_height: 1080      # px: a taller video is scaled down (0 = never scale)
    crf: 26               # H.264 quality: lower is sharper and heavier (18 near lossless, 28 light)
    preset: medium        # ffmpeg speed: ultrafast … veryslow (slower is lighter at the same quality)
    audio_kbps: 128       # AAC audio bitrate
    from_mb: 8            # html backend: an MP4 above this weight is re-encoded for the package (needs ffmpeg)

# What `coursekit media check CODE [ID…]` looks at in the audios and videos produced, before they go to the course, and the
# contact sheet of `coursekit media sheet CODE ID` (frames of a video in one image, to look at it without playing it).
checks:
  loudness_lufs: -16      # integrated loudness of the voice-over (EBU R128 for the web and courses); `--fix` brings it there
  true_peak_db: -1        # the highest peak allowed
  loudness_tolerance: 1   # LU around loudness_lufs that still pass
  max_cps: 17             # characters per second of a caption: a faster one cannot be read in time
  sheet_frames: 24        # frames in a contact sheet
  sheet_width: 480        # px of each frame of the sheet

# What a resource shows. The interface of a real application (a platform, a program, a website, an app) is never imitated, drawn
# or recreated, not even approximately: it appears only as real material (a capture or a recording of it, a video of an official
# channel). An invented interface is allowed only in the decision-based simulations (`:::scenario`, `:::conversation`), where the
# application is fictional. Each resource of `required_for` says what it shows before it is produced with a generated recipe:
# `coursekit media set CODE ID --depicts interface|concept` (`concept`: an idea, a diagram, a scene; `interface`: a real one).
depicts:
  required_for: [image, infographic, diagram, animated_gif, video]
  interface_recipes: [imported, screenshot, screen-recording, vhs, asciinema]   # the only recipes that may make what shows a real interface

# Types whose production uses the tokens of the theme (theme/tokens.json, or the course's own): `coursekit media plan`
# warns when the tokens are missing or were not derived from the theme of the platform (`/define-theme`), and
# `coursekit media set --status produced` refuses (unless --force) and remembers which tokens the asset was made with.
uses_theme: [infographic, diagram, animated_gif, simulation, video, terminal_demo]

# Resources are validated in the assembled course (preview), not one by one.
statuses: [pending, scripted, produced, uploaded]
