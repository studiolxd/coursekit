# Default production rules. A project overrides them in config/rules.yaml or project.yaml › rules,
# and a course in course.yaml › rules (see `coursekit config`). Structure (units, sections,
# objectives, hours) is NOT fixed here: it comes from each course's approved instructional design
# (courses/<CODE>/design/matrix.json). These are the checks applied on top of it.

pages_per_hour: 10
words_per_page: 500            # minimum learner-facing words = hours x 10 x 500

# Defaults for new courses (each course can change them in its course.yaml).
defaults:
  approach: expository         # expository: each section explains, then practises and assesses
                               # decision-based: each section opens with a simulation (see decision_based below)
  intro_section: true          # first section of every unit: introduction and objectives
  summary_section: true        # last section of every unit: summary
  structure: sin_modulos       # slxd patronEstructural: sin_modulos | con_modulos
  grading:
    passing_score: 50
    attempts: 2

# Review of each unit before its sign-off.
review:
  ai: required                 # required: an AI review (coursekit review, then `coursekit reviewed`) comes before the sign-off
                               # skip: a unit that verifies counts as reviewed and the person's sign-off is the review
                               # (either way a person can record their own review of a unit: coursekit reviewed CODE N --by NAME)

# `coursekit handoff`: the whole production of a course by itself, signing as "Coursekit Handoff" (no person reviews it).
handoff:
  rounds: 2                    # attempts per step (writing a unit, reviewing it with its fixes, the design sign-off, media, assembly,
                               # delivery) before it stops and tells the person where it is; `coursekit handoff CODE` carries on
  media_tools: []              # programs the media agent may run when nobody can approve them (the handoff, `--headless`), besides
                               # `coursekit`, `npx`, Python and those the recipes of the media configuration declare in `needs`
                               # (bin, media); add the rest here, e.g. [blender, gs]. `bash`, `sh` and `node` let the agent run any
                               # command: add them only if you accept that

# Decision-based courses (course.yaml › design.approach: decision-based). The learner does not start by reading: every content
# section opens with a simulation where they decide, get it wrong or right and see the consequences, and only then reads,
# practises and is assessed. The course keeps every other directive and resource around the simulations.
decision_based:
  cycle: [challenge, explanation, practice, decide_again, closing]   # order of the parts of a content section:
                               # challenge     a simulation opens the section, with no text before it
                               # explanation   any content, built on what the learner has just lived through
                               # practice      interactive directives and questions on what was explained
                               # decide_again  a second, shorter simulation or a variant, applying what was learnt
                               # closing       the key idea and the link to the next challenge
  optional: [decide_again]     # parts of the cycle the writer may leave out when the section has practised enough
  min_simulations_per_content_section: 1
  rewind: true                 # the learner may go back to a checkpoint of a simulation and try another path
  decision_seconds: 15         # time of a simulation: the words of its longest path (situation, variants, decisions taken,
                               # feedback, debriefing) count like any text of its section, at the words-per-hour pace, plus
                               # these seconds to think each decision. The scored simulations of assessment.md count in the
                               # activities section of their unit (a section without objectives), which the design reserves

# Guidance for the instructional design proposal (given to the design agent).
design:
  competencies_per_course: "2–4"
  objectives_per_unit: "2–4"
  intro_summary_hours: "0.2–0.3"

# Assembly in creator: its code block takes only the languages of its `codeLanguage` list (`get_brick_type_schema` CODE). When it
# adds some, list them here and coursekit uses them: `plaintext` for the blocks that show output, `shell` ("Terminal") for those
# made of commands and for `console`/`terminal` fences, `powershell` for PowerShell, `diff`, `dockerfile`, `http`.
assembly:
  code_languages: []           # e.g. [plaintext, shell, powershell, diff, dockerfile, http]

content:
  word_margin: 0.05                    # recommended margin over the minimum (warning only)
  word_margin_max: 0.15                # above the minimum by more than this, the section lasts longer than its hours (warning only)
  placeholders_per_hour: 2.5           # multimedia placeholders per unit hour (rounded up)
  min_placeholder_types: 4             # capped by the number of placeholders required
  interactive_per_hour: 4              # distinct interactive directives per content-section hour
  min_interactive_per_content_section: 1
  questions_per_objective: 5           # summative question bank, per objective of the unit
  placeholder_types: [image, video, animated_gif, infographic, diagram, simulation, terminal_demo, audio]
  # Directives and their creator bricks: config/directives.yaml
  allowed_symbols: "★✔✘·—‹›"
