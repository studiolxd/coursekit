# Default production rules. A project overrides them in config/rules.yaml or project.yaml › rules,
# and a course in course.yaml › rules (see `coursekit config`). Structure (units, sections,
# objectives, hours) is NOT fixed here: it comes from each course's approved instructional design
# (courses/<CODE>/design/matrix.json). These are the checks applied on top of it.

pages_per_hour: 10
words_per_page: 500            # minimum learner-facing words = hours x 10 x 500

# Defaults for new courses (each course can change them in its course.yaml).
defaults:
  approach: expository         # expository: each section explains, then practises and assesses
                               # decision-based: each section opens with a simulation (see decision_based below)
  intro_section: true          # first section of every unit: introduction and objectives
  summary_section: true        # last section of every unit: summary
  structure: sin_modulos       # slxd patronEstructural: sin_modulos | con_modulos
  design_tool: slxd            # where the instructional design is made: slxd (the design matrix of slxd, by MCP) |
                               # local (design/design.yaml in the project, checked and exported by `coursekit design`;
                               # no slxd needed)
  grading:
    passing_score: 50
    attempts: 2

# How the texts name people (the learners, the clients, a team): the design, the writing and the review follow it, and
# `coursekit verify` warns with the words of the language (lang/<code>.yaml › inclusive). A course may set its own.
inclusive_language: neutral    # none: the generic masculine where the language has one (es: «los alumnos»)
                               # neutral: collective and epicene words, «quien», «la persona» (es: «el alumnado», «quien aprende»;
                               #   en: singular they); no doubling and no slashes. verify warns about generic words and slashes
                               # split: both forms in full where the language marks gender (es: «el alumno y la alumna»), a neutral
                               #   word when there is one; no slashes. verify warns about slashes
                               # slash: both forms with a slash (es: «el/la alumno/a»); hard to read and to hear in a screen reader

# Review of each unit before its sign-off.
review:
  ai: required                 # required: an AI review (coursekit review, then `coursekit reviewed`) comes before the sign-off
                               # skip: a unit that verifies counts as reviewed and the person's sign-off is the review
                               # (either way a person can record their own review of a unit: coursekit reviewed CODE N --by NAME)
  scripts: required            # required: a person approves the brief of a screen recording and the montage of a video (its steps
                               # and the narration the learner will hear) with `coursekit approve script CODE --asset ID` before it is
                               # captured or voiced, and again if it changes; none: they are made without (the handoff signs them)
  media_style: required        # required: a person signs the style guide of the media before any visual resource is produced,
                               # and again if it changes: the project's (theme/branding/media-style.md) once for every course with
                               # `coursekit approve media-style`, a course's own with `coursekit approve media-style CODE`; the
                               # handoff signs it itself. none: the guide is used without a signature

# `coursekit handoff`: the whole production of a course by itself, signing as "Coursekit Handoff" (no person reviews it).
handoff:
  rounds: 2                    # attempts per step (writing a unit, reviewing it with its fixes, the design sign-off, media, assembly,
                               # delivery) before it stops and tells the person where it is; `coursekit handoff CODE` carries on
  stop_on_unchecked_videos: true   # the handoff stops before the content goes into creator while videos the agent proposed from
                               # an official channel (coursekit videos) wait for a person to approve or reject them; `false` goes on
  media_tools: []              # programs the media agent may run when nobody can approve them (the handoff, `--headless`), besides
                               # `coursekit`, `npx`, Python and those the recipes of the media configuration declare in `needs`
                               # (bin, media); add the rest here, e.g. [blender, gs]. `bash`, `sh` and `node` let the agent run any
                               # command, and `*` lets it run any program directly: add them only if you accept that (what is
                               # always denied, such as git push or coursekit approve, stays denied)

# The parts of a content section of an expository course (`approach: expository`), in order: the first principles of
# instruction, with the learning of adults (the learner sees what a section is for in their work and starts from what they
# already know or do). A project or a course keeps only the parts it wants (an empty list: no cycle). The introduction of
# the unit does the activation and its summary the integration when they are in the cycle; a content section does them only
# when it brings something of its own.
expository:
  cycle: [problem, activation, demonstration, application, integration]
                               # problem        a task or a situation of the work of the audience, and why it matters to them
                               # activation     what the learner already knows or does, or what the previous unit taught
                               # demonstration  the principle shown on a worked example, step by step, with its reasoning
                               # application    the learner does it, with feedback and less help each time: the learning
                               #                activities of the objectives of the section
                               # integration    how they will use it in their own work

# Decision-based courses (course.yaml › design.approach: decision-based). The learner does not start by reading: every content
# section opens with a simulation where they decide, get it wrong or right and see the consequences, and only then reads,
# practises and is assessed. The course keeps every other directive and resource around the simulations.
decision_based:
  cycle: [challenge, explanation, practice, decide_again, closing]   # order of the parts of a content section:
                               # challenge     a simulation opens the section, with no text before it
                               # explanation   any content, built on what the learner has just lived through
                               # practice      interactive directives and questions on what was explained
                               # decide_again  a second, shorter simulation or a variant, applying what was learnt
                               # closing       the key idea and the link to the next challenge
  optional: [decide_again]     # parts of the cycle the writer may leave out when the section has practised enough
  min_simulations_per_content_section: 1
  rewind: true                 # the learner may go back to a checkpoint of a simulation and try another path
  decision_seconds: 15         # time of a simulation: the words of its longest path (situation, variants, decisions taken,
                               # feedback, debriefing) count like any text of its section, at the words-per-hour pace, plus
                               # these seconds to think each decision. The scored simulations of assessment.md count in the
                               # activities section of their unit (a section without objectives), which the design reserves

# Guidance for the instructional design proposal (given to the design agent).
design:
  competencies_per_course: "2–4"
  objectives_per_unit: "2–4"
  unit_hours_step: 0.5          # the hours of each unit are a multiple of this (0.5: whole or half hours; 0: any). The units are
                               # seen by people (the course sheet, the catalog, a certificate); the sections are not, and take
                               # any split inside their unit. `coursekit sync` warns about a unit that does not fit
  intro_share: 0.05             # the introduction takes at most this share of the hours of its unit, and the summary
  summary_share: 0.05           # this one: they present and recap, they do not teach (a unit of 2 h: 0.1 h each). The hours
                               # round up to the next 0.05 h; `coursekit sync` warns about one that takes more

# Common errors (misconceptions): what the audience gets wrong today, and why, per objective. The design lists them in
# courses/<CODE>/design/misconceptions.yaml, signed with the design; the content puts each one in front of the learner (a
# distractor that ends with ‹id›, a simulation decision with `error: id`) and its feedback or debriefing explains it.
misconceptions:
  per_objective: 2             # common errors the design lists for each objective (`coursekit approve design` asks for them);
                               # 0: the course does without them (verify then checks the file only if there is one)

# Readability of the prose (warnings of `coursekit verify`, per section). The index is the language's: Szigriszt-Pazos
# (INFLESZ) in Spanish, Flesch in English; both read alike (65 or more easy, 55-65 normal, 40-55 somewhat hard). Other
# languages get only the length of their sentences. Directives, placeholders, headings, tables and code are not measured.
readability:
  audience: general            # basic | general | specialist: how demanding the prose may be for the people of the course
  long_sentence_words:         # a sentence with more words than this is long
    basic: 25
    general: 30
    specialist: 40
  long_share_max: 0.2          # share of long sentences in a section above which verify warns
  min_index:                   # index below which verify warns
    basic: 65
    general: 55
    specialist: 40
  min_sentences: 10            # a section with fewer sentences of prose is not measured

# The reference material (brief/): searching it for what a section needs (`coursekit brief CODE --find` / `--section`).
brief:
  passage_words: 200           # the material is cut into passages of about this many words (and at every heading)
  passages: 8                  # passages a search returns (--top changes it)
  large_words: 20000           # above this many words of material, the writer searches it per section instead of reading it
  reference_sources_max: 5     # official documentation or regulation the design agent proposes to add to the brief of a course

# The optional check of a unit for out-of-date content (`/update-unit`, a reviewer session that reads official sources).
update:
  mode: "off"                  # "off" | propose | apply (quoted: an unquoted off is a boolean in YAML)
                               #   off      the step does not run by itself (`/update-unit CODE N` still works, and `--apply` writes)
                               #   propose  the handoff runs it before the AI review and writes reviews/unit-NN-currency.md only
                               #   apply    the handoff runs it and writes the plain-fact changes that have an official source

# Assembly in creator: its code block takes only the languages of its `codeLanguage` list (`get_brick_type_schema` CODE). When it
# adds some, list them here and coursekit uses them: `plaintext` for the blocks that show output, `shell` ("Terminal") for those
# made of commands and for `console`/`terminal` fences, `powershell` for PowerShell, `diff`, `dockerfile`, `http`.
assembly:
  code_languages: []           # e.g. [plaintext, shell, powershell, diff, dockerfile, http]

# What must not appear in the content of a course: `coursekit verify` reports each occurrence as an error. Empty by default.
# A course sets its own in course.yaml › rules › forbidden (a list replaces this one).
forbidden:
  hosts: []                    # sites whose address must not appear, subdomains included, e.g. [youtube.com, youtu.be, vimeo.com]
  allow_channels: []           # official channels whose videos are fine on those sites, e.g. ["@MicrosoftTeams", "UC…"], by handle,
                               # id, name or address (`coursekit videos check` asks the site who publishes each video)
  terms: []                    # words or phrases that must not appear (case-insensitive, whole words), e.g. ["a region's name"]

content:
  word_margin: 0.05                    # recommended margin over the minimum (warning only)
  word_margin_max: 0.15                # above the minimum by more than this, the section lasts longer than its hours (warning only)
  import_max_growth: 2.0               # imported course: content.md may have up to this many times the words of its package (the new
                                       # activities of the design add some); above it `verify` fails: the client's text is reused, not rewritten
  placeholders_per_hour: 2.5           # multimedia placeholders per unit hour (rounded up)
  min_placeholder_types: 4             # capped by the number of placeholders required
  interactive_per_hour: 4              # distinct interactive directives per content-section hour
  min_interactive_per_content_section: 1
  questions_per_objective: 5           # summative question bank, per objective of the unit
  bank_practice_overlap: 0.5           # a question of the test bank whose words (question and options) are this share or more of
                                       # all the words it and a practice question of the content have between them repeats its
                                       # situation: the test has to be a new one. `verify` warns (0: not checked)
  reflections_per_unit: 1              # :::reflection in the summary section (or the last one): the learner looks back at what
                                       # they did and how they will apply it (warning only; 0: not checked)
  chunk_max_words: 250                 # cognitive load: the most words of prose the learner reads in a row, without a heading, a
                                       # directive, a medium, a highlight (`>`), a list or a table (a blank line does not break
                                       # it). `verify` warns, except in an imported course (0: not checked)
  placeholder_types: [image, illustration, icon, video, animated_gif, infographic, diagram, simulation, terminal_demo, audio, job_aid]
  # Visual support of the sections: the resources a learner sees that carry the idea (a photo that conveys the concept, a
  # capture of the application, an illustration, a large icon, an infographic, a diagram, a video...). Interactive directives
  # do not count: they are something else. `visual_sections`: the kinds of section that always carry at least one (an
  # introduction and a summary are read best with an image). `visual_decision`: every content section carries one, or says
  # why it does not with `<!-- NO IMAGE: reason -->` (the word of the course language: `lang/<code>.yaml › no_visual`), so the
  # writer always asks whether a section would read better with one; a section with an infographic or a diagram needs no more.
  visual_types: [image, illustration, icon, infographic, diagram, animated_gif, video, terminal_demo]
  visual_sections: [intro, summary]
  visual_decision: true
  # Directives and their creator bricks: config/directives.yaml
  allowed_symbols: "★✔✘·—‹›"
