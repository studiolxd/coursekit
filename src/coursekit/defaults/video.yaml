# The style of the videos made as a montage (`coursekit video`), on top of the theme of the course (its colours and font
# families come from theme/tokens.json, never from here; the shapes and the weights, from here). A project changes it in
# config/video.yaml, and a course in the `video:` section of its course.yaml (for example, a calmer motion for one course).

# How things move. `character` picks a preset: calm (slow entrances, soft springs), balanced, lively (quick, snappy) or none
# (everything appears at its moment, with no movement); `enter`, `stagger`, `fade` and `damping` (frames, and the damping of the
# springs) override the preset one by one. `entrance` is how things enter: auto (each piece its own way: rising, from its side,
# growing), fade (they appear), rise (they rise a little), slide (from their side), scale (they grow) or none; a scene may change
# it (`entrance`), and also whether its items enter one by one as the narration names them or all together (`reveal`).
motion:
  character: balanced
  entrance: auto
  # enter: 18           # frames an element takes to enter
  # stagger: 6          # frames between the elements of a list
  # fade: 10            # frames a scene takes to fade in and out
  # damping: 18         # higher is calmer

# The background of the scenes that do not ask for one: plain, shape (soft shapes of the accent) or band.
background: shape

# A scene with a photo for background (`background: photo`) lays a veil over it, so its texts and marks read: `color`, a colour
# of the theme (background, surface or accent; the texts take the colours that read on it) or none (no veil: only for a calm,
# light photo); `opacity`, from 0 (the photo as it is) to 1 (no photo). A scene may change both (`veil`, `veil_opacity`).
# How one scene gives way to the next. `type`: cut, fade (one dissolves into the other: with the same background only the content
# changes), dip (through the background colour), push (the new one pushes the old one aside, `direction`), wipe (a band of the
# accent crosses the frame and uncovers the next) or auto (coursekit picks: fade between scenes on the same background, dip when
# it changes, wipe into a chapter, fade into the close). `frames`: how long it lasts (null: those of motion.fade); it takes that
# time from the margin after the narration of the scene before (pad_seconds), so voices never overlap. `allow`: the types a
# script may ask for (empty: all). A scene asks for its own entrance with `transition:` in the script (a type, or type and
# direction).
transition:
  type: auto
  frames: null
  direction: left
  allow: []

# The charts of the videos (the `chart` scene), from the rules of data graphics of the brand. `series`: the colours of the
# series in order, each a role of the theme or a hex (the data palette of the brand). `single`: the colour of a chart of one
# series, the bars of the chart scene (null: the first of `series`).
# `bar`: px of thickness of a bar. `end`: px of rounding of the end of a bar, its base straight (null: the corner of the style).
# `rest`: with `stress` (one bar stands out), the others: dim (their colour at 35 %) or muted (in `rest_color`, a role or a hex).
chart:
  series: [accent]
  single: null
  bar: 56
  end: null
  rest: dim
  rest_color: border

# The bars that show an advance (the pause of a question, the progress of a video): `track`, the colour of the rail (a role or
# a hex); `fill`, the colour of what is done; `outline`, a line of `fill` around the rail, so an empty rail still shows;
# `height`, px of height of the bar of a question (across the whole width of the content).
progress:
  track: border
  fill: accent-ink
  outline: false
  height: 10

# How a scene marks the word the narration stresses (`stress` of a quote, a key phrase, a title): underline (a line that draws
# itself under it), highlight (a band of the accent behind it) or colour (the word turns to the accent).
stress: underline

photo_veil:
  color: background
  opacity: 0.82

# A logo on some scenes: `file` is a path from the project (an image of theme/branding/, for example), `corner` one of
# top-left, top-right, bottom-left, bottom-right, `scenes` the types of scene it goes on, and `size` its height in px.
logo:
  file: null
  corner: bottom-right
  scenes: [title, outro]
  size: 64

# The shapes of the panels, images and marks, on top of the theme. null keeps the theme's radius (a theme from creator
# brings none: then the radius of each piece) and each piece's soft shadow; `shadow: none` takes the shadows away.
shapes:
  radius: null          # px of the corners, e.g. 0 for square corners
  shadow: null          # none, or null for the soft shadow of each piece
  border: null          # px of the border of the panels; null: the piece's own (2)

# The weights of the text: what a piece draws at 600 or more is `strong`, the rest `normal`. null: what each piece draws.
weights:
  normal: null          # e.g. 300
  strong: null          # e.g. 500

# The fonts of the videos, so that they do not depend on what the machine has: a stylesheet of the project with @font-face
# rules (the font files it points to, relative to it, inside the project; they go inside the video). The family names must
# be the ones of the theme. null: the fonts of the brand (media.yaml › fonts: theme/branding/fonts/fonts.css by default).
fonts: null             # e.g. theme/branding/fonts/fonts.css

# The typography of each role of the text. `size` is the reference size of the role (px of a 1920 x 1080 frame): a project that
# changes it scales every text of that role in proportion to what each piece draws (a long title still shrinks to fit). `family`
# is a family of the fonts of the brand (theme/branding/fonts/fonts.css; another one is warned of and left out); `color` the name
# of a role of the theme (text, headings, text-muted, accent-ink…), never a hex: a text on the accent or on a dark photo keeps
# its ink. `weight`, `style` (normal, italic), `transform` (none, uppercase, lowercase, capitalize), `tracking` (px between
# letters), `leading` (the line height, e.g. 1.2), `numeric` (tabular: figures of one width, so a counter does not jump) and
# `measure` (the longest line, in characters). null: what each piece draws. A course changes them in its course.yaml › video.
text:
  display:    {size: 104, family: null, weight: null, style: null, transform: null, tracking: null, leading: null, color: null}  # the title of a cover
  heading:    {size: 88,  family: null, weight: null, style: null, transform: null, tracking: null, leading: null, color: null}  # the title of the other scenes
  subheading: {size: 44,  family: null, weight: null, style: null, transform: null, tracking: null, leading: null, color: null}  # the line under a title
  kicker:     {size: 36,  family: null, weight: null, style: null, transform: uppercase, tracking: 2, leading: null, color: null}  # the label over a title
  body:       {size: 48,  family: null, weight: null, style: null, transform: null, tracking: null, leading: null, color: null, measure: null}  # points, columns, notes
  quote:      {size: 84,  family: null, weight: null, style: null, transform: null, tracking: null, leading: null, color: null, measure: null}  # the phrase of a quote
  statement:  {size: 92,  family: null, weight: null, style: null, transform: null, tracking: null, leading: null, color: null, measure: null}  # the phrase to keep
  label:      {size: 40,  family: null, weight: null, style: null, transform: null, tracking: null, leading: null, color: null}  # names, roles, the titles of layers
  stat:       {size: 220, family: null, weight: null, style: null, transform: null, tracking: null, leading: null, color: null, numeric: null}  # the figure of a stat
  step:       {size: 40,  family: null, weight: null, style: null, transform: null, tracking: null, leading: null, color: null, numeric: null}  # the number of a step
  caption:    {size: 36,  family: null, weight: null, style: null, transform: null, tracking: null, leading: null, color: null}  # sources, notes, the smallest
  code:       {size: 34,  family: null, weight: null, style: null, transform: null, tracking: null, leading: null, color: null}  # code (a monospaced font when the brand has none)

# What the brand allows of the scenes and layers of the library (and of the project): coursekit offers every possibility, and
# the project (or a course, in the `video:` section of its course.yaml) narrows them. For each piece, `allow` gives the values a
# prop may take, `defaults` the value it takes when the script says nothing (with one value allowed, that one), and `<name>:
# false` leaves the piece out. `"*"` is for every piece that has the prop (also the ones coursekit adds later); the piece's own
# rule wins over it. The catalog the agent reads and both galleries show only what is allowed; `coursekit video check` refuses
# the rest and the render does not start (in the handoff it is a warning, and its log lists it).
scenes: {}
# e.g.
# scenes:
#   "*": {allow: {align: [left]}}                       # no centred texts in this brand
#   title: {allow: {background: [plain, accent, photo]}, defaults: {background: plain}}
#   quote: false                                        # not used

# The frame of a new video, and the air after the narration of each scene.
format: {width: 1920, height: 1080, fps: 30}
pad_seconds: 0.5

# The zooms of a screen recording (the `screencast` scene). A zoom is for a detail that does not read at full size (a word, an
# indicator, one line of a change), never to go with every sentence: a focus with the box of what it shows (`box`, the events
# of the recording give it) goes only as close as that box fits, keeps it whole in the frame and draws a mark around it in a
# tone that reads on its background; without a box it zooms on its point and draws no mark.
screencast:
  scale: 1.4                   # how close a zoom goes at most (1 is the whole screen)
  ease: 1.2                    # s a zoom takes to go in and out
  lead: 0.4                    # s it starts going in before its words are said, so the eye is there when they are
  min_hold: 3.5                # s a zoom stays at least (else until the end of the sentence that names it)
  margin: 0.06                 # share of the frame left around the box of a focus
  pad_seconds: 1.0             # s the recording goes on after the narration of a screencast scene (instead of pad_seconds)
  mark: true                   # a mark around what a focus shows, when its box is known
  max_per_minute: 2            # `coursekit video check` warns above this many zooms a minute of recording
  min_gap: 4                   # s between the end of a zoom and the next one (closer, a warning)
