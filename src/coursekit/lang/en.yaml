# Tokens of the content format in English.
section: Section
objective: Objective
assessment_activity: ASSESSMENT ACTIVITY
placeholder: MEDIA ASSET
placeholder_fields: [Title, Description, How it is made, Specifications]
intro_title: Introduction and objectives
summary_title: Summary
intro_pattern: '^\s*introduction'
summary_pattern: '^\s*(summary|wrap-up|conclusion)'
unit: Unit
min_words: min. {words} words
question_objective_key: "objective:"
thousands_separator: ","
assessment_instructions: Instructions for the learner
assessment_bank: Question bank
download: Download
learner: You                          # the learner when they speak in a dialogue (no portrait)
note: Note
stopwords:                           # words left out when searching the material (coursekit brief --find)
  [a, about, after, all, also, an, and, any, are, as, at, be, been, but, by, can, could, do, does, for, from, had, has,
   have, he, her, his, how, i, if, in, into, is, it, its, more, most, "no", not, of, "on", one, or, other, our, she, so,
   some, than, that, the, their, them, then, there, these, they, this, to, up, was, we, were, what, when, which, who,
   will, with, would, you, your]
reflection: Think it over         # title of a :::reflection without its own

# Resource types of the media placeholders: the id (configuration, manifest) -> what is written in the content.
media_types:
  image: Image
  video: Video
  animated_gif: Animated GIF
  infographic: Infographic
  diagram: Diagram
  simulation: Interactive simulation
  terminal_demo: Interactive terminal demo
  audio: Audio
# Keys of the "key: value" lines of the directives (the objective key is question_objective_key) ...
directive_keys:
  question: question
  answer: answer
  answers: answers
  feedback: feedback
  feedback_correct: feedback-correct
  feedback_incorrect: feedback-incorrect
  image: image
  position: position
  title: title
# ... and the words some of them take.
directive_words:
  "true": "true"
  "false": "false"
  starts: starts
  contains: contains

