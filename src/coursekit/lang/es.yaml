# Keys of the "key: value" lines of the directives (the objective key is question_objective_key) ...
directive_keys:
  question: pregunta
  answer: respuesta
  answers: respuestas
  feedback: feedback
  feedback_correct: feedback-correcto
  feedback_incorrect: feedback-incorrecto
  image: imagen
  position: posición
  title: título
