# Tokens of the content format in Spanish (what writers type and the verifier reads).
section: Apartado                     # "## Apartado N — Title"
objective: Objetivo                   # "*[Objetivo U1.2 — Verbo]*"
assessment_activity: ACTIVIDAD DE EVALUACIÓN
placeholder: RECURSO MULTIMEDIA       # "> **[RECURSO MULTIMEDIA — Imagen]**"
placeholder_fields: [Título, Descripción, Cómo se elabora, Especificaciones]
intro_title: Introducción y objetivos
summary_title: Resumen
intro_pattern: '^\s*introducci[oó]n'
summary_pattern: '^\s*(resumen|s[ií]ntesis|conclusi[oó]n)'
unit: Unidad
min_words: mín. {words} palabras
source_words: "paquete: {words} palabras"
no_source: sin página equivalente en el paquete
question_objective_key: "objetivo:"
thousands_separator: "."
assessment_instructions: Instrucciones para el alumnado
assessment_bank: Banco de preguntas
question_bank_title: Banco de preguntas    # the creator content of the questions when they go out as a bank (creator backend)
assessment_unit_title: Evaluación    # the package of the tests when they go apart (delivery › assessment › placement: separate)
download: Descargar
learner: Tú                          # the learner when they speak in a dialogue (no portrait)
note: Nota
stopwords:                           # words left out when searching the material (coursekit brief --find)
  [a, al, algo, ante, antes, como, con, contra, cual, cuando, de, del, desde, donde, dos, durante, e, el, ella, ellos, en,
   entre, era, es, esa, ese, eso, esta, este, esto, estos, fue, ha, hay, la, las, le, les, lo, los, mas, me, mi, muy, ni,
   "no", nos, o, os, para, pero, por, porque, que, se, "si", sin, sobre, son, su, sus, tambien, te, tiene, todo, tu, un, una,
   uno, unos, y, ya, yo]
reflection: Para reflexionar      # title of a :::reflection without its own

# Verbs an objective starts with, by revised Bloom level (`coursekit design` warns when the verb and the level differ),
# and verbs that cannot be observed (it warns when an objective starts with one). Without accents is fine: compared without them.
bloom_verbs:
  remember: [recordar, nombrar, enumerar, listar, identificar, reconocer, definir, citar, localizar, memorizar]
  understand: [explicar, describir, resumir, interpretar, clasificar, comparar, ejemplificar, parafrasear, distinguir, inferir]
  apply: [aplicar, usar, utilizar, ejecutar, implementar, emplear, resolver, calcular, configurar, realizar, demostrar, gestionar]
  analyze: [analizar, diferenciar, examinar, organizar, relacionar, contrastar, detectar, diagnosticar, descomponer, investigar]
  evaluate: [evaluar, valorar, juzgar, justificar, decidir, priorizar, criticar, argumentar, verificar, seleccionar, elegir]
  create: [crear, diseñar, elaborar, planificar, producir, construir, redactar, componer, desarrollar, proponer, generar]
vague_verbs: [comprender, conocer, saber, entender, aprender, familiarizarse, apreciar, asimilar, dominar, ser]

