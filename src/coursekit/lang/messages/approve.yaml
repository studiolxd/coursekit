# Messages of `coursekit approve` (sign-offs) and `coursekit reviewed`.
no_identity:
  es: "no hay identidad de firma: ejecuta `coursekit setup --identity` (COURSEKIT_USER_NAME / _EMAIL en .env)"
  en: "no signing identity: run `coursekit setup --identity` (COURSEKIT_USER_NAME / _EMAIL in .env)"
matrix_missing:
  es: "falta design/matrix.json: pide al agente de diseño que exporte antes el diseño"
  en: "design/matrix.json is missing: ask the design agent to export the design first"
design_errors:
  es: "el diseño tiene {count} errores de validación (design/validation.json)"
  en: "the design has {count} validation errors (design/validation.json)"
excel_none: {es: "(ninguno)", en: "(none)"}
design_summary:
  es: "{code} — {title} ({hours} h)\n  matriz de slxd: {matrix_id} · actualizada {updated}\n  unidades: {units} · Excel: {excel}"
  en: "{code} — {title} ({hours} h)\n  slxd matrix: {matrix_id} · updated {updated}\n  units: {units} · Excel: {excel}"
design_summary_story:
  es: "  biblia narrativa: {path} (se firma con el diseño)"
  en: "  story bible: {path} (signed with the design)"
story_problems:
  es: "la biblia narrativa no está lista:\n  {problems}"
  en: "the story bible is not ready:\n  {problems}"
design_summary_misconceptions:
  es: "  errores típicos: {path}, {count} (se firman con el diseño)"
  en: "  common errors: {path}, {count} (signed with the design)"
misconceptions_problems:
  es: "los errores típicos del diseño no están listos:\n  {problems}"
  en: "the common errors of the design are not ready:\n  {problems}"
style_no_samples:
  es: "no hay muestras de estilo en {path}: el agente de multimedia las produce antes (un fondo, un personaje en varias expresiones y algunos objetos)"
  en: "there are no style samples in {path}: the media agent produces them first (a background, a character in several expressions and some objects)"
style_summary:
  es: "{code} — lámina de estilo\n  estilo: {style}\n  muestras: {files}"
  en: "{code} — style sheet\n  style: {style}\n  samples: {files}"
style_confirm:
  es: "{summary}\n¿Apruebas este estilo para las imágenes de las simulaciones? Firmas como {who}"
  en: "{summary}\nApprove this style for the images of the simulations? You sign as {who}"
style_approved: {es: "lámina de estilo ({style}) aprobada por {who}", en: "style sheet ({style}) approved by {who}"}
style_approved_uncommitted:
  es: "lámina de estilo ({style}) aprobada por {who} (registrado, sin commit)"
  en: "style sheet ({style}) approved by {who} (recorded, not committed)"
design_confirm:
  es: "{summary}\n¿Apruebas este diseño instruccional? Firmas como {who}"
  en: "{summary}\nApprove this instructional design? You sign as {who}"
cancelled: {es: "aprobación cancelada", en: "approval cancelled"}
design_approved_uncommitted:
  es: "diseño aprobado por {who} (registrado, sin commit)"
  en: "design approved by {who} (recorded, not committed)"
design_approved: {es: "diseño aprobado por {who}", en: "design approved by {who}"}
unit_not_found: {es: "unidad {n} no encontrada", en: "unit {n} not found"}
unit_fails_verification_errors:
  es: "la unidad {n} no pasa la verificación ({count} errores: coursekit verify)"
  en: "unit {n} does not pass verification ({count} errors: coursekit verify)"
needs_review:
  es: "la unidad {n} está '{status}': necesita antes la revisión (con IA: coursekit review y coursekit reviewed; de una persona: coursekit reviewed CODE N --by NOMBRE)"
  en: "unit {n} is '{status}': it needs its review first (AI: coursekit review and coursekit reviewed; a person's: coursekit reviewed CODE N --by NAME)"
changed_since_review:
  es: "la unidad {n} ha cambiado desde la revisión con IA ({parts}): vuelve a revisarla con `coursekit review` o firma igualmente con --force"
  en: "unit {n} changed after its AI review ({parts}): review it again with `coursekit review` or sign anyway with --force"
review_missing: {es: "falta la revisión con IA {path}", en: "missing AI review {path}"}
content_confirm:
  es: "¿Apruebas la unidad {n} — {title} (mín. {words} palabras)? Firmas como {who}"
  en: "Approve unit {n} — {title} (min. {words} words)? You sign as {who}"
unit_approved_uncommitted:
  es: "unidad {n} aprobada por {who} (registrada, sin commit)"
  en: "unit {n} approved by {who} (recorded, not committed)"
unit_approved: {es: "unidad {n} aprobada por {who}", en: "unit {n} approved by {who}"}
file_missing: {es: "falta {path}", en: "missing {path}"}
unit_fails_verification:
  es: "la unidad {n} no pasa la verificación"
  en: "unit {n} does not pass verification"
reviewed: {es: "unidad {n}: revisada", en: "unit {n}: reviewed"}
reviewed_course:
  es: "unidad {n}: revisada · curso {old} -> {new}"
  en: "unit {n}: reviewed · course {old} -> {new}"
reviewed_human: {es: "unidad {n}: revisada por {by}", en: "unit {n}: reviewed by {by}"}
reviewed_human_course:
  es: "unidad {n}: revisada por {by} · curso {old} -> {new}"
  en: "unit {n}: reviewed by {by} · course {old} -> {new}"
reviewed_by_note: {es: "Unidad {n}: revisada por {by}", en: "Unit {n}: reviewed by {by}"}
report_not_found: {es: "no existe el informe {path}", en: "the report {path} does not exist"}
report_outside:
  es: "el informe {path} debe estar dentro de la carpeta del curso {course} (lo normal: reviews/)"
  en: "the report {path} must be inside the folder of course {course} (usually reviews/)"
script_summary: {es: "guion de {id} ({code}): {files}, en media/scripts/ (los pasos y la locución que oirá el alumno)", en: "script of {id} ({code}): {files}, in media/scripts/ (the steps and the narration the learner will hear)"}
script_confirm: {es: "¿Aprobar el {summary}? Firmas como {who}", en: "Approve the {summary}? You sign as {who}"}
script_approved: {es: "guion de {id} aprobado por {who}", en: "script of {id} approved by {who}"}
script_approved_uncommitted: {es: "guion de {id} aprobado por {who} (sin commit: no es un repositorio git o no hay cambios)", en: "script of {id} approved by {who} (not committed: not a git repository or nothing changed)"}
media_style_missing: {es: "{code} no tiene guía de estilo de los recursos (theme/branding/media-style.md, del proyecto o del curso): la escribe /define-theme a partir de la marca (coursekit brand)", en: "{code} has no style guide of the media (theme/branding/media-style.md, of the project or of the course): /define-theme writes it from the brand (coursekit brand)"}
media_style_missing_project: {es: "el proyecto no tiene guía de estilo de los recursos (theme/branding/media-style.md): la escribe /define-theme a partir de la marca (coursekit brand)", en: "the project has no style guide of the media (theme/branding/media-style.md): /define-theme writes it from the brand (coursekit brand)"}
media_style_confirm_project: {es: "¿Has leído la guía de estilo de los recursos {path} y la apruebas para todos los cursos que la usan? Firmas como {who}", en: "Have you read the style guide of the media {path}, and do you approve it for every course that uses it? You sign as {who}"}
media_style_confirm: {es: "¿Has leído la guía de estilo de los recursos {path} y la apruebas para {code}? Firmas como {who}", en: "Have you read the style guide of the media {path}, and do you approve it for {code}? You sign as {who}"}
media_style_approved: {es: "guía de estilo {path} aprobada por {who}", en: "style guide {path} approved by {who}"}
media_style_approved_uncommitted: {es: "guía de estilo {path} aprobada por {who} (registrado, sin commit)", en: "style guide {path} approved by {who} (recorded, not committed)"}
