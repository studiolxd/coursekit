# Messages of `coursekit assemble` (plan, diff and applied state of the creator backend).
unknown_directive:
  es: "directiva desconocida ':::{name}'"
  en: "unknown directive ':::{name}'"
image_not_produced:
  es: "labelled-graphic: la imagen '{image}' aún no está producida"
  en: "labelled-graphic: image '{image}' not produced yet"
one_correct_option:
  es: ":::{name} necesita exactamente una opción correcta"
  en: ":::{name} needs exactly one correct option"
true_false_answer:
  es: ":::true-false necesita '{key}: {true}|{false}'"
  en: ":::true-false needs '{key}: {true}|{false}'"
fill_blank:
  es: ":::fill-in-the-blank necesita huecos escritos como {example} en '{key}:'"
  en: ":::fill-in-the-blank needs blanks written as {example} in '{key}:'"
pasapalabra_items:
  es: "elementos de :::pasapalabra: '- A ({starts}|{contains}): definición :: RESPUESTA'"
  en: ":::pasapalabra items: '- A ({starts}|{contains}): definition :: ANSWER'"
foreign_key:
  es: "la clave '{key}:' es del idioma «{language}»; en este curso se usan: {valid}"
  en: "the key '{key}:' belongs to the language '{language}'; this course uses: {valid}"
not_supported:
  es: ":::{name} ({brick}) aún no está soportada por el ensamblador"
  en: ":::{name} ({brick}) is not supported by the assembler yet"
no_panels:
  es: ":::{name} no tiene paneles: cada uno empieza con una línea '#### Título'"
  en: ":::{name} has no panels: each one starts with a '#### Title' line"
section_not_in_design:
  es: "{section} {n} no está en el diseño"
  en: "{section} {n} is not in the design"
lesson_without_content:
  es: "{key}: lección sin contenido"
  en: "{key}: lesson without content"
plan_missing:
  es: "falta {name}: ejecuta antes `coursekit assemble plan`"
  en: "missing {name}: run `coursekit assemble plan` first"
lesson_not_in_plan:
  es: "la lección {key} no está en el plan"
  en: "lesson {key} not in the plan"
brick_count_mismatch:
  es: "{ids} ids de brick pero el plan tiene {bricks} bricks en {key}"
  en: "{ids} brick ids but the plan has {bricks} bricks in {key}"
recorded_lesson:
  es: "registrada {key} ({count} bricks)"
  en: "recorded {key} ({count} bricks)"
recorded_title:
  es: "registrado el título del contenido: {title}"
  en: "recorded content title: {title}"
recorded_checked:
  es: "unidad {n}: registrado el cierre del montaje (comprobaciones hechas sobre lo que hay ahora en creator)"
  en: "unit {n}: assembly closing recorded (checks done on what is in creator now)"
checked_not_in_sync:
  es: "unidad {n}: lo registrado de creator no coincide con el plan; registra primero el montaje (`assemble applied`) y haz las comprobaciones después"
  en: "unit {n}: what is recorded of creator does not match the plan; record the assembly first (`assemble applied`) and do the checks after"
course_assembled:
  es: " · curso: media -> assembly"
  en: " · course: media -> assembly"
linked:
  es: "unidad {n} -> {what}"
  en: "unit {n} -> {what}"
linked_content: {es: "contenido de creator {value}", en: "creator content {value}"}
linked_preview: {es: "preview {value}", en: "preview {value}"}
linked_review: {es: "enlace de revisión {value}", en: "review link {value}"}
character_not_produced:
  es: "dialog: el retrato de '{name}' aún no está subido (coursekit media extract y /produce-media)"
  en: "dialog: the portrait of '{name}' is not uploaded yet (coursekit media extract and /produce-media)"
character_other_content:
  es: "dialog: el retrato de '{name}' ({asset}) está subido al contenido de la unidad {unit}, no al de esta (creator solo toma una imagen de su propio contenido): súbelo aquí con request_asset_upload, regístralo con coursekit media set {code} {asset} --unit {n} --asset-path <ruta> y monta de nuevo"
  en: "dialog: the portrait of '{name}' ({asset}) is uploaded to the content of unit {unit}, not to this one (creator takes an image only from its own content): upload it here with request_asset_upload, record it with coursekit media set {code} {asset} --unit {n} --asset-path <path> and assemble again"
keep_ids_nothing_recorded:
  es: "la lección {key} no tiene ids registrados: pasa la lista con --brick-ids o --brick-ids-file"
  en: "lesson {key} has no recorded ids: give the list with --brick-ids or --brick-ids-file"
keep_ids_count:
  es: "la lección {key} tenía {ids} bloques registrados y el plan tiene {bricks}: se añadieron o borraron bloques, pasa la lista completa con --brick-ids o --brick-ids-file"
  en: "lesson {key} had {ids} recorded bricks and the plan has {bricks}: bricks were added or deleted, give the whole list with --brick-ids or --brick-ids-file"
simulation_media_missing:
  es: "simulación '{id}': {count} imágenes aún sin producir (fondos, capas o retratos: coursekit media extract y /produce-media)"
  en: "simulation '{id}': {count} images not produced yet (backgrounds, layers or portraits: coursekit media extract and /produce-media)"
adaptive_neutral:
  es: "{key}: creator no adapta el contenido: se monta la versión neutra (:::else) del bloque «{condition}»"
  en: "{key}: creator does not adapt content: the neutral version (:::else) of the block «{condition}» is assembled"
simulation_not_uploaded:
  es: "{key}: la simulación '{id}' no está subida: coursekit media embed CODE {asset}, súbela como EMBED y regístrala (media set --status uploaded --asset-path …); mientras, va una nota"
  en: "{key}: simulation '{id}' is not uploaded: coursekit media embed CODE {asset}, upload it as an EMBED and record it (media set --status uploaded --asset-path …); meanwhile a note stands for it"
simulation_note:
  es: "Simulación pendiente de montar ({asset})."
  en: "Simulation still to be assembled ({asset})."
