# Output of `coursekit brand` and the files it writes in the brand folder (theme/branding/, or a course's).
links_style_heading: {es: "# Webs de las que inferir el estilo", en: "# Websites to infer the style from"}
links_template:
  es: |
    # Material de marca

    <!-- Una URL por línea (sola o como elemento de lista), con una nota opcional detrás de " — ". Se lee su contenido:
    un Storybook entero (páginas y componentes), una web de marca o una documentación, en Markdown en text/web/. -->

    # Webs de las que inferir el estilo

    <!-- La web de la empresa, del proyecto o de un producto: no se lee su texto, se abre en un navegador y se observa su
    estilo (variables CSS, colores, tipografías, radios, sombras, logo, capturas) en text/observed/. Son pistas, no reglas. -->
  en: |
    # Brand material

    <!-- One URL per line (alone or as a list item), with an optional note after " — ". Its content is read: a whole
    Storybook (pages and components), a brand website or a documentation, as Markdown in text/web/. -->

    # Websites to infer the style from

    <!-- The website of the company, of the project or of a product: its text is not read, it is opened in a browser and its
    style is observed (CSS variables, colours, fonts, radius, shadows, logo, screenshots) in text/observed/. Clues, not rules. -->
notes_template:
  es: |
    # Indicaciones sobre la marca

    <!-- Lo que el material no dice o lo que quieres que pese más: «la lavanda solo como relleno», «sin logo en los vídeos»,
    «nada de fotografía de stock con personas posando»… El agente lo lee antes que el resto. -->
  en: |
    # Notes on the brand

    <!-- What the material does not say or what should weigh more: "lavender only as a fill", "no logo in the videos",
    "no stock photographs of people posing"… The agent reads it before the rest. -->
google_licence: {es: "{family}: Google Fonts, con licencia abierta (OFL o Apache): https://fonts.google.com/specimen/{family}/license", en: "{family}: Google Fonts, under an open licence (OFL or Apache): https://fonts.google.com/specimen/{family}/license"}
sheet_kept: {es: "{path} no lo escribió coursekit: se conserva tal cual (bórralo para que lo genere con las fuentes de la marca)", en: "{path} was not written by coursekit: it is kept as it is (delete it to have it written from the fonts of the brand)"}
index_title: {es: "# Material de marca", en: "# Brand material"}
index_intro:
  es: "> Generado por `coursekit brand`. No lo edites: cambia `sources/`, `links.md` o `notes.md` y vuelve a ejecutarlo. Agentes: leed este índice, luego `notes.md`, y después el material de `text/` que os toque."
  en: "> Written by `coursekit brand`. Do not edit it: change `sources/`, `links.md` or `notes.md` and run it again. Agents: read this index, then `notes.md`, then the material of `text/` your task needs."
index_notes: {es: "Indicaciones en `notes.md`: {answer}", en: "Notes in `notes.md`: {answer}"}
"yes": {es: "sí", en: "yes"}
"no": {es: "no", en: "no"}
index_empty: {es: "Aún no hay material: deja ficheros en `sources/` o URL en `links.md` y vuelve a ejecutar `coursekit brand`.", en: "No material yet: leave files in `sources/` or URLs in `links.md` and run `coursekit brand` again."}
