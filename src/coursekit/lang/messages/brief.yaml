# Text of brief/index.md (written in the language of the content, for the agents) and the notes about each file
# (shown in the index in the language of the content and by `coursekit brief` in the language of the person).
index_title: {es: "# Material de referencia — {code}", en: "# Reference material — {code}"}
index_generated:
  es: |
    > Generado por `coursekit brief`. No lo edites: cambia `sources/`, `links.md` o `notes.md` y
    > vuelve a ejecutarlo. Agentes: leed este índice, luego `notes.md` y abrid en `text/` solo
    > lo que toque a vuestra tarea. Los originales de `sources/` solo para imágenes.
  en: |
    > Generated by `coursekit brief`. Do not edit it: change `sources/`, `links.md` or `notes.md` and
    > run it again. Agents: read this index, then `notes.md`, and open in `text/` only what your
    > task needs. The originals in `sources/` only for images.
index_updated:
  es: "Actualizado: {date} · {documents} documentos · {webs} webs · {words} palabras · indicaciones en `notes.md`: {notes}"
  en: "Updated: {date} · {documents} documents · {webs} webs · {words} words · indications in `notes.md`: {notes}"
answer_yes: {es: "sí", en: "yes"}
answer_no: {es: "no", en: "no"}
index_general:
  es: "Material general del proyecto: `{general}` (léelo también)."
  en: "General material of the project: `{general}` (read it too)."
section_documents: {es: "## Documentos", en: "## Documents"}
header_documents:
  es: "| Documento | Texto | Palabras | Avisos |"
  en: "| Document | Text | Words | Warnings |"
section_webs: {es: "## Webs", en: "## Web pages"}
header_webs:
  es: "| URL | Nota | Texto | Páginas | Palabras | Descargada | Avisos |"
  en: "| URL | Note | Text | Pages | Words | Downloaded | Warnings |"
web_text_index: {es: "`{folder}/` (índice: `README.md`)", en: "`{folder}/` (index: `README.md`)"}
section_other: {es: "## Imágenes, audio y vídeo", en: "## Images, audio and video"}
other_intro:
  es: "Sin texto: las imágenes se abren directamente desde `sources/`."
  en: "No text: open the images directly from `sources/`."
header_other: {es: "| Fichero | Tipo | Avisos |", en: "| File | Type | Warnings |"}
index_empty:
  es: "Sin material todavía: deja ficheros en `sources/` o URLs en `links.md`."
  en: "No material yet: put files in `sources/` or URLs in `links.md`."
kind_document: {es: documento, en: document}
kind_image: {es: imagen, en: image}
kind_media: {es: "audio/vídeo", en: "audio/video"}
note_heavy:
  es: "pesa {mb} MB: mejor fuera de git (enlace o transcripción)"
  en: "weighs {mb} MB: better outside git (a link or a transcript)"
note_no_transcript:
  es: "sin transcripción: añade un .vtt/.txt con el texto"
  en: "no transcript: add a .vtt/.txt with the text"
note_markitdown_missing: {es: "falta MarkItDown (coursekit setup)", en: "MarkItDown is missing (coursekit setup)"}
note_convert_failed: {es: "no se pudo convertir: {error}", en: "could not be converted: {error}"}
note_no_text: {es: "casi sin texto: ¿escaneado? necesita OCR", en: "almost no text: scanned? it needs OCR"}
note_node_missing: {es: "falta Node (nodejs.org)", en: "Node is missing (nodejs.org)"}
note_pages_failed:
  es: "algunas páginas fallaron (coursekit brief --refresh)"
  en: "some pages failed (coursekit brief --refresh)"
note_pages_blocked:
  es: "{count} página(s) respondieron vacías o con un control contra robots y no se pudieron abrir con un navegador de la máquina (Chrome o Edge): {pages}. Busca otra fuente oficial (para la normativa europea, el texto del DOUE en boe.es)"
  en: "{count} page(s) answered empty or with a check against robots and could not be opened in a browser of the machine (Chrome or Edge): {pages}. Look for another official source (for European law, the text of the Official Journal on boe.es)"
note_pages_rendered: {es: "{count} página(s) leídas con el navegador de la máquina (la descarga directa estaba bloqueada)", en: "{count} page(s) read with the browser of the machine (the direct download was blocked)"}
rendering: {es: "{url} está bloqueada para una descarga directa: abriéndola con el navegador de la máquina …", en: "{url} is blocked for a direct download: opening it with the browser of the machine …"}
note_document: {es: "documento {kind} (convertido como los de sources/)", en: "{kind} document (converted as the ones in sources/)"}
note_document_no_text:
  es: "el documento no tiene texto que extraer (¿un PDF escaneado?): pásalo por OCR y déjalo en sources/"
  en: "the document has no text to extract (a scanned PDF?): run it through OCR and put it in sources/"
note_no_web_text:
  es: "no se extrajo texto (¿web con JavaScript?)"
  en: "no text was extracted (a web page that needs JavaScript?)"
downloading: {es: "descargando {url} …", en: "downloading {url} …"}
note_exe_report: {es: "paquete de eXeLearning: el detalle de la conversión está en `import-report.md`", en: "eXeLearning package: the details of the conversion are in `import-report.md`"}
note_exe_missing_words: {es: "faltan {count} palabras del origen en el Markdown (ver `import-report.md`)", en: "{count} words of the source are missing in the Markdown (see `import-report.md`)"}
note_exe_unmapped: {es: "iDevices sin regla importados como texto: {kinds}", en: "iDevices with no rule imported as text: {kinds}"}
note_exe_missing_images: {es: "{count} imágenes que el paquete no trae", en: "{count} images the package does not contain"}
downloading_storybook: {es: "descargando el Storybook {url} entero (páginas y componentes) …", en: "downloading the whole Storybook {url} (pages and components) …"}
note_storybook: {es: "un Storybook: todas sus páginas y componentes, con sus props e historias (índice en su README.md)", en: "a Storybook: all its pages and components, with their props and stories (index in its README.md)"}
note_storybook_index_only: {es: "un Storybook sin manifiestos publicados: solo la lista de sus entradas, no su contenido", en: "a Storybook with no published manifests: only the list of its entries, not their content"}
