stage_mounted: {es: "escenario {name} montado en {folder} ({home})", en: "stage {name} mounted in {folder} ({home})"}
stage_home_real: {es: "con la carpeta personal de esta máquina", en: "with the home folder of this machine"}
stage_home_clean: {es: "con una carpeta personal vacía", en: "with an empty home folder"}
bad_shape: {es: "«{shape}» no es una forma de marca: {shapes}", en: "«{shape}» is not a shape of mark: {shapes}"}
