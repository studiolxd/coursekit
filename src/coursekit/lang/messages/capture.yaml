# Messages of `coursekit capture` (real captures of an application, with the permission of a person).
not_enabled: {es: "la captura está desactivada en este proyecto: activa capture.yaml › enabled (config/capture.yaml)", en: "capture is turned off in this project: turn on capture.yaml › enabled (config/capture.yaml)"}
bad_name: {es: "«{name}» no es un nombre de perfil: minúsculas, cifras y guiones", en: "«{name}» is not a profile name: lowercase letters, digits and hyphens"}
unknown_profile: {es: "el perfil {name} no está en capture.yaml › profiles (hay: {known})", en: "the profile {name} is not in capture.yaml › profiles (there are: {known})"}
bad_start_url: {es: "el perfil {name} necesita una start_url http(s) completa (tiene: {url})", en: "the profile {name} needs a full http(s) start_url (it has: {url})"}
no_domains: {es: "el perfil {name} necesita allow_domains: los únicos dominios que la captura puede abrir", en: "the profile {name} needs allow_domains: the only domains the capture may open"}
start_outside: {es: "la start_url del perfil {name} ({host}) no está en sus allow_domains", en: "the start_url of the profile {name} ({host}) is not in its allow_domains"}
playwright_missing: {es: "la captura necesita el extra capture de coursekit: uv tool install \"slxd-coursekit[capture]\" (o pip install \"slxd-coursekit[capture]\")", en: "capture needs the capture extra of coursekit: uv tool install \"slxd-coursekit[capture]\" (or pip install \"slxd-coursekit[capture]\")"}
no_browser: {es: "no hay Chrome, Edge ni Chromium instalado: la captura abre el navegador de la máquina", en: "there is no Chrome, Edge or Chromium installed: capture opens the browser of the machine"}
browser_failed: {es: "el navegador no se pudo abrir o se cerró con un error: {reason}", en: "the browser could not open or closed with an error: {reason}"}
no_identity: {es: "el permiso de captura lo firma una persona: define COURSEKIT_USER_NAME y COURSEKIT_USER_EMAIL (coursekit setup --identity)", en: "the permission to capture is signed by a person: set COURSEKIT_USER_NAME and COURSEKIT_USER_EMAIL (coursekit setup --identity)"}
mode_not_allowed: {es: "el modo {mode} no está permitido en este proyecto (capture.yaml › modes: {modes})", en: "the mode {mode} is not allowed in this project (capture.yaml › modes: {modes})"}
browser_needs_profile: {es: "no se sabe con qué perfil se abre {id}: dilo en el bloque capture del guion (profile: NOMBRE) o en el permiso (--profile); hay: {known}", en: "it is not known which profile {id} opens with: say it in the capture block of the brief (profile: NAME) or in the permission (--profile); there are: {known}"}
not_logged_in: {es: "el perfil {name} no tiene sesión: una persona inicia sesión con coursekit capture login {name}", en: "the profile {name} has no session: a person logs in with coursekit capture login {name}"}
desktop_needs_window: {es: "no se sabe qué ventana se captura para {id}: dilo en el bloque capture del guion (window: NOMBRE) o en el permiso (--window)", en: "it is not known which window is captured for {id}: say it in the capture block of the brief (window: NAME) or in the permission (--window)"}
not_interface: {es: "{ids} no son recursos de {code} que muestren una interfaz (coursekit media set CODE ID --depicts interface)", en: "{ids} are not resources of {code} that show an interface (coursekit media set CODE ID --depicts interface)"}
no_interface_assets: {es: "{code} no tiene recursos que muestren una interfaz: no hay nada que capturar", en: "{code} has no resources that show an interface: there is nothing to capture"}
bad_minutes: {es: "la duración del permiso no puede ser negativa (0: hasta que se retire)", en: "the permission cannot last a negative time (0: until it is revoked)"}
no_expiry: {es: "cuando se retire (coursekit capture revoke)", en: "when it is revoked (coursekit capture revoke)"}
needs_target: {es: "{action} necesita el perfil o el código del curso", en: "{action} needs the profile or the code of the course"}
needs_mode: {es: "allow necesita --mode: browser, desktop, terminal o all (se puede repetir)", en: "allow needs --mode: browser, desktop, terminal or all (it can be repeated)"}
login_open: {es: "se abre el navegador con el perfil {name}: inicia sesión y ciérralo cuando termines (coursekit no ve la contraseña)", en: "the browser opens with the profile {name}: log in and close it when you are done (coursekit never sees the password)"}
login_done: {es: "sesión guardada en el perfil {name} ({at})", en: "session kept in the profile {name} ({at})"}
logout_done: {es: "perfil {name} borrado con su sesión", en: "profile {name} deleted with its session"}
logout_none: {es: "el perfil {name} no tenía sesión", en: "the profile {name} had no session"}
allowed: {es: "permiso de captura para {scope}: {modes}; recursos: {assets}; caduca {until}", en: "permission to capture for {scope}: {modes}; resources: {assets}; expires {until}"}
scope_project: {es: "todo el proyecto", en: "the whole project"}
every_course: {es: "los de todos los cursos que muestran una interfaz", en: "those of every course that show an interface"}
open_profile: {es: "el perfil que diga el guion", en: "the profile the brief says"}
open_window: {es: "la ventana que diga el guion", en: "the window the brief says"}
ids_need_course: {es: "los recursos son de un curso: da el permiso con coursekit capture allow CODE ID… (sin código, el permiso es de todo el proyecto)", en: "resources belong to a course: give the permission with coursekit capture allow CODE ID… (without a code, the permission is for the whole project)"}
session_needs_mode: {es: "{id} se puede capturar en varios modos ({modes}): di cuál en el bloque capture del guion (mode: …)", en: "{id} can be captured in several modes ({modes}): say which in the capture block of the brief (mode: …)"}
every_interface_asset: {es: "todos los que muestran una interfaz", en: "every one that shows an interface"}
revoked: {es: "permiso de captura de {code} retirado", en: "permission to capture of {code} taken back"}
revoke_none: {es: "{code} no tenía permiso de captura", en: "{code} had no permission to capture"}
profile_line: {es: "{name} · {account} · {url} · {state}", en: "{name} · {account} · {url} · {state}"}
session_since: {es: "sesión desde {at}", en: "session since {at}"}
no_session: {es: "sin sesión", en: "no session"}
not_configured: {es: "ya no está en capture.yaml (coursekit capture logout lo borra)", en: "no longer in capture.yaml (coursekit capture logout deletes it)"}
no_profiles: {es: "no hay perfiles en capture.yaml › profiles", en: "there are no profiles in capture.yaml › profiles"}
needs_one_id: {es: "{action} necesita el código del curso y un recurso", en: "{action} needs the code of the course and one resource"}
no_recording: {es: "no hay grabación ni captura de {id}: déjala en {folder}.png o .mp4, o di cuál con --file", en: "there is no recording or capture of {id}: drop it in {folder}.png or .mp4, or say which with --file"}
bad_recording: {es: "{name} no es una imagen (png, jpg, webp) ni un vídeo (mp4, mov, webm, mkv)", en: "{name} is not an image (png, jpg, webp) or a video (mp4, mov, webm, mkv)"}
original_in_git: {es: "el original {path} ya estaba en git: sale del proyecto, pero sigue en el historial; quítalo de él si tenía datos reales", en: "the original {path} was already in git: it leaves the project, but it stays in the history; remove it from there if it had real data"}
redacted: {es: "{id}: tapado ({found}) en {file}; revísalo en {review} y apruébalo con coursekit capture approve", en: "{id}: covered ({found}) in {file}; review it in {review} and approve it with coursekit capture approve"}
review_nothing: {es: "nada encontrado", en: "nothing found"}
review_title: {es: "Revisión de la captura {id} ({code})", en: "Review of the capture {id} ({code})"}
review_found: {es: "Tapado: {found}. Lectura: {engine}, {frames} fotograma(s).", en: "Covered: {found}. Reading: {engine}, {frames} frame(s)."}
review_how:
  es: "Lo enmarcado está tapado. Comprueba que no queda ningún dato real (nombres, correos, teléfonos, cuentas, caras, documentos): si todo está bien, coursekit capture approve {code} {id}; si falta algo, coursekit capture reject {code} {id} --note \"…\" --mask \"texto\" y vuelve a taparlo con coursekit capture redact {code} {id}."
  en: "What is framed is covered. Check that no real data is left (names, emails, phone numbers, accounts, faces, documents): if all is well, coursekit capture approve {code} {id}; if something is missing, coursekit capture reject {code} {id} --note \"…\" --mask \"text\" and cover it again with coursekit capture redact {code} {id}."
nothing_to_review: {es: "{id} no tiene una captura que revisar (coursekit capture redact)", en: "{id} has no capture to review (coursekit capture redact)"}
not_captured: {es: "{id} no tiene una captura pendiente de revisión (está: {state})", en: "{id} has no capture waiting for review (it is: {state})"}
reject_needs_note: {es: "reject necesita --note con lo que falta o --mask con lo que hay que tapar", en: "reject needs --note with what is missing or --mask with what to cover"}
decided_approved: {es: "{id}: captura aprobada; el original se ha borrado y /produce-media ya puede componer el recurso", en: "{id}: capture approved; the original is deleted and /produce-media can compose the resource now"}
decided_rejected: {es: "{id}: captura rechazada; tápala de nuevo con coursekit capture redact {code} {id}", en: "{id}: capture rejected; cover it again with coursekit capture redact {code} {id}"}
bad_login_url: {es: "la login_url del perfil {name} tiene que ser una dirección http(s) completa (tiene: {url})", en: "the login_url of the profile {name} must be a full http(s) address (it has: {url})"}
bad_block: {es: "el bloque capture de {path} no es YAML válido: {error}", en: "the capture block of {path} is not valid YAML: {error}"}
outside_screen: {es: "({x}, {y}) está fuera de la pantalla: usa las coordenadas de la última captura", en: "({x}, {y}) is outside the screen: use the coordinates of the last screenshot"}
grant_gone: {es: "el permiso de captura de {code} ya no está en vigor (caducó o se retiró): la sesión termina; una persona lo da de nuevo con coursekit capture allow", en: "the permission to capture of {code} is no longer in force (it expired or was taken back): the session ends; a person gives it again with coursekit capture allow"}
session_expired: {es: "la sesión del perfil {name} ha caducado (se ha llegado a su página de acceso): la captura termina; una persona inicia sesión con coursekit capture login {name}", en: "the session of the profile {name} expired (its login page was reached): the capture ends; a person logs in with coursekit capture login {name}"}
secret_field: {es: "el campo activo es una contraseña o un código: el agente nunca escribe en él", en: "the focused field is a password or a code: the agent never types into it"}
domain_blocked: {es: "{host} no está en los allow_domains del perfil: la captura no sale de la aplicación", en: "{host} is not in the allow_domains of the profile: the capture never leaves the application"}
bad_recipe: {es: "{id} no se hace con una captura: su receta tiene que ser {recipes} (coursekit media set)", en: "{id} is not made from a capture: its recipe must be {recipes} (coursekit media set)"}
no_grant: {es: "no hay permiso en vigor para capturar {id} de {code} en ese modo: una persona lo da con coursekit capture allow --mode … (todo el proyecto) o coursekit capture allow {code} --mode …", en: "there is no permission in force to capture {id} of {code} in that mode: a person gives it with coursekit capture allow --mode … (the whole project) or coursekit capture allow {code} --mode …"}
pixel_check_off: {es: "sin OCR (extra capture o tesseract) las capturas solo se limpian en la página: el texto dentro de imágenes o de un canvas no se tapa", en: "without an OCR (the capture extra or tesseract) the captures are only cleaned in the page: text inside images or a canvas is not covered"}
page_not_clean: {es: "la página no ha terminado de limpiarse a tiempo: no se captura; espera y vuelve a intentarlo", en: "the page did not finish being cleaned in time: nothing is captured; wait and try again"}
no_session_started: {es: "no hay ninguna sesión: empieza con session_start", en: "there is no session: start with session_start"}
session_running: {es: "ya hay una sesión de {id}: termínala con session_end", en: "there is already a session of {id}: finish it with session_end"}
session_started: {es: "sesión de {id} en {url} (solo {domains}); los datos personales ya están sustituidos en pantalla", en: "session of {id} at {url} (only {domains}); personal data is already replaced on screen"}
session_ended: {es: "pasos escritos en {brief}; datos sustituidos: {found}", en: "steps written in {brief}; data replaced: {found}"}
session_waits: {es: "{file} espera a que una persona lo revise (coursekit capture review {code} {id}) y lo apruebe", en: "{file} waits for a person to review it (coursekit capture review {code} {id}) and approve it"}
session_replay: {es: "el vídeo se graba al repetir los pasos: coursekit capture replay {code} {id}", en: "the video is recorded when the steps are repeated: coursekit capture replay {code} {id}"}
shot_saved: {es: "captura guardada en {path}", en: "capture saved in {path}"}
replay_not_found: {es: "paso {n}: no se encuentra {target} en la pantalla (ni hay una posición a la que volver): ajusta el bloque capture del guion", en: "step {n}: {target} is not found on screen (and there is no position to fall back on): adjust the capture block of the brief"}
replay_bad_step: {es: "paso {n}: {step} no es un paso (uno de: {kinds})", en: "step {n}: {step} is not a step (one of: {kinds})"}
replay_no_steps: {es: "el bloque capture de {path} no tiene steps: escríbelos o haz antes una sesión de captura", en: "the capture block of {path} has no steps: write them or run a capture session first"}
replay_no_frames: {es: "el navegador no ha dado ningún fotograma entre record start y record stop", en: "the browser gave no frame between record start and record stop"}
replay_nothing: {es: "los pasos de {path} no guardan nada: añade record start/stop (vídeo) o shot (imagen)", en: "the steps of {path} save nothing: add record start/stop (video) or shot (image)"}
replayed: {es: "{id}: repetido; {files}; datos sustituidos: {found}; revísalo en {review} y apruébalo con coursekit capture approve", en: "{id}: replayed; {files}; data replaced: {found}; review it in {review} and approve it with coursekit capture approve"}
desktop_unsupported: {es: "la captura de una ventana de escritorio no funciona aquí ({system}): solo en macOS, Windows y Linux con X11", en: "capturing a desktop window does not work here ({system}): only on macOS, Windows and Linux with X11"}
wayland_unsupported: {es: "esta sesión es Wayland, que no deja que un programa lea ni maneje las ventanas de otro: entra en una sesión X11 para capturar el escritorio", en: "this session is Wayland, which does not let a program read or drive the windows of another: log in to an X11 session to capture the desktop"}
xdotool_missing: {es: "la captura de escritorio en Linux necesita el programa xdotool (sudo apt install xdotool)", en: "desktop capture on Linux needs the xdotool program (sudo apt install xdotool)"}
desktop_needs_ocr: {es: "en una ventana de escritorio no hay página que limpiar: todo se tapa sobre los píxeles, y hace falta un OCR (el extra capture de coursekit o tesseract)", en: "a desktop window has no page to clean: everything is covered on the pixels, and an OCR is needed (the capture extra of coursekit or tesseract)"}
need_screen_permission: {es: "la terminal no tiene permiso de grabación de pantalla: Ajustes del Sistema › Privacidad y seguridad › Grabación de pantalla, activa tu terminal y vuelve a abrirla", en: "the terminal has no permission to record the screen: System Settings › Privacy & Security › Screen Recording, turn on your terminal and open it again"}
need_accessibility_permission: {es: "la terminal no tiene permiso de accesibilidad (para mover el ratón y teclear): Ajustes del Sistema › Privacidad y seguridad › Accesibilidad, activa tu terminal y vuelve a abrirla", en: "the terminal has no Accessibility permission (to move the mouse and type): System Settings › Privacy & Security › Accessibility, turn on your terminal and open it again"}
window_not_found: {es: "no hay ninguna ventana abierta de «{name}»; las que hay: {windows}", en: "there is no open window of «{name}»; the ones there are: {windows}"}
window_ambiguous: {es: "«{name}» coincide con ventanas de varios programas: usa un nombre más preciso al dar el permiso; las que hay: {windows}", en: "«{name}» matches windows of several programs: use a more precise name when giving the permission; the ones there are: {windows}"}
window_gone: {es: "la ventana de «{name}» se ha cerrado: la sesión no puede seguir", en: "the window of «{name}» was closed: the session cannot go on"}
not_our_window: {es: "bajo el puntero hay una ventana de {owner}, no del programa permitido: no se hace nada", en: "under the pointer there is a window of {owner}, not of the allowed program: nothing is done"}
bad_key: {es: "{key} no es una tecla que se pueda pulsar aquí", en: "{key} is not a key that can be pressed here"}
desktop_no_navigate: {es: "en una ventana de escritorio no se navega a direcciones: usa clics y teclas", en: "a desktop window does not navigate to addresses: use clicks and keys"}
window_off_main_screen: {es: "la ventana de «{name}» tiene que estar entera en la pantalla principal para grabarla", en: "the window of «{name}» must be entirely on the main screen to be recorded"}
no_login_needed: {es: "el perfil {name} no necesita iniciar sesión (login: false)", en: "the profile {name} needs no login (login: false)"}
no_login: {es: "sin inicio de sesión", en: "no login"}
course_needs_unit: {es: "el perfil course graba el propio curso: el bloque capture del guion necesita start: unit:N", en: "the profile course records the course itself: the capture block of the brief needs start: unit:N"}
bad_unit: {es: "{start} no es una unidad del curso (start: unit:N)", en: "{start} is not a unit of the course (start: unit:N)"}
no_package: {es: "la unidad {n} no está construida: coursekit assemble build {code} --unit {n}", en: "unit {n} is not built: coursekit assemble build {code} --unit {n}"}
no_review_link: {es: "la unidad {n} no tiene enlace de revisión en creator todavía: lo crea el agente de montaje (/assemble)", en: "unit {n} has no review link in creator yet: the assembly agent creates it (/assemble)"}
terminal_unsupported: {es: "el modo terminal necesita un pseudoterminal: solo macOS y Linux (en Windows, el modo desktop)", en: "the terminal mode needs a pseudo-terminal: macOS and Linux only (on Windows, the desktop mode)"}
terminal_needs_pyte: {es: "el modo terminal necesita el emulador del extra capture de coursekit: uv tool install \"slxd-coursekit[capture]\"", en: "the terminal mode needs the emulator of the capture extra of coursekit: uv tool install \"slxd-coursekit[capture]\""}
terminal_no_font: {es: "no se encuentra ninguna fuente monoespaciada para dibujar la terminal: pon su ruta en capture.yaml › terminal.font", en: "no monospaced font found to draw the terminal: set its path in capture.yaml › terminal.font"}
terminal_needs_stage: {es: "el bloque capture de {path} no dice en qué escenario se graba (stage: NOMBRE, de media/stages/NOMBRE/)", en: "the capture block of {path} does not say which stage it is recorded in (stage: NAME, from media/stages/NAME/)"}
terminal_failed: {es: "no se pudo abrir la shell del escenario: {reason}", en: "the shell of the stage could not start: {reason}"}
terminal_ended: {es: "la shell del escenario se ha cerrado: termina con session_end y vuelve a empezar", en: "the shell of the stage has closed: finish with session_end and start again"}
terminal_bad_key: {es: "«{key}» no es una tecla que se pueda enviar a la terminal (Enter, Tab, Escape, flechas, ctrl+c, shift+tab, F1…)", en: "«{key}» is not a key that can be sent to the terminal (Enter, Tab, Escape, arrows, ctrl+c, shift+tab, F1…)"}
terminal_no_pointer: {es: "en la terminal no hay puntero: usa type, key y point_text", en: "the terminal has no pointer: use type, key and point_text"}
terminal_no_navigate: {es: "la terminal no navega a direcciones: escribe la orden", en: "the terminal does not navigate to addresses: type the command"}
terminal_only: {es: "esta herramienta es del modo terminal", en: "this tool belongs to the terminal mode"}
terminal_text_not_found: {es: "«{text}» no está en la pantalla", en: "«{text}» is not on the screen"}
terminal_found: {es: "«{text}» ya está en pantalla", en: "«{text}» is on screen"}
terminal_not_found: {es: "«{text}» no ha salido en el tiempo de espera", en: "«{text}» did not come out in the time waited"}
terminal_started: {es: "sesión de {id} en la terminal, en el escenario {stage} (carpeta {folder}); se graba desde ya y los datos personales ya están sustituidos", en: "session of {id} in the terminal, in the stage {stage} (folder {folder}); it is recorded from now on and personal data is already replaced"}
terminal_leftover: {es: "puede quedar un dato personal en la grabación: {where}", en: "personal data may be left in the recording: {where}"}
terminal_no_replay: {es: "una sesión de terminal se graba mientras ocurre: no se repite; empieza otra sesión de {id} (el agente de media, con el servidor de captura)", en: "a terminal session is recorded while it happens: it is not replayed; start another session of {id} (the media agent, with the capture server)"}
stage_bad_name: {es: "«{name}» no es un nombre de escenario: minúsculas, cifras y guiones", en: "«{name}» is not a stage name: lowercase letters, digits and hyphens"}
stage_missing: {es: "no existe el escenario {name}: falta {path}", en: "the stage {name} does not exist: {path} is missing"}
stage_bad_file: {es: "el stage.yaml del escenario {name} no se puede leer: {error}", en: "the stage.yaml of the stage {name} cannot be read: {error}"}
stage_bad_home: {es: "el escenario {name} tiene home: {value}; tiene que ser real o clean", en: "the stage {name} has home: {value}; it must be real or clean"}
stage_not_ours: {es: "{path} ya existe y no lo creó coursekit: no se toca; cambia folder en el stage.yaml o mueve esa carpeta", en: "{path} already exists and coursekit did not make it: it is not touched; change folder in the stage.yaml or move that folder"}
stage_timeout: {es: "la orden «{command}» del escenario no terminó en {seconds} s", en: "the command «{command}» of the stage did not finish in {seconds} s"}
stage_failed: {es: "la orden «{command}» del escenario falló (código {code}): {reason}", en: "the command «{command}» of the stage failed (code {code}): {reason}"}
