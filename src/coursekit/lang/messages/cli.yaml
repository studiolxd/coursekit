# Output and help of the main commands (init, config, rules, agents).
report_created: {es: creado, en: created}
report_updated: {es: actualizado, en: updated}
report_unchanged: {es: sin cambios, en: unchanged}
report_kept: {es: "conservado (editado a mano, no se actualiza)", en: "kept (edited by hand, not updated)"}
not_a_project:
  es: "coursekit: {root} no es un proyecto de coursekit (no tiene {file})"
  en: "coursekit: {root} is not a coursekit project (no {file})"
already_a_project:
  es: "coursekit: {root} ya es un proyecto; usa `coursekit init --update`"
  en: "coursekit: {root} is already a project; use `coursekit init --update`"
bad_address:
  es: "coursekit: --address debe ser uno de {options}"
  en: "coursekit: --address must be one of {options}"
project_created:
  es: "proyecto de coursekit creado en {root}"
  en: "coursekit project created in {root}"
mirror_dir_saved: {es: "ok: MIRROR_DIR guardado en .env", en: "ok: MIRROR_DIR saved in .env"}
agents_summary:
  es: "agentes: {written} escritos, {unchanged} sin cambios, {removed} eliminados"
  en: "agents: {written} written, {unchanged} unchanged, {removed} removed"
agents_kept:
  es: "  conservado (no lo genera coursekit): {path}"
  en: "  kept (not generated by coursekit): {path}"
agents_updated: {es: "  actualizado: {path}", en: "  updated: {path}"}
course_not_found:
  es: "coursekit: curso {code} no encontrado ({file})"
  en: "coursekit: course {code} not found ({file})"
description: {es: "Producción de cursos e-learning asistida por IA.", en: "AI-assisted e-learning course production."}
help_help: {es: "muestra esta ayuda", en: "show this help"}
help_init:
  es: "crea un proyecto, o refresca los ficheros que coursekit generó en él"
  en: "create a project, or refresh the files coursekit generated in it"
init_folder: {es: "carpeta del proyecto (por defecto, la carpeta actual)", en: "project folder (default: current folder)"}
init_update: {es: "refresca los ficheros generados de un proyecto existente", en: "refresh generated files of an existing project"}
init_language: {es: "idioma del curso", en: "course language"}
init_ui_language: {es: "idioma de la interfaz y de lo que te dicen los agentes (por defecto, el de los cursos)", en: "language of the interface and of what the agents tell you (default: the courses' language)"}
init_address: {es: "tu | usted (es), you (en)", en: "tu | usted (es), you (en)"}
init_mirror_dir:
  es: "ruta local de la carpeta espejo sincronizada (se guarda en .env como MIRROR_DIR)"
  en: "local path of the synced mirror folder (saved in .env as MIRROR_DIR)"
init_mirror_url:
  es: "dirección web de la carpeta espejo (project.yaml › mirror.url)"
  en: "web address of the mirror folder (project.yaml › mirror.url)"
init_yes: {es: "no pregunta; usa las opciones y los valores por defecto", en: "do not ask; use the options and defaults"}
init_no_git: {es: "no ejecuta git init", en: "do not run git init"}
help_config:
  es: "muestra la configuración efectiva y dónde se define cada valor"
  en: "show the effective configuration and where each value is set"
config_name: {es: "una configuración (por defecto, todas)", en: "one configuration (default: all)"}
config_course: {es: "incluye lo que cambia este curso (código o carpeta)", en: "include the overrides of this course (code or folder)"}
config_changed: {es: "solo los valores que difieren de los del paquete", en: "only values that differ from the package defaults"}
config_json: {es: "imprime los valores fusionados como JSON", en: "print the merged values as JSON"}
help_rules:
  es: "reglas de producción vigentes para un curso, y dónde se define cada valor"
  en: "production rules in force for a course, and where each value is set"
help_uninstall:
  es: "quita lo que coursekit setup instaló fuera de los proyectos (ejecútalo antes de desinstalar el paquete)"
  en: "remove what coursekit setup installed outside the projects (run it before uninstalling the package)"
uninstall_dry_run: {es: "solo muestra lo que quitaría", en: "only show what it would remove"}
uninstall_yes: {es: "quita todo sin preguntar", en: "remove everything without asking"}
help_agents:
  es: "genera skills, comandos y ajustes de agentes para Claude Code, opencode y Codex"
  en: "generate skills, commands and agent settings for Claude Code, opencode and Codex"
next_header:
  es: "Siguiente paso: crea tu primer curso."
  en: "Next step: create your first course."
next_cd: {es: "  1. Entra en el proyecto:  cd {folder}", en: "  1. Go into the project:  cd {folder}"}
next_open:
  es: "  2. Abre tu herramienta de IA en esa carpeta: {tools}"
  en: "  2. Open your AI tool in that folder: {tools}"
next_tool_missing: {es: "{tool} (no instalado)", en: "{tool} (not installed)"}
next_command:
  es: '  3. Y lanza:  /new-course "Título del curso" <horas>'
  en: '  3. And run:  /new-course "Course title" <hours>'
next_codex:
  es: "     (en Codex, pídele ese mismo comando: seguirá .coursekit/agents/commands/new-course.md)"
  en: "     (in Codex, ask for that same command: it will follow .coursekit/agents/commands/new-course.md)"
next_run:
  es: '  También puedes hacerlo desde aquí, con el agente del rol de diseño:  coursekit run new-course "Título del curso" <horas>'
  en: '  Or do it from here, with the design role agent:  coursekit run new-course "Course title" <hours>'
next_status: {es: "  Para ver dónde estás en cualquier momento:  coursekit status", en: "  To see where you are at any time:  coursekit status"}
next_before: {es: "Antes de empezar (opcional, pero conviene):", en: "Before you start (optional, but worth it):"}
next_brief:
  es: "  · Material de partida: deja los documentos en brief/sources/, las URLs en brief/links.md y las indicaciones generales en brief/notes.md. `coursekit brief` los convierte para que los agentes los lean."
  en: "  · Reference material: drop the documents in brief/sources/, the URLs in brief/links.md and the general indications in brief/notes.md. `coursekit brief` converts them for the agents to read."
next_config:
  es: "  · Valores por defecto del proyecto: mira config/*.example.yaml (reglas, directivas, multimedia y entrega) y, para cambiar alguno, crea config/<nombre>.yaml solo con lo que cambies. `coursekit config` muestra lo que está en vigor."
  en: "  · Project defaults: look at config/*.example.yaml (rules, directives, media and delivery) and, to change one, create config/<name>.yaml with only what you change. `coursekit config` shows what is in force."
next_then: {es: "Después:", en: "Then:"}
bad_mcp_url:
  es: "coursekit: --mcp-url debe empezar por http:// o https://"
  en: "coursekit: --mcp-url must start with http:// or https://"
next_mcp:
  es: "  · Servidor MCP de slxd: falta su URL, y sin ella el diseño no puede conectar con creator. Ponla en project.yaml › platform.slxd.mcp_url y ejecuta `coursekit agents`."
  en: "  · slxd MCP server: its URL is missing, and without it the design cannot connect to creator. Set it in project.yaml › platform.slxd.mcp_url and run `coursekit agents`."
create_ask: {es: "¿Crear ya tu primer curso con {tool}?", en: "Create your first course now with {tool}?"}
material_ask:
  es: "Antes de diseñar: ¿tienes material de partida (documentos, enlaces o indicaciones) que quieras que use el diseño?"
  en: "Before designing: do you have reference material (documents, links or indications) you want the design to use?"
material_none:
  es: "  Sin material de partida: el diseño será una propuesta razonable para el título y el público, marcada como suposición. Podrás añadirlo después y pedir /design-change."
  en: "  No reference material: the design will be a reasonable proposal for the title and audience, marked as an assumption. You can add it later and ask for /design-change."
material_where:
  es: "  Déjalo ahora en el proyecto:\n    · documentos de cualquier formato: {sources}\n    · URLs de documentación web: {links}\n    · indicaciones generales: {notes}"
  en: "  Drop it in the project now:\n    · documents of any format: {sources}\n    · web documentation URLs: {links}\n    · general indications: {notes}"
material_wait: {es: "Pulsa Enter cuando lo hayas dejado", en: "Press Enter when you have put it there"}
create_title: {es: Título del curso, en: Course title}
create_title_bad: {es: "  escribe el título del curso", en: "  enter the course title"}
create_hours: {es: "Horas del curso", en: "Course hours"}
handoff_ask:
  es: "¿Hacer todo el proceso solo, hasta la entrega (modo handoff: firma como Coursekit Handoff y nadie revisa el curso)?"
  en: "Do the whole process by itself, up to the delivery (handoff mode: it signs as Coursekit Handoff and nobody reviews the course)?"
handoff_notice:
  es: "  Modo handoff: puede tardar y gastar créditos de los proveedores configurados. Si se para, continúa con `coursekit handoff <CODIGO>`."
  en: "  Handoff mode: it can take a while and spend credits of the configured providers. If it stops, carry on with `coursekit handoff <CODE>`."
create_hours_bad: {es: "  escribe un número de horas mayor que 0", en: "  enter a number of hours greater than 0"}
help_theme_source:
  es: "creator: theme del tenant (por defecto) o uno creado con el material de theme/branding/"
  en: "creator: the tenant's default theme (default) or one made from the material in theme/branding/"
next_branding_html:
  es: "  · Marca: el backend html usa la hoja de estilos theme/maqueta.css (o el aspecto base). Deja tu marca en theme/branding/ (logos, tipografías, guía) o tu propia hoja en theme/maqueta.css; sin ellas el curso sale con el aspecto base."
  en: "  · Brand: the html backend uses the stylesheet theme/maqueta.css (or the base look). Put your brand in theme/branding/ (logos, fonts, guidelines) or your own stylesheet in theme/maqueta.css; without them the course gets the base look."
next_branding_branding:
  es: "  · Marca: elegiste crear el theme con el material de branding. Déjalo en theme/branding/ (logos, tipografías, guía, colores); sin material se usa el theme del tenant."
  en: "  · Brand: you chose to make the theme from the branding material. Put it in theme/branding/ (logos, fonts, guidelines, colours); without material the tenant's default theme is used."
help_mcp_url:
  es: "URL del servidor MCP de slxd (project.yaml › platform.slxd.mcp_url)"
  en: "slxd MCP server URL (project.yaml › platform.slxd.mcp_url)"
