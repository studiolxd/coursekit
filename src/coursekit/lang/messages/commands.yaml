# Output, errors and help of the course commands (new, status, sync, outline, verify, approve, write, review, run, assemble...).

# Line prefixes shared by several commands
warning_line: {es: "AVISO   {text}", en: "WARNING {text}"}
error_line: {es: "ERROR   {text}", en: "ERROR   {text}"}
catalog_not_updated: {es: "AVISO   no se pudo actualizar el catálogo de courses/ (el cambio sí está hecho; `coursekit catalog` lo reintenta): {text}", en: "WARNING the catalog in courses/ could not be updated (the change is done; `coursekit catalog` tries again): {text}"}
mirror_not_updated: {es: "AVISO   no se pudo actualizar la carpeta espejo (el cambio sí está hecho; `coursekit publish` lo reintenta): {text}", en: "WARNING the mirror folder could not be updated (the change is done; `coursekit publish` tries again): {text}"}

# new, status, sync, outline
new_created: {es: "creado {path} ({hours} h)", en: "created {path} ({hours} h)"}
n_units_one: {es: "1 unidad", en: "1 unit"}
n_units: {es: "{n} unidades", en: "{n} units"}
n_sections_one: {es: "1 apartado", en: "1 section"}
n_sections: {es: "{n} apartados", en: "{n} sections"}
sync_summary:
  es: "{units}, {sections}, {words} palabras mínimas"
  en: "{units}, {sections}, {words} minimum words"
sync_summary_synced:
  es: "{units}, {sections}, {words} palabras mínimas · sincronizado en course.yaml"
  en: "{units}, {sections}, {words} minimum words · synced into course.yaml"
sync_written: {es: "  escrito: {path}", en: "  written: {path}"}
outline_error: {es: "coursekit: {error}", en: "coursekit: {error}"}

# verify
no_units: {es: "coursekit: no hay unidades en course.yaml", en: "coursekit: no units in course.yaml"}
no_units_n:
  es: "coursekit: no hay unidades en course.yaml con n={n}"
  en: "coursekit: no units in course.yaml with n={n}"
verify_header_ok: {es: "[OK] {code} · U{n} — {title}", en: "[OK] {code} · U{n} — {title}"}
verify_header_fail: {es: "[FALLO] {code} · U{n} — {title}", en: "[FAIL] {code} · U{n} — {title}"}
verify_stats:
  es: "  palabras {words}/{min_words} · recursos multimedia {placeholders} ({types} tipos) · preguntas formativas {formative} · preguntas del banco {bank}"
  en: "  words {words}/{min_words} · placeholders {placeholders} ({types} types) · formative questions {formative} · bank questions {bank}"

# approve
confirmed_yes: {es: "→ confirmado con --yes", en: "→ confirmed with --yes"}
confirm_prompt: {es: "[s/N] ", en: "[y/N] "}
approve_no_terminal:
  es: "coursekit: no hay terminal interactiva. Firma en tu propia terminal, o desde el chat del agente con\n  `! coursekit approve … --yes` (el `!` lo ejecuta como tú, no como el agente)"
  en: "coursekit: no interactive terminal. Sign in your own terminal, or from the agent chat with\n  `! coursekit approve … --yes` (the `!` runs it as you, not as the agent)"
approve_needs_unit: {es: "coursekit: las aprobaciones de contenido necesitan --unit N", en: "coursekit: content approvals need --unit N"}

# brief
brief_summary:
  es: "brief: {documents} documentos, {webs} webs, {media} imágenes/audio/vídeo → {target}"
  en: "brief: {documents} documents, {webs} webs, {media} images/audio/video → {target}"
brief_note: {es: "  aviso: {source}: {note}", en: "  warning: {source}: {note}"}

# write, review, run, roles
launch_warning: {es: "aviso: {warning}", en: "warning: {warning}"}
launch_unit_log:
  es: "unidad {n}: {status} · sesión en {path}"
  en: "unit {n}: {status} · session in {path}"
launch_unit_log_exit:
  es: "unidad {n}: {status} · sesión en {path} · exit {code}"
  en: "unit {n}: {status} · session in {path} · exit {code}"
nothing_to_write: {es: "nada que escribir en {code}", en: "nothing to write in {code}"}
nothing_to_review: {es: "nada que revisar en {code}", en: "nothing to review in {code}"}
unit_start:
  es: "{command} {code} · unidad {n} con {label}"
  en: "{command} {code} · unit {n} with {label}"
unit_start_headless:
  es: "{command} {code} · unidad {n} con {label} (sin interfaz)"
  en: "{command} {code} · unit {n} with {label} (headless)"
stopped_at_unit:
  es: "detenido en la unidad {n}: corrígela y lanza el comando de nuevo"
  en: "stopped at unit {n}: fix it and launch the command again"
bad_agent: {es: "--agent debe ser uno de {options}", en: "--agent must be one of {options}"}
bad_role: {es: "--role debe ser uno de {options}", en: "--role must be one of {options}"}
run_start:
  es: "/{name} {arguments} con el agente {role} ({label})"
  en: "/{name} {arguments} with the {role} agent ({label})"
run_start_headless:
  es: "/{name} {arguments} con el agente {role} ({label}) (sin interfaz)"
  en: "/{name} {arguments} with the {role} agent ({label}) (headless)"
run_session: {es: "sesión en {path}", en: "session in {path}"}
run_session_exit: {es: "sesión en {path} · exit {code}", en: "session in {path} · exit {code}"}
role_line: {es: "{role:<9} {label}", en: "{role:<9} {label}"}
role_line_missing: {es: "{role:<9} {label}  (no instalado)", en: "{role:<9} {label}  (not installed)"}

# assemble, directives
unit_not_found: {es: "coursekit: unidad {n} no encontrada", en: "coursekit: unit {n} not found"}
assemble_plan:
  es: "plan {path}: {lessons} lecciones, {bricks} bricks ({detail})"
  en: "plan {path}: {lessons} lessons, {bricks} bricks ({detail})"
link_needs_content_id: {es: "coursekit: link necesita --content-id, --preview o --review", en: "coursekit: link needs --content-id, --preview or --review"}
applied_needs_lesson:
  es: "coursekit: applied necesita --lesson y --lesson-id (o --content)"
  en: "coursekit: applied needs --lesson and --lesson-id (or --content)"
directives_ok:
  es: "ok: el registro de directivas coincide con creator ({total} bricks)"
  en: "ok: the directive registry matches creator ({total} bricks)"

# media, voice, tts, subtitles, delivery, publish, catalog, theme
action_needs_course: {es: "coursekit: esta acción necesita un código de curso", en: "coursekit: this action needs a course code"}
media_manifest: {es: "manifest: {total} recursos ({detail})", en: "manifest: {total} assets ({detail})"}
media_nothing: {es: "nada que producir", en: "nothing to produce"}
media_set_needs_id: {es: "coursekit: set necesita el id de un recurso", en: "coursekit: set needs an asset id"}
voice_set_needs: {es: "coursekit: voice set necesita CODE y PROVIDER", en: "coursekit: voice set needs CODE and PROVIDER"}
voice_warning: {es: "aviso: {warning}", en: "warning: {warning}"}
subtitles_wrote: {es: "escrito {path}", en: "wrote {path}"}
delivery_add_needs_file: {es: "coursekit: delivery add necesita --file", en: "coursekit: delivery add needs --file"}
catalog_wrote: {es: "escrito {path} ({courses} cursos, {units} unidades)", en: "wrote {path} ({courses} courses, {units} units)"}
theme_wrote: {es: "escrito {path}", en: "wrote {path}"}
theme_check_ok: {es: "  ok    {line}", en: "  ok   {line}"}
theme_check_fail: {es: "  FALLO {line}", en: "  FAIL {line}"}

