# Messages of the eXeLearning import: the errors, and the report of the conversion (written in the language of the course).
not_a_package: {es: "{file} no es un paquete de eXeLearning (.elp) legible", en: "{file} is not a readable eXeLearning package (.elp)"}
package_v4:
  es: "{file} es un paquete de eXeLearning 4 (.elpx): de momento solo se leen los .elp de eXeLearning 2 y 3 (ábrelo en eXeLearning y expórtalo como .elp)"
  en: "{file} is an eXeLearning 4 package (.elpx): only the .elp of eXeLearning 2 and 3 are read for now (open it in eXeLearning and export it as .elp)"
broken_xml: {es: "{file}: el contenido del paquete no se puede leer ({error})", en: "{file}: the content of the package cannot be read ({error})"}
no_pages: {es: "{file}: el paquete no tiene páginas", en: "{file}: the package has no pages"}
report_title: {es: "# Informe de importación de eXeLearning", en: "# eXeLearning import report"}
report_intro:
  es: "Generado por `coursekit brief`. Lo que se dejó fuera, lo que no se entendió y la comprobación palabra a palabra del texto de cada paquete."
  en: "Generated by `coursekit brief`. What was left out, what was not understood and the word-by-word check of the text of each package."
report_summary:
  es: "«{title}»: {pages} páginas, {source} palabras de texto en el origen, {output} en el Markdown, {images} imágenes copiadas."
  en: "“{title}”: {pages} pages, {source} words of text in the source, {output} in the Markdown, {images} images copied."
report_directives: {es: "Interactividad conservada: {items}.", en: "Interactivity kept: {items}."}
report_questions: {es: "Preguntas importadas: {count} (sin objetivo: el diseño o la redacción lo asignan).", en: "Questions imported: {count} (without objective: the design or the writing assigns it)."}
report_dropped: {es: "Dejado fuera por las reglas (texto y veces):", en: "Left out by the rules (text and times):"}
report_unmapped: {es: "iDevices sin regla, importados como texto (añade una regla en config/import.yaml):", en: "iDevices with no rule, imported as text (add a rule in config/import.yaml):"}
report_embeds: {es: "Contenido incrustado (vídeo, audio u otros), por proveedor:", en: "Embedded content (video, audio or others), by host:"}
report_empty_pages: {es: "Páginas sin contenido, omitidas: {pages}.", en: "Pages without content, left out: {pages}."}
report_missing_images: {es: "Imágenes que el paquete no trae: {files}.", en: "Images the package does not contain: {files}."}
report_fidelity_ok: {es: "Comprobación palabra a palabra: no falta ninguna palabra del origen.", en: "Word-by-word check: no word of the source is missing."}
report_fidelity: {es: "Comprobación palabra a palabra: faltan en el Markdown estas palabras del origen: {words}.", en: "Word-by-word check: these words of the source are missing in the Markdown: {words}."}
note_untitled_items: {es: "{count} elemento(s) de «{kind}» sin título: se les puso un número como título provisional.", en: "{count} item(s) of “{kind}” without a title: a number was used as a provisional title."}
note_map_nested: {es: "Un mapa tiene áreas dentro de áreas: se aplanó a un solo nivel.", en: "A map has areas inside areas: it was flattened to one level."}
note_map_point_empty: {es: "{count} punto(s) de un mapa sin texto.", en: "{count} point(s) of a map without text."}
