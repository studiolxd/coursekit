# `coursekit handoff`: the whole production of a course by itself.
start_line:
  es: "handoff {code}: todo el proceso hasta la entrega, sin intervención y sin revisión del cliente. Las firmas las pone {who}; ninguna persona revisa el curso."
  en: "handoff {code}: the whole process up to the delivery, by itself and with no client review. The signatures are given by {who}; no person reviews the course."
resume_line:
  es: "handoff {code}: continúa desde «{status}». Las firmas las pone {who}; ninguna persona revisa el curso."
  en: "handoff {code}: carrying on from \"{status}\". The signatures are given by {who}; no person reviews the course."
stage_line: {es: "── {status}", en: "── {status}"}
agent_line:
  es: "  · agente {role} ({label}): /{command} {arguments}"
  en: "  · {role} agent ({label}): /{command} {arguments}"
unit_line:
  es: "  · unidad {n}: {command} ({label})"
  en: "  · unit {n}: {command} ({label})"
media_outdated_line: {es: "  aviso: el espacio de vídeo (Remotion) no tiene las versiones de coursekit ({packages}); los vídeos se hacen con las instaladas. Después: coursekit setup --media", en: "  warning: the video workspace (Remotion) is not at the versions of coursekit ({packages}); the videos are made with the installed ones. Afterwards: coursekit setup --media"}
video_rule_line: {es: "  aviso: el vídeo {id} se salta las reglas de la marca: {where} · {text}", en: "  warning: the video {id} breaks the rules of the brand: {where} · {text}"}
signed_line: {es: "  · {text}", en: "  · {text}"}
warning_line: {es: "  aviso: {text}", en: "  warning: {text}"}
not_ready_line:
  es: "  · unidad {n}: la revisión con IA dice «not ready»; el redactor la corrige y se revisa de nuevo"
  en: "  · unit {n}: the AI review says \"not ready\"; the writer fixes it and it is reviewed again"
see_log: {es: " (sesión en {path})", en: " (session in {path})"}
bad_rounds:
  es: "rules › handoff › rounds debe ser un número entero mayor que 0, no «{value}»"
  en: "rules › handoff › rounds must be a whole number greater than 0, not \"{value}\""
course_exists:
  es: "el curso {code} ya existe; para continuarlo: coursekit handoff {code}"
  en: "course {code} already exists; to carry it on: coursekit handoff {code}"
design_not_exported:
  es: "{code}: la propuesta de diseño no se exportó a design/ (falta matrix.json)"
  en: "{code}: the design proposal was not exported to design/ (matrix.json is missing)"
design_not_signable:
  es: "{code}: el diseño no se puede firmar: {problem}"
  en: "{code}: the design cannot be signed: {problem}"
unit_not_written:
  es: "{code}: la unidad {n} no queda verificada tras los intentos (estado: {status})"
  en: "{code}: unit {n} is not verified after the attempts (status: {status})"
unit_not_reviewed:
  es: "{code}: la unidad {n} no queda revisada tras los intentos (estado: {status})"
  en: "{code}: unit {n} is not reviewed after the attempts (status: {status})"
unit_not_ready:
  es: "{code}: la revisión con IA sigue diciendo «not ready» en la unidad {n} tras corregirla (reviews/unit-{n:02d}-ai-review.md)"
  en: "{code}: the AI review still says \"not ready\" for unit {n} after fixing it (reviews/unit-{n:02d}-ai-review.md)"
unit_not_signable:
  es: "{code}: la unidad {n} no se puede firmar: {problem}"
  en: "{code}: unit {n} cannot be signed: {problem}"
theme_missing:
  es: "{code}: el multimedia necesita el theme y no se pudo definir (/define-theme)"
  en: "{code}: the media needs the theme and it could not be defined (/define-theme)"
style_missing:
  es: "{code}: no se ha podido firmar la lámina de estilo de las simulaciones: "
  en: "{code}: the style sheet of the simulations could not be signed: "
media_pending:
  es: "{code}: quedan recursos multimedia sin producir tras los intentos: {assets}"
  en: "{code}: media assets are still not produced after the attempts: {assets}"
not_assembled:
  es: "{code}: el curso no queda montado tras los intentos (/assemble)"
  en: "{code}: the course is not assembled after the attempts (/assemble)"
not_checked:
  es: "{code}: el montaje no cierra sus comprobaciones tras los intentos (/assemble)"
  en: "{code}: the assembly does not finish its closing checks after the attempts (/assemble)"
not_delivered:
  es: "{code}: el curso no queda entregado tras los intentos (/deliver)"
  en: "{code}: the course is not delivered after the attempts (/deliver)"
client_review_required:
  es: "{code}: el proyecto exige la revisión del cliente para entregar (client_review.required) y el handoff no la hace"
  en: "{code}: the project requires the client review to deliver (client_review.required) and handoff does not do it"
stopped_on_hold:
  es: "{code}: el curso está en pausa; continúa con `coursekit resume {code}` y después `coursekit handoff {code}`"
  en: "{code}: the course is on hold; bring it back with `coursekit resume {code}` and then `coursekit handoff {code}`"
stopped_client_review:
  es: "{code}: hay una ronda de revisión del cliente abierta; el handoff no la gestiona (`coursekit client {code} ...`)"
  en: "{code}: a client review round is open; handoff does not handle it (`coursekit client {code} ...`)"
no_progress:
  es: "{code}: el paso «{status}» no avanzó nada; míralo con `coursekit status {code}`"
  en: "{code}: the \"{status}\" step moved nothing; look at it with `coursekit status {code}`"
stopped:
  es: "handoff parado. {reason}\nPara seguir donde se quedó, una vez resuelto:  coursekit handoff {code}"
  en: "handoff stopped. {reason}\nTo carry on where it stopped, once solved:  coursekit handoff {code}"
done:
  es: "handoff terminado: {code} entregado. Las firmas son de {who}: ninguna persona ha revisado este curso."
  en: "handoff finished: {code} delivered. The signatures are {who}'s: no person has reviewed this course."
cause_line:
  es: "  Causa: {text}"
  en: "  Cause: {text}"
agent_said_line:
  es: "  El agente dijo:{text}"
  en: "  The agent said:{text}"
also_blocked_line:
  es: "  Además, {text} (puede no ser lo que lo ha parado: lo dice el agente arriba)"
  en: "  Also, {text} (it may not be what stopped it: the agent says what did, above)"
media_not_uploaded:
  es: "{code}: quedan recursos multimedia sin subir a creator tras los intentos: {assets}"
  en: "{code}: media assets are still not uploaded to creator after the attempts: {assets}"
not_delivered_to_reopen:
  es: "{code}: el curso está en «{status}», no entregado; para continuarlo, `coursekit handoff {code}` (sin --new-version)"
  en: "{code}: the course is in '{status}', not delivered; to carry it on, `coursekit handoff {code}` (without --new-version)"
reopen_line:
  es: "handoff {code}: reabierto para una versión nueva; continúa desde «{status}». Las firmas las pone {who}; ninguna persona revisa el curso."
  en: "handoff {code}: reopened for a new version; carries on from '{status}'. {who} signs; no person reviews the course."
fix_report_line:
  es: "unidad {n}: {count} punto(s) que corregir en {path}"
  en: "unit {n}: {count} item(s) to fix in {path}"
same_findings:
  es: "{code}: la unidad {n} sigue con los mismos {count} fallo(s) después de corregirla: otra ronda no lo arreglará. Están en {path}; corrígelos y sigue con `coursekit handoff {code}`"
  en: "{code}: unit {n} still has the same {count} problem(s) after fixing it: another round will not settle it. They are in {path}; fix them and carry on with `coursekit handoff {code}`"

package_check_failed:
  es: "{code}: la comprobación de los paquetes ha encontrado {count} error(es), apuntados en {path}; corrígelos y sigue con `coursekit handoff {code}`"
  en: "{code}: the check of the packages found {count} error(s), listed in {path}; fix them and carry on with `coursekit handoff {code}`"
update_failed: {es: "unidad {n}: la comprobación de actualidad no terminó bien ({where}); sigue la revisión", en: "unit {n}: the currency check did not finish well ({where}); the review goes on"}
videos_unchecked: {es: "{code}: {count} vídeos propuestos por el agente esperan a que una persona compruebe que su canal es oficial ({path}): apruébalos o recházalos con `coursekit videos approve` o `reject`", en: "{code}: {count} videos proposed by the agent wait for a person to check that their channel is official ({path}): approve or reject them with `coursekit videos approve` or `reject`"}
videos_to_check: {es: "Vídeos propuestos por el agente sin comprobar ({count}; {path}): {list}", en: "Videos proposed by the agent not yet checked ({count}; {path}): {list}"}
bad_rule: {es: "{code}: regla no válida: {text}", en: "{code}: invalid rule: {text}"}
recordings_needed: {es: "Faltan {count} recursos que muestran la interfaz de una aplicación real y no se inventan: esperan una grabación o captura real de una persona (guion de cada una en media/scripts/; se deja en media/recordings/<id>.* y se vuelve a ejecutar /produce-media): {list}", en: "{count} resources that show the interface of a real application are missing and are not invented: they wait for a real recording or capture from a person (the brief of each is in media/scripts/; drop it in media/recordings/<id>.* and run /produce-media again): {list}"}
captures_to_review: {es: "Capturas con los datos personales tapados que esperan a una persona ({count}): revisa cada una con coursekit capture review {code} <id> y apruébala con coursekit capture approve {code} <id> (o recházala con reject): {list}", en: "Captures with their personal data covered that wait for a person ({count}): review each one with coursekit capture review {code} <id> and approve it with coursekit capture approve {code} <id> (or reject it): {list}"}
tts_batch_waiting: {es: "las locuciones de {code} están en el batch de Gemini ({state}): se recogen solas cuando termine (Google apunta a 24 h). Sigue con lo que no depende de ellas", en: "the narrations of {code} are in the Gemini batch ({state}): they are collected by themselves when it finishes (Google aims at 24 h). Go on with what does not depend on them"}
tts_batch_collected: {es: "batch de Gemini recogido para {code}: {done} locución(es) escrita(s), {failed} de vuelta en la cola", en: "Gemini batch collected for {code}: {done} narration(s) written, {failed} back in the queue"}
tts_batch_sent: {es: "batch de Gemini enviado para {code}: {job} ({items} locución(es))", en: "Gemini batch sent for {code}: {job} ({items} narration(s))"}
tts_batch_failed: {es: "el batch de Gemini de {code} no se pudo enviar o recoger: {error}", en: "the Gemini batch of {code} could not be sent or collected: {error}"}
media_style_missing:
  es: "{code}: no se ha podido firmar la guía de estilo de los recursos: "
  en: "{code}: the style guide of the media could not be signed: "
assumptions_to_check:
  es: "el diseño decidió {count} cosa(s) sin poder preguntar; revísalas en {path}: {list}"
  en: "the design decided {count} thing(s) with no one to ask; check them in {path}: {list}"
report_written:
  es: "informe del handoff: {path}"
  en: "handoff report: {path}"
report_title: {es: "{code} — {title}: informe del handoff", en: "{code} — {title}: handoff report"}
report_assumptions: {es: "Decisiones del diseño sin confirmar ({path})", en: "Design decisions to confirm ({path})"}
report_recordings: {es: "Grabaciones o capturas que tiene que hacer una persona", en: "Recordings or captures a person has to make"}
report_captures: {es: "Capturas con datos personales tapados que revisar", en: "Captures with personal data covered to review"}
report_captures_approved: {es: "Capturas que aprobó el handoff sin que nadie las revisara (mira que no quede ningún dato personal; todas en una página: coursekit capture review {code})", en: "Captures the handoff approved with no one reviewing them (check that no personal data is left; all on one page: coursekit capture review {code})"}
capture_approved_line: {es: "  · captura de {id} aprobada por {who}", en: "  · capture of {id} approved by {who}"}
report_videos: {es: "Vídeos de sitios prohibidos por comprobar ({path})", en: "Videos of forbidden sites to check ({path})"}
report_nothing: {es: "Nada pendiente de revisar.", en: "Nothing waiting for review."}
report_stopped:
  es: "El handoff se ha parado en «{status}»: {reason}"
  en: "The handoff stopped at '{status}': {reason}"
capturable_new_version: {es: "El permiso de captura en vigor deja que el agente de media grabe {count} recursos, pero el curso ya está entregado: sácalos en una versión nueva con coursekit handoff {code} --new-version ({list})", en: "The permission to capture in force lets the media agent record {count} resources, but the course is already delivered: make them in a new version with coursekit handoff {code} --new-version ({list})"}
