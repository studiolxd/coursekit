# Job aids (jobaid.py): the PDF a learner downloads, from the text of its placeholder and the template of the theme.
bad_orientation:
  es: "media › job_aid › orientation debe ser portrait o landscape, no «{value}»"
  en: "media › job_aid › orientation must be portrait or landscape, not «{value}»"
no_body:
  es: "la ayuda de trabajo «{title}» no tiene texto: escríbelo en su recurso del contenido, en las líneas que siguen a los campos (con `>`), y vuelve a ejecutar coursekit media extract"
  en: "the job aid «{title}» has no text: write it in its placeholder in the content, in the lines after the fields (with `>`), and run coursekit media extract again"
rendered:
  es: "{path}: regístrala con coursekit media set {code} {asset} --status produced --recipe agent-html-pdf --file {file}"
  en: "{path}: record it with coursekit media set {code} {asset} --status produced --recipe agent-html-pdf --file {file}"
sample:
  es: "{path}: la muestra de las ayudas de trabajo con la plantilla {template}; ábrela, pide los cambios de la plantilla o del tema y vuelve a generarla"
  en: "{path}: the sample of the job aids with the template {template}; open it, ask for the changes of the template or the theme and print it again"
font_not_brand:
  es: "media › job_aid › text › {role}: «{family}» no es una de las fuentes de la marca ({families}); se deja fuera"
  en: "media › job_aid › text › {role}: «{family}» is not one of the fonts of the brand ({families}); it is left out"
