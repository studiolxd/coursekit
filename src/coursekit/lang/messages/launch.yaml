# Errors and warnings when launching the agent of a role (write, review, run).
invalid_agent:
  es: "{role}_AGENT={chosen} no es válido (usa {tools})"
  en: "{role}_AGENT={chosen} is not valid (use {tools})"
tool_not_installed:
  es: "{tool} no está instalado en este equipo (coursekit doctor)"
  en: "{tool} is not installed on this machine (coursekit doctor)"
unit_not_found:
  es: "no se encuentra la unidad {n} en course.yaml (¿está aprobado el diseño?)"
  en: "unit {n} not found in course.yaml (is the design approved?)"
writer_unknown:
  es: "course.yaml no dice quién escribió la unidad {n}; comprueba que no fue {label}"
  en: "course.yaml does not say who wrote unit {n}; check it was not {label}"
same_writer:
  es: "la unidad {n} se escribió con {writer}, la misma herramienta y modelo que esta revisión; otro modelo detecta más (REVIEWER_AGENT / REVIEWER_MODEL en .env)"
  en: "unit {n} was written with {writer}, the same tool and model as this review; another model catches more (REVIEWER_AGENT / REVIEWER_MODEL in .env)"
mcp_not_allowed:
  es: "el agente intentó usar las herramientas de «{server}», pero en una sesión sin interfaz no están permitidas. Si es tu conector de creator, pon en project.yaml › platform.slxd.connector: \"{connector}\" y vuelve a lanzarlo"
  en: "the agent tried to use the tools of \"{server}\", but they are not allowed in a session without an interface. If it is your creator connector, set project.yaml › platform.slxd.connector: \"{connector}\" and run it again"
connector_not_connected:
  es: "el conector «{server}» de platform.slxd.connector está en estado {status}, no conectado: inicia sesión en él desde tu herramienta de IA (/mcp) y vuelve a lanzarlo"
  en: "the connector \"{server}\" in platform.slxd.connector is {status}, not connected: log in to it from your AI tool (/mcp) and run it again"
mcp_needs_auth:
  es: "el servidor MCP «{server}» no está autorizado (estado: {status}) y una sesión sin interfaz no puede iniciar sesión. Autorízalo una vez: abre tu herramienta de IA en esta carpeta y usa /mcp; o, si ya tienes creator conectado en tu cuenta, pon el nombre de ese conector en project.yaml › platform.slxd.connector"
  en: "the MCP server \"{server}\" is not authorized (status: {status}) and a session without an interface cannot sign in. Authorize it once: open your AI tool in this folder and use /mcp; or, if creator is already connected in your account, set the name of that connector in project.yaml › platform.slxd.connector"
programs_blocked:
  es: "el agente intentó ejecutar {programs}, pero en una sesión sin interfaz no está permitido y nadie podía aprobarlo; haz ese paso tú desde tu herramienta de IA"
  en: "the agent tried to run {programs}, but it is not allowed in a session without an interface and nobody could approve it; do that step yourself from your AI tool"
programs_blocked_media:
  es: "el agente de media intentó ejecutar {programs}, pero en una sesión sin interfaz no está permitido y nadie podía aprobarlo. Añádelos a rules › handoff › media_tools (config/rules.yaml) y vuelve a lanzarlo; bash, sh y node dejan al agente ejecutar cualquier orden, añádelos solo si lo aceptas"
  en: "the media agent tried to run {programs}, but it is not allowed in a session without an interface and nobody could approve it. Add them to rules › handoff › media_tools (config/rules.yaml) and run it again; bash, sh and node let the agent run any command, add them only if you accept that"
