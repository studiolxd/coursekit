# Output and errors of `coursekit media` (plan, providers, set).
available_yes: {es: "sí", en: "yes"}
available_mcp: {es: "si el agente tiene la herramienta MCP", en: "if the agent has the MCP tool"}
available_yes_only: {es: "sí, solo para contenido {only}", en: "yes, only for {only} content"}
only_terminal: {es: "de terminal", en: "terminal"}
only_decorative: {es: "decorativo", en: "decorative"}
available_mcp_only:
  es: "si el agente tiene la herramienta MCP, solo para contenido {only}"
  en: "if the agent has the MCP tool, only for {only} content"
missing_download_specs:
  es: "sus especificaciones piden un fichero descargable (PDF…): coursekit media set … --download media/files/<file>"
  en: "its specs ask for a downloadable file (PDF…): coursekit media set … --download media/files/<file>"
missing_download_upload:
  es: "un fichero descargable aún no está subido: request_asset_upload kind attachment, y después --download-asset-path"
  en: "a downloadable file is not uploaded yet: request_asset_upload kind attachment, then --download-asset-path"
no_option:
  es: "  ninguna opción disponible: instala una herramienta o define una clave (coursekit config media)"
  en: "  no option available: install a tool or set a key (coursekit config media)"
voice_options: {es: "    voz: {options}", en: "    voice: {options}"}
voice_none: {es: "    voz: ninguna disponible", en: "    voice: none available"}
subtitles_options: {es: "    subtítulos: {options}", en: "    subtitles: {options}"}
subtitles_none: {es: "    subtítulos: ninguno disponible", en: "    subtitles: none available"}
provider_available: {es: disponible, en: available}
provider_missing: {es: falta, en: missing}
provider_mcp: {es: MCP del agente, en: agent MCP}
theme_missing:
  es: "{code} no tiene tokens del tema: define el theme con /define-theme antes de producir infografías, esquemas, simulaciones o vídeos (--force para saltarlo)"
  en: "{code} has no theme tokens: define the theme with /define-theme before producing infographics, diagrams, simulations or videos (--force to skip it)"
theme_manual:
  es: "los tokens de {code} no vienen del theme de la plataforma (escritos a mano): impórtalos con /define-theme (--force para saltarlo)"
  en: "the tokens of {code} do not come from the theme of the platform (written by hand): import them with /define-theme (--force to skip it)"
theme_changed:
  es: "{asset} se produjo con otros tokens del tema: vuelve a producirlo"
  en: "{asset} was produced with other theme tokens: produce it again"
asset_not_found:
  es: "no se encuentra el recurso {asset_id} (ejecuta antes `coursekit media extract`)"
  en: "asset {asset_id} not found (run `coursekit media extract` first)"
bad_status:
  es: "el estado debe ser uno de {statuses}"
  en: "status must be one of {statuses}"
download_needs_file:
  es: "--download-title y --download-asset-path necesitan --download FILE"
  en: "--download-title and --download-asset-path need --download FILE"
embed_needs_svg:
  es: "{asset} no tiene un fichero .svg en el manifiesto (coursekit media set … --file)"
  en: "{asset} has no .svg file in the manifest (coursekit media set … --file)"
embed_written:
  es: "escrito {path}: sube ese fichero con request_embed_upload (folderId {asset}, relativePath index.html) y `coursekit media upload`, y registra el embedFolderPrefix con `coursekit media set … --status uploaded --asset-path`"
  en: "wrote {path}: upload that file with request_embed_upload (folderId {asset}, relativePath index.html) and `coursekit media upload`, then record the embedFolderPrefix with `coursekit media set … --status uploaded --asset-path`"
character_title: {es: "Retrato de {name}", en: "Portrait of {name}"}
character_description:
  es: "Retrato de {name}, personaje de un diálogo del curso: su cara en el avatar de la conversación."
  en: "Portrait of {name}, a character of a dialogue of the course: the face in the avatar of the conversation."
character_specs:
  es: "512x512 px, cuadrada, busto centrado con fondo liso de un color de la paleta del theme; el mismo estilo para todos los personajes del curso (ilustración o fotografía de una persona, nunca iniciales); texto alternativo obligatorio."
  en: "512x512 px, square, a centred bust on a plain background in a colour of the theme palette; the same style for every character of the course (an illustration or a photograph of a person, never initials); alt text is mandatory."
# Images of the simulations (coursekit media extract) and their style
bad_style:
  es: "media › visual › {key} vale '{value}': usa uno de {valid}"
  en: "media › visual › {key} is '{value}': use one of {valid}"
portrait_title: {es: "Retrato de {name}{expression}", en: "Portrait of {name}{expression}"}
portrait_description:
  es: "{name}, personaje de la biblia narrativa (aspecto: {look}), con expresión {expression}. El mismo personaje en todas sus expresiones: parte de su retrato base."
  en: "{name}, a character of the story bible (look: {look}), with a {expression} expression. The same person in every expression: start from their base portrait."
expression_neutral: {es: neutral, en: neutral}
portrait_specs:
  es: "PNG 1024x1024 px con fondo transparente, busto de cintura para arriba mirando a cámara, en el estilo visual del curso; sin texto dentro de la imagen; texto alternativo obligatorio."
  en: "PNG 1024x1024 px with a transparent background, a bust from the waist up looking at the camera, in the visual style of the course; no text inside the image; alt text is mandatory."
background_description:
  es: "Fondo de una escena de simulación: {text}. Lo que se ve desde el punto de vista de quien aprende, con sitio libre para los personajes."
  en: "Background of a simulation scene: {text}. What the learner sees from their point of view, with free room for the characters."
background_specs:
  es: "1920x1080 px (16:9), en el estilo visual del curso; sin texto dentro de la imagen (carteles y pantallas, en blanco o ilegibles); los objetos que se pueden pulsar, bien visibles; texto alternativo obligatorio."
  en: "1920x1080 px (16:9), in the visual style of the course; no text inside the image (signs and screens blank or unreadable); the objects that can be clicked, clearly visible; alt text is mandatory."
layer_description:
  es: "Capa de una escena de simulación: {text}. Un objeto suelto que se coloca sobre el fondo y puede aparecer o desaparecer."
  en: "Layer of a simulation scene: {text}. A single object placed on top of the background that can appear or disappear."
layer_specs:
  es: "PNG con fondo transparente, recortado al objeto, en el estilo y la luz del fondo; sin texto dentro de la imagen; texto alternativo obligatorio."
  en: "PNG with a transparent background, cropped to the object, in the style and light of the background; no text inside the image; alt text is mandatory."
style_line: {es: "estilo visual de las simulaciones: {style}", en: "visual style of the simulations: {style}"}
no_generator:
  es: "no hay generador de imágenes: escenas, capas y retratos se dibujan en SVG en estilo {fallback} (rol illustration: coursekit run produce-media CODE --role illustration)"
  en: "no image generator: scenes, layers and portraits are drawn as SVG in the {fallback} style (illustration role: coursekit run produce-media CODE --role illustration)"
style_not_approved:
  es: "la lámina de estilo de {code} no está firmada: produce antes las muestras en media/style/ y que una persona firme con coursekit approve style {code}"
  en: "the style sheet of {code} is not signed: produce the samples in media/style/ first and have a person sign with coursekit approve style {code}"
package_description:
  es: "La simulación '{id}' como paquete EMBED para creator: coursekit media embed CODE <este id> lo construye en media/src/<id>/ con sus imágenes."
  en: "The simulation '{id}' as an EMBED package for creator: coursekit media embed CODE <this id> builds it in media/src/<id>/ with its images."
package_specs:
  es: "Se construye, no se dibuja: produce antes sus imágenes (fondos, capas, retratos), constrúyelo con coursekit media embed y súbelo como EMBED."
  en: "It is built, not drawn: produce its images first (backgrounds, layers, portraits), build it with coursekit media embed and upload it as an EMBED."
package_not_found: {es: "{asset}: la simulación ya no está en el contenido", en: "{asset}: the simulation is no longer in the content"}
asset_without_file: {es: "{asset}: no tiene fichero (media set … --file)", en: "{asset}: it has no file (media set … --file)"}
render_needs_svg: {es: "{asset}: render es para un SVG", en: "{asset}: render is for an SVG"}
voice_narrator: {es: "la voz del curso (narrador)", en: "the voice of the course (narrator)"}
narration_queued: {es: "  {asset}: en la cola del batch de Gemini", en: "  {asset}: in the queue of the Gemini batch"}
voice_title: {es: "Narración de una escena de {simulation} ({id})", en: "Narration of a scene of {simulation} ({id})"}
voice_description:
  es: "El texto de la escena (narration), leído por {speaker}. Se produce con `coursekit media narrate`."
  en: "The text of the scene (narration), read by {speaker}. Produced with `coursekit media narrate`."
voice_specs: {es: "MP3, la voz configurada (coursekit voice)", en: "MP3, the configured voice (coursekit voice)"}

adopt_missing: {es: "no existe el fichero {path} (una ruta desde la carpeta del curso o del proyecto)", en: "the file {path} does not exist (a path from the course or the project folder)"}
interface_line: {es: "  muestra la interfaz de una aplicación real: solo material real (captura o grabación de una persona, vídeo de un canal oficial); nunca dibujada ni recreada", en: "  shows the interface of a real application: only real material (a capture or recording from a person, a video of an official channel); never drawn or recreated"}
awaiting_line: {es: "  espera a una persona: guion en {path}, y la captura o grabación en {folder}.*", en: "  waits for a person: brief in {path}, and the capture or recording in {folder}.*"}
classify_line: {es: "  ¿qué muestra? coursekit media set CODE {id} --depicts interface|concept (hace falta antes de producirlo con una receta generada)", en: "  what does it show? coursekit media set CODE {id} --depicts interface|concept (needed before it is made with a generated recipe)"}
interface_no_option: {es: "  sin opción posible: hace falta material real de la aplicación (una persona lo aporta)", en: "  no option available: real material of the application is needed (a person provides it)"}
bad_depicts: {es: "--depicts «{value}» no vale (válidos: {valid})", en: "--depicts “{value}” is not valid (valid: {valid})"}
depicts_missing: {es: "{asset}: di qué muestra antes de producirlo: coursekit media set CODE {asset} --depicts interface|concept", en: "{asset}: say what it shows before it is produced: coursekit media set CODE {asset} --depicts interface|concept"}
interface_generated: {es: "{asset} muestra la interfaz de una aplicación real y la receta «{recipe}» la dibujaría: no se inventa una interfaz real, ni aproximada. Recetas permitidas: {allowed} (material real que aporta una persona, o un vídeo de un canal oficial)", en: "{asset} shows the interface of a real application and the recipe “{recipe}” would draw it: the interface of a real application is not invented, not even approximately. Allowed recipes: {allowed} (real material that a person provides, or a video of an official channel)"}
capture_captured: {es: "{asset}: la captura tiene los datos personales tapados y espera a que una persona la revise (coursekit capture review {code} {asset}) y la apruebe (coursekit capture approve {code} {asset})", en: "{asset}: the capture has its personal data covered and waits for a person to review it (coursekit capture review {code} {asset}) and approve it (coursekit capture approve {code} {asset})"}
capture_rejected: {es: "{asset}: la captura se rechazó: hay que taparla de nuevo (coursekit capture redact {code} {asset}) o aportar otra", en: "{asset}: the capture was rejected: cover it again (coursekit capture redact {code} {asset}) or provide another"}
capture_captured_line: {es: "  captura con los datos personales tapados, espera a una persona: coursekit capture review {code} {id} y coursekit capture approve {code} {id}", en: "  capture with its personal data covered, waits for a person: coursekit capture review {code} {id} and coursekit capture approve {code} {id}"}
capture_rejected_line: {es: "  captura rechazada ({note}): tápala de nuevo con coursekit capture redact {code} {id}, o repite la sesión o coursekit capture replay {code} {id}", en: "  capture rejected ({note}): cover it again with coursekit capture redact {code} {id}, or repeat the session or coursekit capture replay {code} {id}"}
media_style_not_approved: {es: "la guía de estilo de los recursos no está firmada (o cambió desde que se firmó): una persona la lee y la firma con coursekit approve media-style {code} antes de producir recursos visuales", en: "the style guide of the media is not signed (or it changed since it was signed): a person reads it and signs it with coursekit approve media-style {code} before visual resources are produced"}
