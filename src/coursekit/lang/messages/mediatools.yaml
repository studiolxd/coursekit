# Errors and result of `coursekit tts` and `coursekit subtitles`.
input_missing:
  es: "no existe el fichero {path}"
  en: "the file {path} does not exist"
piper_voice:
  es: "define PIPER_VOICE en .env (ruta a una voz .onnx) o pasa --voice"
  en: "set PIPER_VOICE in .env (path to a .onnx voice) or pass --voice"
piper_missing:
  es: "piper no está instalado (coursekit setup --media)"
  en: "piper is not installed (coursekit setup --media)"
elevenlabs_needs:
  es: "hacen falta ELEVENLABS_API_KEY y una voz (ELEVENLABS_VOICE_ID o --voice)"
  en: "ELEVENLABS_API_KEY and a voice (ELEVENLABS_VOICE_ID or --voice) are needed"
gemini_no_audio:
  es: "Gemini no devolvió audio (motivo: {reason}): revisa el modelo, la voz y el texto del guion"
  en: "Gemini returned no audio (reason: {reason}): check the model, the voice and the text of the script"
stable_ts_missing:
  es: "stable-ts no está instalado (coursekit setup --media)"
  en: "stable-ts is not installed (coursekit setup --media)"
default_voice: {es: voz por defecto, en: default voice}
wrote: {es: "escrito {out} ({provider} · {voice})", en: "wrote {out} ({provider} · {voice})"}
wrote_vtt: {es: "escrito {out} y {vtt} ({provider} · {voice})", en: "wrote {out} and {vtt} ({provider} · {voice})"}
program_missing:
  es: "{program} no está instalado o no se encuentra en el PATH (coursekit setup --media)"
  en: "{program} is not installed or not on the PATH (coursekit setup --media)"
program_failed:
  es: "{program} terminó con error (código {code})"
  en: "{program} failed (exit code {code})"
http_failed:
  es: "{host} respondió {status} {reason}: revisa la clave, la región y la voz configuradas"
  en: "{host} answered {status} {reason}: check the key, the region and the voice configured"
network_failed:
  es: "no se pudo conectar con {host}: {reason}"
  en: "could not reach {host}: {reason}"
upload_not_https:
  es: "la dirección de subida debe empezar por https://"
  en: "the upload address must start with https://"
downloaded: {es: "descargado {path} ({size} bytes)", en: "downloaded {path} ({size} bytes)"}
download_outside: {es: "{path} queda fuera del proyecto: descarga solo dentro de él", en: "{path} is outside the project: download only inside it"}
uploaded: {es: "subido {name} ({size} bytes)", en: "uploaded {name} ({size} bytes)"}
bad_size: {es: "tamaño '{size}' no válido: ANCHOxALTO, p. ej. 1920x1080", en: "invalid size '{size}': WIDTHxHEIGHT, e.g. 1920x1080"}
optimised: {es: "{path}: {before} → {after} bytes", en: "{path}: {before} → {after} bytes"}
fitted: {es: "{path}: {before} → {after}", en: "{path}: {before} → {after}"}
no_browser:
  es: "no hay Chrome, Chromium ni Edge en esta máquina para renderizar el SVG (instálalo o revisa el SVG en la vista previa del curso)"
  en: "there is no Chrome, Chromium or Edge on this machine to render the SVG (install one or check the SVG in the preview of the course)"
render_failed: {es: "no se pudo renderizar {svg}", en: "could not render {svg}"}
rendered: {es: "{svg} → {png} ({size})", en: "{svg} → {png} ({size})"}
