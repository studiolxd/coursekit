# `coursekit paths`: the report of the paths of the simulations of a unit.
title: {es: "Caminos de las simulaciones — {code} · Unidad {n}", en: "Simulation paths — {code} · Unit {n}"}
intro:
  es: "Generado por `coursekit paths`: no lo edites. Cada simulación con su diagrama y todos sus caminos completos, de más a menos puntos."
  en: "Generated by `coursekit paths`: do not edit it. Each simulation with its flowchart and every complete path, from most to fewest points."
summary:
  es: "{file}:{line} · {scenes} escenas · finales alcanzados: {endings} · {paths} caminos{more} · puntos de {low} a {high} · {minutes} min el camino más largo · evaluable: {scored} · objetivos: {objectives}"
  en: "{file}:{line} · {scenes} scenes · endings reached: {endings} · {paths} paths{more} · points from {low} to {high} · {minutes} min the longest path · scored: {scored} · objectives: {objectives}"
truncated: {es: " (lista incompleta: hay más)", en: " (incomplete list: there are more)"}
scored_yes: {es: "sí", en: "yes"}
scored_no: {es: "no", en: "no"}
otherwise: {es: "si no", en: "otherwise"}
col_decisions: {es: "Decisiones", en: "Decisions"}
col_ending: {es: "Final", en: "Ending"}
col_points: {es: "Puntos", en: "Points"}
col_grade: {es: "Nota", en: "Grade"}
col_state: {es: "Estado final", en: "Final state"}
col_scene: {es: "Escena", en: "Scene"}
col_text: {es: "Texto", en: "Text"}
col_screen: {es: "Pantalla (piel)", en: "Screen (skin)"}
col_people: {es: "Personajes y fondo", en: "Characters and background"}
screen_mail: {es: "correo", en: "mail"}
screen_caller: {es: "llama", en: "calling"}
screen_messages: {es: "{n} mensajes nuevos", en: "{n} new messages"}
not_secure: {es: "no segura", en: "not secure"}
background: {es: "fondo: {text}", en: "background: {text}"}
# command output
none: {es: "{code}: ninguna unidad tiene simulaciones", en: "{code}: no unit has simulations"}
unit_written: {es: "unidad {n}: {count} simulaciones → {path}", en: "unit {n}: {count} simulations → {path}"}
unit_errors: {es: "unidad {n}: las simulaciones tienen errores (coursekit verify {code} --unit {n}):", en: "unit {n}: the simulations have errors (coursekit verify {code} --unit {n}):"}
