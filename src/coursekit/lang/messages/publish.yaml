# Output and errors of `coursekit publish`.
check_none: {es: "info: sin carpeta espejo (project.yaml › mirror.provider: none)", en: "info: no mirror folder (project.yaml › mirror.provider: none)"}
check_no_dir:
  es: "aviso: MIRROR_DIR no está definido en .env; no se publicará nada"
  en: "warning: MIRROR_DIR is not set in .env; nothing will be published"
check_dir_missing: {es: "aviso: MIRROR_DIR no existe: {root}", en: "warning: MIRROR_DIR does not exist: {root}"}
check_ok: {es: "ok: carpeta espejo de {provider} en {root}", en: "ok: {provider} mirror in {root}"}
check_no_url:
  es: "info: no hay mirror.url en project.yaml; el catálogo no tendrá enlaces a las carpetas"
  en: "info: no mirror.url in project.yaml; the catalog will have no folder links"
check_sharing_link:
  es: "aviso: mirror.url es un enlace para compartir sin ruta de carpeta; copia en su lugar la dirección de la barra del navegador de la carpeta"
  en: "warning: mirror.url is a sharing link without a folder path; copy the address bar of the folder instead"
check_links: {es: "ok: enlaces a las carpetas de curso como {link}", en: "ok: course folder links like {link}"}
skipped_none:
  es: "sin carpeta espejo (project.yaml › mirror.provider: none): nada que publicar"
  en: "no mirror folder (project.yaml › mirror.provider: none): nothing to publish"
no_mirror:
  es: "no hay carpeta espejo configurada (project.yaml › mirror y MIRROR_DIR en .env)"
  en: "no mirror folder configured (project.yaml › mirror and MIRROR_DIR in .env)"
dir_missing: {es: "MIRROR_DIR no existe: {root}", en: "MIRROR_DIR does not exist: {root}"}
course_not_found: {es: "curso {code} no encontrado", en: "course {code} not found"}
published:
  es: "publicado {name}: {copied} copiados, {removed} eliminados, {unchanged} sin cambios"
  en: "published {name}: {copied} copied, {removed} removed, {unchanged} unchanged"
cannot_replace:
  es: "no se puede reemplazar {output} (¿está abierto en Excel?)"
  en: "cannot replace {output} (is it open in Excel?)"
wrote_catalog: {es: "escrito {output} ({courses} cursos, {units} unidades)", en: "wrote {output} ({courses} courses, {units} units)"}
