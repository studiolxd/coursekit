# The project follows the installed coursekit (refresh.py).
done:
  es: "coursekit {version}: proyecto al día ({files} archivos gestionados, {agents} archivos de agentes)"
  en: "coursekit {version}: project brought up to date ({files} managed files, {agents} agent files)"
kept:
  es: "  conservado (editado a mano, no se actualiza): {path}"
  en: "  kept (edited by hand, not updated): {path}"
failed:
  es: "coursekit: no se pudo actualizar el proyecto ({error}); sigue con lo que hay y ejecuta `coursekit init --update` y `coursekit agents`"
  en: "coursekit: the project could not be brought up to date ({error}); carrying on with what is there; run `coursekit init --update` and `coursekit agents`"
media_outdated:
  es: "coursekit: el espacio de vídeo (Remotion) tiene versiones nuevas: {packages}; ejecuta `coursekit setup --media` para instalarlas (hasta entonces coursekit video se para; el handoff sigue con las de ahora y lo avisa)"
  en: "coursekit: the video workspace (Remotion) has new versions: {packages}; run `coursekit setup --media` to install them (until then coursekit video stops; the handoff goes on with the ones there are and warns)"
