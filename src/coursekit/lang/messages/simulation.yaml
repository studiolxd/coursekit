  en: "scene '{scene}' is an ending: it cannot have 'choices', 'hotspots' or 'next'"
no_way_out:
  es: "la escena '{scene}' no tiene salida: 'choices', 'hotspots', 'next' o 'ending'"
  en: "scene '{scene}' has no way out: 'choices', 'hotspots', 'next' or 'ending'"
bad_ending: {es: "final '{value}' de la escena '{scene}' no válido (válidos: {valid})", en: "invalid ending '{value}' in scene '{scene}' (valid: {valid})"}
ending_without_debriefing: {es: "el final '{scene}' no tiene 'debriefing'", en: "ending '{scene}' has no 'debriefing'"}
debriefing_without_ending: {es: "la escena '{scene}' tiene 'debriefing' pero no es un final", en: "scene '{scene}' has a 'debriefing' but is not an ending"}
next_and_decisions:
  es: "la escena '{scene}' tiene 'next' y además decisiones: o avanza sola o se decide"
  en: "scene '{scene}' has 'next' and decisions too: it either moves on by itself or asks for a decision"
bad_next: {es: "{place}: cada paso de 'next' tiene 'goto' y, si acaso, 'if'", en: "{place}: every step of 'next' has 'goto' and, optionally, 'if'"}
bad_area:
  es: "{place}: zona no válida: [x, y] o [x, y, ancho, alto], en % de 0 a 100"
  en: "{place}: invalid area: [x, y] or [x, y, width, height], in % from 0 to 100"
unknown_scene: {es: "{place}: la escena '{scene}' no existe", en: "{place}: scene '{scene}' does not exist"}
bad_decision: {es: "{place}: cada decisión debe ser un mapa", en: "{place}: every decision must be a mapping"}
bad_changes: {es: "{place}: debe ser un mapa de variables", en: "{place}: must map variables to values"}
bad_change_value: {es: "{place}: valor no válido ({value})", en: "{place}: invalid value ({value})"}
bad_score: {es: "{place}: 'score' debe ser un número ({value})", en: "{place}: 'score' must be a number ({value})"}
bad_error:
