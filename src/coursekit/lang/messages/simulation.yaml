  en: "{place}: clues help to decide: the scene needs 'choices' or 'hotspots'"
two_tasks: {es: "{place}: una escena tiene como mucho una tarea ('inbox' o 'allocation')", en: "{place}: a scene has one task at most ('inbox' or 'allocation')"}
bad_task: {es: "{place}: debe ser un mapa", en: "{place}: must be a mapping"}
