  en: "an adaptive block cannot go in a test or its question bank (creator refuses it): move it to content.md"
if_too_many_branches: {es: "el bloque tiene {count} ramas con condición; como mucho {limit}", en: "the block has {count} branches with a condition; at most {limit}"}
if_too_long: {es: "la condición tiene {count} caracteres; como mucho {limit}", en: "the condition has {count} characters; at most {limit}"}
if_too_many_simulations:
  es: "el bloque lee {count} simulaciones distintas entre todas sus ramas; como mucho {limit}"
  en: "the block reads {count} different simulations in all its branches; at most {limit}"
if_scored_inside:
