# Problems of a simulation (:::scenario, :::conversation) and of the adaptive blocks (:::if), found by `coursekit verify`.
# Each one comes after "<file>:<line> <kind> '<id>':".
expr_bad_char: {es: "carácter no válido '{char}' en «{text}»", en: "invalid character '{char}' in «{text}»"}
expr_empty: {es: "condición vacía", en: "empty condition"}
expr_type: {es: "'{op}' necesita {want} y recibe {got}", en: "'{op}' needs {want} and gets {got}"}
expr_type_mismatch: {es: "'{op}' compara {left} con {right}: tienen que ser del mismo tipo", en: "'{op}' compares {left} with {right}: they must be of the same type"}
expr_not_boolean: {es: "la condición da {got}, no verdadero o falso", en: "the condition gives {got}, not true or false"}
expr_text_compare:
  es: "un texto entre comillas solo se compara con == o != (p. ej. llamada.kind == \"good\"): «{text}»"
  en: "a text in quotes is only compared with == or != (e.g. call.kind == \"good\"): «{text}»"
expr_unexpected: {es: "'{token}' inesperado en «{text}»", en: "unexpected '{token}' in «{text}»"}
expr_incomplete: {es: "condición incompleta: «{text}»", en: "incomplete condition: «{text}»"}
expr_parenthesis: {es: "falta cerrar un paréntesis en «{text}»", en: "a parenthesis is not closed in «{text}»"}
expr_not_text: {es: "la condición debe ser texto (entre comillas), no {value}", en: "the condition must be text (in quotes), not {value}"}
not_yaml:
  es: "el cuerpo no es YAML válido (línea {line}): {problem}"
  en: "the body is not valid YAML (line {line}): {problem}"
inline_comment:
  es: "línea {line}: un «#» tras un espacio empieza un comentario de YAML y se pierde el resto del texto; pon el texto entre comillas: {text}"
  en: "line {line}: a «#» after a space starts a YAML comment and the rest of the text is lost; put the text in quotes: {text}"
not_mapping: {es: "el cuerpo debe ser un mapa YAML (id, title, scenes…)", en: "the body must be a YAML mapping (id, title, scenes…)"}
unknown_key: {es: "clave desconocida '{key}' (válidas: {valid})", en: "unknown key '{key}' (valid: {valid})"}
bad_id:
  es: "id '{value}' no válido: minúsculas, números y '_', empezando por una letra (sin '-': las condiciones lo leen como id.variable)"
  en: "invalid id '{value}': lower case, digits and '_', starting with a letter (no '-': the conditions read it as id.variable)"
missing: {es: "falta '{key}'", en: "missing '{key}'"}
bad_skin: {es: "piel desconocida '{value}' (válidas: {valid})", en: "unknown skin '{value}' (valid: {valid})"}
bad_objective: {es: "objetivo '{value}' no válido (UN.M, p. ej. U1.2)", en: "invalid objective '{value}' (UN.M, e.g. U1.2)"}
not_bool: {es: "'{key}' debe ser true o false", en: "'{key}' must be true or false"}
bad_weight: {es: "peso '{value}' no válido: un número mayor que 0", en: "invalid weight '{value}': a number above 0"}
bad_state: {es: "'state' debe ser un mapa de variables con su valor inicial", en: "'state' must map each variable to its initial value"}
bad_variable:
  es: "variable '{name}' no válida: minúsculas, números y '_', empezando por una letra"
  en: "invalid variable '{name}': lower case, digits and '_', starting with a letter"
bad_initial: {es: "valor inicial de '{name}' no válido ({value}): un número, true o false", en: "invalid initial value of '{name}' ({value}): a number, true or false"}
no_scenes: {es: "faltan las escenas ('scenes')", en: "no scenes ('scenes')"}
bad_start: {es: "la escena inicial '{scene}' no existe", en: "the start scene '{scene}' does not exist"}
bad_scene_id: {es: "id de escena '{value}' no válido: minúsculas, números, '-' y '_'", en: "invalid scene id '{value}': lower case, digits, '-' and '_'"}
scene_not_mapping: {es: "la escena '{scene}' debe ser un mapa", en: "scene '{scene}' must be a mapping"}
bad_condition: {es: "{place}: {problem}", en: "{place}: {problem}"}
undeclared:
  es: "{place}: la variable '{name}' no está en 'state'"
  en: "{place}: variable '{name}' is not in 'state'"
bad_variant: {es: "{place}: cada variante necesita 'if' y 'text'", en: "{place}: every variant needs 'if' and 'text'"}
bad_layer: {es: "{place}: cada capa necesita 'image'", en: "{place}: every layer needs 'image'"}
bad_position: {es: "{place}: posición '{value}' no válida (válidas: {valid})", en: "{place}: invalid position '{value}' (valid: {valid})"}
bad_character: {es: "{place}: cada personaje necesita 'name'", en: "{place}: every character needs 'name'"}
ending_and_more:
