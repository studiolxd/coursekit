  en: "condition «{condition}» reads '{name}', which is not a variable of an earlier simulation of the unit (id.variable)"
bad_symptoms: {es: "{place}: una lista de síntomas (textos)", en: "{place}: a list of symptoms (texts)"}
bad_clues: {es: "{place}: una lista de pistas, cada una con 'label' y 'text'", en: "{place}: a list of clues, each with 'label' and 'text'"}
