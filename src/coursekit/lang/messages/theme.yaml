# Output and errors of `coursekit theme`.
missing_tokens:
  es: "falta {path}: derívalo del tema de la plataforma de maquetación"
  en: "missing {path}: derive it from the theme of the assembly platform"
pair_line:
  es: "{fg} sobre {bg} ({use}): {ratio:.2f}:1, mínimo {minimum}:1"
  en: "{fg} on {bg} ({use}): {ratio:.2f}:1, needs {minimum}:1"
use_body_text: {es: texto del cuerpo, en: body text}
use_secondary_text: {es: texto secundario, en: secondary text}
use_button_text: {es: texto del botón sobre el color de acento, en: button text on the accent}
use_accent: {es: elementos de acento y texto grande, en: accent elements and large text}
use_accent_text: {es: "texto en el color de acento (botones secundarios, fechas)", en: "text in the accent colour (secondary buttons, dates)"}
use_card_text: {es: texto sobre tarjetas, en: text on cards}
use_highlight_text: {es: texto sobre resaltados, en: text on highlights}
use_correct: {es: "lo correcto como tinta sobre el fondo (bordes, marcas, texto)", en: "what is right as ink on the background (borders, marks, text)"}
use_wrong: {es: "lo incorrecto como tinta sobre el fondo (bordes, marcas, texto)", en: "what is wrong as ink on the background (borders, marks, text)"}
use_on_correct: {es: texto sobre el relleno de correcto, en: text on the fill of what is right}
use_on_wrong: {es: texto sobre el relleno de incorrecto, en: text on the fill of what is wrong}
bad_tokens: {es: "{path} no es un JSON de tokens válido", en: "{path} is not a valid tokens JSON"}
not_a_theme:
  es: "el fichero no parece un resultado de get_theme (falta theme.config.colors)"
  en: "the file does not look like a get_theme result (no theme.config.colors)"
file_missing: {es: "no existe el fichero {path}", en: "the file {path} does not exist"}
note_font:
  es: "la fuente «{font}» es una fuente incluida en la plataforma: se usa su nombre como familia CSS; ajústalo si no coincide"
  en: "the font '{font}' is a font included in the platform: its name is used as the CSS family; adjust it if it differs"
note_color:
  es: "el rol de color «{role}» no se pudo resolver; se usa el valor por defecto"
  en: "the colour role '{role}' could not be resolved; the default is used"
note_css_color:
  es: "la variable --{name} vale «{value}», que no es un color con valor fijo: no entra en la comprobación de contraste"
  en: "the variable --{name} is '{value}', not a plain colour value: it is left out of the contrast check"
note_dark:
  es: "el theme tiene modo oscuro: los tokens son los del modo claro"
  en: "the theme has a dark mode: the tokens are those of the light mode"
unknown_role: {es: "theme › roles: {role} no es un rol de color (los roles: {roles})", en: "theme › roles: {role} is not a colour role (the roles: {roles})"}
unknown_colour: {es: "theme › roles › {role}: {ref} no es un color de la paleta del tema, otro rol ni un hex (la paleta: {palette})", en: "theme › roles › {role}: {ref} is not a colour of the palette of the theme, another role or a hex (the palette: {palette})"}
role_from_theme: {es: "del tema", en: "from the theme"}
role_from_derived: {es: "calculado por coursekit", en: "derived by coursekit"}
role_from_set: {es: "fijado por el proyecto ({ref})", en: "fixed by the project ({ref})"}
role_line: {es: "{role}  {value}{name}  · {origin}", en: "{role}  {value}{name}  · {origin}"}
role_seen: {es: "    se ve en: {use}", en: "    seen in: {use}"}
roles_palette: {es: "Paleta del tema (para theme › roles): {palette}", en: "Palette of the theme (for theme › roles): {palette}"}
role_use_background: {es: "el fondo de las escenas de un vídeo, de una simulación y de los diagramas e infografías", en: "the background of the scenes of a video, of a simulation and of the diagrams and infographics"}
role_use_text: {es: "el texto de los vídeos, las simulaciones y los SVG; el texto sobre las tarjetas", en: "the text of the videos, the simulations and the SVGs; the text on cards"}
role_use_headings: {es: "los títulos de las escenas de un vídeo y el nombre del rótulo inferior", en: "the titles of the scenes of a video and the name of the lower third"}
role_use_accent: {es: "el color que destaca: el subrayado de una palabra, las marcas de una lista, los números de los pasos, las flechas, el fondo de la escena de cierre y los botones de una simulación", en: "the colour that stands out: the underline of a word, the marks of a list, the numbers of the steps, the arrows, the background of the closing scene and the buttons of a simulation"}
role_use_on-accent: {es: "el texto sobre el color de acento: la escena de cierre de un vídeo, los números de los pasos, los botones de una simulación", en: "the text on the accent colour: the closing scene of a video, the numbers of the steps, the buttons of a simulation"}
role_use_link: {es: "los enlaces del texto", en: "the links of the text"}
role_use_correct: {es: "el relleno de lo correcto: el fondo de un aviso de respuesta acertada (en la plataforma)", en: "the fill of what is right: the background of a notice of a right answer (in the platform)"}
role_use_on-correct: {es: "el texto sobre el relleno de correcto", en: "the text on the fill of what is right"}
role_use_correct-ink: {es: "lo correcto como tinta sobre el fondo: la marca ✔ de la columna buena de una comparación, el borde de la respuesta acertada, el final bueno de una simulación", en: "what is right as ink on the background: the ✔ of the good column of a comparison, the border of the right answer, the good ending of a simulation"}
role_use_wrong: {es: "el relleno de lo incorrecto: el fondo de un aviso de respuesta fallida (en la plataforma)", en: "the fill of what is wrong: the background of a notice of a wrong answer (in the platform)"}
role_use_on-wrong: {es: "el texto sobre el relleno de incorrecto", en: "the text on the fill of what is wrong"}
role_use_wrong-ink: {es: "lo incorrecto como tinta sobre el fondo: la marca ✘ de la columna mala de una comparación, el borde de la respuesta fallida, el final malo de una simulación", en: "what is wrong as ink on the background: the ✘ of the bad column of a comparison, the border of the wrong answer, the bad ending of a simulation"}
role_use_text-muted: {es: "el texto secundario: la fuente bajo una cifra, el cargo bajo un nombre, la explicación pequeña de un paso, el autor de una cita", en: "the secondary text: the source under a figure, the role under a name, the small explanation of a step, the author of a quote"}
role_use_surface: {es: "el fondo de las tarjetas (las columnas de una comparación, los pasos de un diagrama) y la banda de fondo de una escena", en: "the background of the cards (the columns of a comparison, the steps of a diagram) and the background band of a scene"}
role_use_surface-highlight: {es: "el fondo de una nota destacada en una simulación", en: "the background of a highlighted note in a simulation"}
role_use_border: {es: "el borde de las tarjetas de un vídeo y de una simulación, las líneas que separan bloques", en: "the border of the cards of a video and of a simulation, the lines that separate blocks"}
role_use_accent-ink: {es: "el acento como texto o línea fina sobre el fondo: el contorno del foco en una simulación (quien navega con teclado lo ve al pasar por un botón)", en: "the accent as text or a thin line on the background: the focus outline in a simulation (who browses with the keyboard sees it on a button)"}
