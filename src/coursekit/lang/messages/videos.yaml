# Messages of `coursekit videos` (videos of forbidden sites that come from an official channel).
pending_channel: {es: "el canal no está en rules › forbidden › allow_channels: hay que sustituirlo por un vídeo de un canal oficial", en: "the channel is not in rules › forbidden › allow_channels: replace it with a video from an official channel"}
pending_unresolved: {es: "no se pudo consultar quién lo publica: hay que comprobarlo o sustituirlo", en: "who publishes it could not be asked: check it or replace it"}
why_needed: {es: "propose necesita --why con la evidencia de que el canal es oficial", en: "propose needs --why with the evidence that the channel is official"}
no_identity: {es: "aprobar o rechazar un vídeo lo firma una persona: define COURSEKIT_USER_NAME y COURSEKIT_USER_EMAIL (coursekit setup --identity)", en: "approving or rejecting a video is signed by a person: set COURSEKIT_USER_NAME and COURSEKIT_USER_EMAIL (coursekit setup --identity)"}
not_registered: {es: "el vídeo {url} no está en el registro (ejecuta coursekit videos check)", en: "the video {url} is not in the registry (run coursekit videos check)"}
need_url: {es: "{action} necesita la dirección del vídeo", en: "{action} needs the address of the video"}
summary: {es: "{approved} aprobados, {proposed} propuestos por el agente (a comprobar), {pending} por sustituir, {rejected} rechazados; informe en {path}", en: "{approved} approved, {proposed} proposed by the agent (to check), {pending} to replace, {rejected} rejected; report in {path}"}
decided: {es: "{url}: {status}", en: "{url}: {status}"}
report_title: {es: "# Vídeos de sitios prohibidos — {code}", en: "# Videos on forbidden sites — {code}"}
report_intro:
  es: "Generado por `coursekit videos`. Los vídeos de canales oficiales se conservan; para el resto el agente busca uno equivalente en un canal oficial y lo propone aquí con su evidencia. Una persona comprueba cada propuesta con `coursekit videos approve CODE URL` o `reject`."
  en: "Generated by `coursekit videos`. Videos from official channels are kept; for the rest the agent looks for an equivalent on an official channel and proposes it here with its evidence. A person checks each proposal with `coursekit videos approve CODE URL` or `reject`."
report_header: {es: "| Vídeo | Canal | Estado | Evidencia o motivo |", en: "| Video | Channel | State | Evidence or reason |"}
report_proposed: {es: "## Propuestos por el agente: comprobar que el canal es oficial", en: "## Proposed by the agent: check that the channel is official"}
report_pending: {es: "## Por sustituir: sin canal oficial", en: "## To replace: no official channel"}
report_approved: {es: "## Aprobados", en: "## Approved"}
report_rejected: {es: "## Rechazados (no pueden estar en el contenido)", en: "## Rejected (they cannot be in the content)"}
report_replaces: {es: "sustituye a {url}.", en: "replaces {url}."}
report_unused: {es: "ya no está en el contenido", en: "no longer in the content"}
report_none: {es: "No hay vídeos de sitios prohibidos en el contenido.", en: "There are no videos on forbidden sites in the content."}
stands_in_proposed: {es: "para {id} hay un vídeo oficial propuesto ({url}) que espera a una persona: no se hace hasta que se rechace (coursekit videos approve|reject {code} URL)", en: "for {id} there is an official video proposed ({url}) that waits for a person: it is not made until it is rejected (coursekit videos approve|reject {code} URL)"}
stands_in_approved: {es: "para {id} se aprobó un vídeo oficial ({url}): va en el contenido en lugar del recurso, que no se hace", en: "for {id} an official video was approved ({url}): it goes in the content instead of the resource, which is not made"}
no_channels: {es: "el curso no tiene canales oficiales: añádelos en rules › videos › channels (config/rules.yaml o course.yaml)", en: "the course has no official channels: add them in rules › videos › channels (config/rules.yaml or course.yaml)"}
no_search: {es: "sin YOUTUBE_API_KEY ni proveedor de búsqueda: busca tú en los canales oficiales y registra lo que encuentres con coursekit videos propose", en: "no YOUTUBE_API_KEY and no search provider: search the official channels yourself and register what you find with coursekit videos propose"}
youtube_failed: {es: "la API de YouTube respondió {status}: {detail}", en: "the YouTube API answered {status}: {detail}"}
need_query: {es: "videos find necesita qué buscar: coursekit videos find CODE \"<qué>\"", en: "videos find needs what to search: coursekit videos find CODE \"<what>\""}
found_line: {es: "{url} · {title} · {channel} · {duration} · {date} · {language}", en: "{url} · {title} · {channel} · {duration} · {date} · {language}"}
found_none: {es: "ningún vídeo de los canales oficiales para «{query}»: prueba con otras palabras", en: "no video of the official channels for «{query}»: try other words"}
