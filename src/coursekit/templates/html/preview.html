<!doctype html>
<html lang="__LANG__">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__TITLE__</title>
<style>
  :root { --line: #d8dbe0; --muted: #5b6270; --bg: #f5f6f8; --accent: #1f5fbf; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; font: 14px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; color: #1b1f27; }
  body { display: grid; grid-template-rows: auto 1fr; }
  header { display: flex; gap: .75rem; align-items: center; padding: .5rem .75rem; border-bottom: 1px solid var(--line); background: var(--bg); flex-wrap: wrap; }
  header strong { margin-right: auto; white-space: nowrap; }
  header select { max-width: 20rem; }
  header label { display: flex; gap: .35rem; align-items: center; }
  button, select { font: inherit; padding: .3rem .6rem; border: 1px solid var(--line); border-radius: 6px; background: #fff; cursor: pointer; }
  button:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  main { display: grid; grid-template-columns: 1fr 420px; min-height: 0; }
  main.wide { grid-template-columns: 1fr 0; }
  main.wide aside { display: none; }
  iframe { width: 100%; height: 100%; border: 0; background: #fff; }
  aside { border-left: 1px solid var(--line); overflow: auto; padding: .75rem; background: #fff; }
  h2 { font-size: .8rem; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin: 1rem 0 .4rem; }
  h2:first-child { margin-top: 0; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: left; padding: .2rem .3rem; border-bottom: 1px solid var(--line); vertical-align: top; word-break: break-word; }
  th { color: var(--muted); font-weight: 500; }
  #status th { width: 40%; }
  #interactions td:first-child { word-break: break-all; }
  pre { margin: 0; padding: .5rem; background: var(--bg); border-radius: 6px; font-size: 12px; white-space: pre-wrap; word-break: break-all; max-height: 16rem; overflow: auto; }
  .meter { height: 6px; background: var(--bg); border-radius: 3px; margin: .3rem 0; overflow: hidden; }
  .meter span { display: block; height: 100%; background: var(--accent); }
  .meter.over span { background: #b3261e; }
  .muted { color: var(--muted); font-size: 12px; }
  .note { padding: 2rem; color: var(--muted); }
  h2.bad, ol.errors, ol.calls li.is-error { color: #b3261e; }
  ol.errors { margin: 0; padding-left: 1.2rem; font: 12px/1.35 ui-monospace, Menlo, monospace; }
  ol.calls { margin: 0; padding-left: 1.2rem; font: 12px/1.35 ui-monospace, Menlo, monospace; max-height: 14rem; overflow: auto; }
</style>
</head>
<body>
<header>
  <strong id="title"></strong>
  <label><span id="unit-label"></span> <select id="unit"></select></label>
  <span class="muted" id="standard"></span>
  <button type="button" id="reopen"></button>
  <button type="button" id="reset"></button>
  <button type="button" id="toggle"></button>
</header>
<main id="main">
  <div id="stage"></div>
  <aside aria-live="off">
    <h2 id="h-status"></h2>
    <table id="status"></table>
    <h2 id="h-suspend"></h2>
    <div class="meter" id="meter"><span></span></div>
    <div class="muted" id="chars"></div>
    <pre id="suspend"></pre>
    <h2 id="h-interactions"></h2>
    <table id="interactions"></table>
    <h2 id="h-errors" class="bad" hidden></h2>
    <ol class="errors" id="errors" hidden></ol>
    <h2 id="h-calls"></h2>
    <ol class="calls" id="calls"></ol>
  </aside>
</main>
<script type="module">
import { createLms } from "/__ck/lms.js";

const config = __CONFIG__;
const T = config.texts;
const $ = (id) => document.getElementById(id);
const budget = config.standard === "2004" ? 64000 : 4096;
const asked = Number(new URLSearchParams(location.search).get("unit"));
let unit = config.units.some((u) => u.n === asked) ? asked : config.first;
let calls = [];
let lms = null;

const key = () => `coursekit-preview:${config.course}:${unit}:${config.standard}`;
const store = (name) => ({
  load: () => { try { return JSON.parse(localStorage.getItem(name) || "null"); } catch (e) { return null; } },
  save: (data) => localStorage.setItem(name, JSON.stringify(data)),
});
// A new LMS for each launch of the unit, on the record of that unit; `window.ckPreview` lets `assemble check` read it.
function connect() {
  lms = createLms(config.standard, store(key()), ({ name, args, result, error }) => {
    if (/GetLastError|GetErrorString|GetDiagnostic/.test(name)) return;
    const line = `${name}(${args.map((a) => JSON.stringify(a)).join(", ")}) → ${JSON.stringify(result)}`;
    calls.push({ text: error ? `${line}  ✘ ${error.code} ${error.message}` : line, error: Boolean(error) });
    if (calls.length > 300) calls = calls.slice(-300);
    soon();
  });
  window.API = lms.api12;
  window.API_1484_11 = lms.api2004;
  window.ckPreview = { unit, standard: config.standard, record: () => lms.record(), errors: lms.errors, maxSuspend: lms.maxSuspend };
}

// ── the panel ─────────────────────────────────────────────────────────────────
const cell = (text) => { const td = document.createElement("td"); td.textContent = text; return td; };
const row = (label, value) => {
  const tr = document.createElement("tr");
  const th = document.createElement("th");
  th.textContent = label;
  tr.append(th, cell(value === "" || value === undefined ? "—" : value));
  return tr;
};
// The panel is drawn at most every 100 ms: a unit writes the record many times in a row.
let drawing = null;
function soon() {
  if (!drawing) drawing = setTimeout(() => { drawing = null; render(); }, 100);
}
function render() {
  if (!lms) return;
  const K = lms.keys;
  const cmi = lms.record().cmi || {};
  const get = (k) => (k ? (k in cmi ? cmi[k] : lms.defaults[k] || "") : null);
  const rows = [[T.completion, get(K.status)], [T.success, get(K.success)], [T.score, get(K.score)], [T.location, get(K.location)],
    [T.progress, get(K.progress)], [T.entry, get(K.entry)], [T.exit, get(K.exit)], [T.session_time, get(K.time)]]
    .filter(([, v]) => v !== null);
  $("status").replaceChildren(...rows.map(([l, v]) => row(l, v)));
  const raw = get(K.suspend) || "";
  let pretty = raw;
  try { pretty = raw ? JSON.stringify(JSON.parse(raw), null, 1) : ""; } catch (e) { /* not JSON: as it is */ }
  $("suspend").textContent = pretty || T.none;
  $("chars").textContent = T.chars.replace("{count}", raw.length).replace("{max}", budget);
  $("meter").classList.toggle("over", raw.length > budget);
  $("meter").firstElementChild.style.width = `${Math.min(100, (100 * raw.length) / budget)}%`;
  const field = (i, name) => cmi[`cmi.interactions.${i}.${name}`] || "";
  const head = document.createElement("tr");
  [T.interaction_id, T.response, T.result, T.weighting].forEach((h) => {
    const th = document.createElement("th");
    th.textContent = h;
    head.append(th);
  });
  const lines = lms.indexes().map((i) => {
    const tr = document.createElement("tr");
    const id = cell(field(i, "id"));
    const description = field(i, "description");
    if (description) id.title = description;
    tr.append(id, cell(field(i, K.response)), cell(field(i, "result")), cell(field(i, "weighting")));
    return tr;
  });
  $("interactions").replaceChildren(...(lines.length ? [head, ...lines] : [row(T.none, "")]));
  $("h-errors").hidden = $("errors").hidden = !lms.errors.length;
  $("errors").replaceChildren(...lms.errors.map((e) => {
    const li = document.createElement("li");
    li.textContent = `${e.code} ${e.message}: ${e.name || ""}${e.value !== undefined ? ` = ${JSON.stringify(e.value).slice(0, 120)}` : ""}`;
    return li;
  }));
  $("calls").replaceChildren(...calls.slice(-80).map((c) => {
    const li = document.createElement("li");
    li.textContent = c.text;
    if (c.error) li.className = "is-error";
    return li;
  }));
  $("calls").scrollTop = $("calls").scrollHeight;
}

// ── the unit ──────────────────────────────────────────────────────────────────
const stamps = {};
function mount() {
  const info = config.units.find((u) => u.n === unit);
  connect();
  if (!info || !info.built) {
    const note = document.createElement("p");
    note.className = "note";
    note.textContent = T.not_built.replace("{n}", unit);
    $("stage").replaceChildren(note);
    render();
    return;
  }
  const frame = document.createElement("iframe");
  frame.title = `${T.unit} ${unit}`;
  frame.src = `/unit/${String(unit).padStart(2, "0")}/index.html?t=${Date.now()}`;
  $("stage").replaceChildren(frame);
  $("stage").style.height = "100%";
  render();
}
// Closing the unit (removing its frame) ends its session (exit and Finish) under the unit still open; then `then` runs.
function close(then) {
  const frame = $("stage").querySelector("iframe");
  if (frame) frame.remove();
  setTimeout(() => { if (then) then(); mount(); }, 50);
}
const reopen = () => close();

$("title").textContent = `${config.course} · ${T.panel_title}`;
$("unit-label").textContent = T.unit;
$("standard").textContent = `${T.standard}: SCORM ${config.standard}`;
$("reopen").textContent = T.reopen;
$("reset").textContent = T.reset;
$("toggle").textContent = T.hide;
$("h-status").textContent = T.status;
$("h-suspend").textContent = T.suspend_data;
$("h-interactions").textContent = T.interactions;
$("h-errors").textContent = T.errors;
$("h-calls").textContent = T.calls;
config.units.forEach((u) => {
  const option = document.createElement("option");
  option.value = u.n;
  option.textContent = u.title ? `${u.n} · ${u.title}` : String(u.n);
  option.selected = u.n === unit;
  $("unit").append(option);
});
$("unit").addEventListener("change", (e) => close(() => { unit = Number(e.target.value); calls = []; }));
$("reopen").addEventListener("click", reopen);
$("reset").addEventListener("click", () => close(() => { localStorage.removeItem(key()); calls = []; }));
$("toggle").addEventListener("click", () => {
  const wide = $("main").classList.toggle("wide");
  $("toggle").textContent = wide ? T.show : T.hide;
});
// the unit reloads when it is built again (`coursekit assemble build` in another terminal)
setInterval(() => {
  fetch("/__ck/stamps", { cache: "no-store" }).then((r) => r.json()).then((now) => {
    config.units.forEach((u) => {
      const value = now[String(u.n)] || 0;
      const before = stamps[u.n];
      stamps[u.n] = value;
      u.built = value > 0;
      if (before !== undefined && before !== value && u.n === unit) {
        calls.push({ text: T.reloaded, error: false });
        reopen();
      }
    });
  }).catch(() => {});
}, 1500);
mount();
</script>
</body>
</html>
