# coursekit project. Shared by the whole team and versioned; personal settings go in .env.
# Production rules, directives, media and delivery options can be overridden here (sections
# rules:, directives:, media:, delivery:) or in config/<name>.yaml; see `coursekit config`.
name: {name}
client: {client}
# Language of the courses (es | en).
content_language: {content_language}
# Language of coursekit messages and of the templates for people (es | en).
ui_language: {ui_language}
tone: {tone}
# How learners are addressed: tu | usted (es), you (en).
address: {address}
# Who the courses of the project are for. Every course starts from it, and course.yaml › design (audience, level,
# prerequisites) changes it for one course. The design agent asks for what is missing.
audience:
  who: ""          # the people: profile, roles, sector (e.g. office staff of a mid-sized company, no technical profile)
  context: ""      # where they are: the organisation, its policies and tools, the accounts, licences and devices they have
  knowledge: ""    # what they already know, and what they do not; empty: nothing is required, the courses start from zero
  level: ""        # e.g. basic, intermediate, advanced; empty: each course by its subject, starting from basic
  learning: ""     # how they learn: time they have, device, place, mandatory or voluntary, what moves them

assembly:
  # creator | html
  backend: {backend}
{design_rules}
theme:
  # Creator backend: tenant_default (the default theme of the organization in creator) | branding (a theme made from the
  # material in theme/branding/). With the html backend the look is theme/maqueta.css (or the base look) and this is not used.
  source: {theme_source}
  # The colour of the brand for the roles the platform has no colour for (coursekit theme roles lists them, with where each
  # one is seen, and the palette of the theme), and the radius and the shadow of the media; the platform theme is not touched.
  # roles: {surface: grey-lightest, line: grey-light}
  # radius: 0
  # shadow: none

platform:
  slxd:
    # Name of the MCP server in .mcp.json and opencode.json, and its URL
    # (e.g. https://<tenant>.slxd.app/mcp/creator).
    mcp_name: slxd-creator
    mcp_url: {mcp_url}
    # Optional: use the creator connector you logged in at account level instead of the server above. Its name as your AI
    # tool lists it (for example "SLXD Creator Studio LXD"); sessions without an interface may then use its tools.
    connector: ""
    organization_id: ""

mirror:
  # sharepoint | onedrive | google-drive | nextcloud | folder | none
  provider: {mirror}
  # Web address of the mirror folder (links in the catalog).
  url: {mirror_url}

network:
  # Extra CA certificates for TLS-inspecting proxies (paths).
  ca_bundles: []
