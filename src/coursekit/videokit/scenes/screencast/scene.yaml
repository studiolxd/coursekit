description: A real screen recording with zooms that follow what the narration names (never a guessed coordinate when the recording has its events).
built_from: [ScreenRecording]
props:
  recording: {type: media, required: true, help: "recordings/<id>.mp4 (its events, recordings/<id>.events.json, are added by coursekit)"}
  focus: {type: list, items: {word: {type: text, help: "the words of the narration it zooms on"}, event: {type: text, help: "the label or note of an event of the recording"}, fx: {type: number}, fy: {type: number}, scale: {type: number}, hold: {type: number}}}
  start: {type: number, help: "second of the recording the scene starts from"}
  scale: {type: number, help: "how close the zoom goes (default 1.8)"}
  ring: {type: boolean, help: "a ring on the point of each focus (default true)"}
