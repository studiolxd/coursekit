label: {en: "Screen recording", es: "Grabación de pantalla"}
description:
  en: A real screen recording with zooms that follow what the narration names (never a guessed coordinate when the recording has its events).
  es: Una grabación de pantalla real con zooms que siguen lo que nombra la locución (nunca una coordenada a ojo cuando la grabación tiene sus eventos).
built_from: [ScreenRecording]
props:
  recording: {type: media, required: true, help: {en: "recordings/<id>.mp4 (its events, recordings/<id>.events.json, are added by coursekit)", es: "recordings/<id>.mp4 (sus eventos, recordings/<id>.events.json, los añade coursekit)"}}
  focus: {type: list, help: {en: "the zooms of the recording, one after another: each one on the words of the narration that name what it shows (or at a second, `at`), on an event of the recording or on a point (fx, fy)", es: "los zooms de la grabación, uno tras otro: cada uno en las palabras de la locución que nombran lo que enseña (o en un segundo, `at`), en un evento de la grabación o en un punto (fx, fy)"}, items: {word: {type: text, help: {en: "the words of the narration it zooms on", es: "las palabras de la locución en las que hace zoom"}}, at: {type: number, help: {en: "or the second of the scene it zooms at", es: "o el segundo de la escena en que hace zoom"}}, event: {type: text, help: {en: "the label or note of an event of the recording (its box, shape and tone come with it)", es: "la etiqueta o la nota de un evento de la grabación (con su caja, su forma y su tono)"}}, box: {type: list, help: {en: "or the box of what it shows: left, top, width, height as fractions of the screen", es: "o la caja de lo que enseña: izquierda, arriba, ancho y alto en fracciones de la pantalla"}}, shape: {type: choice, values: [rect, round, ellipse]}, fx: {type: number}, fy: {type: number}, scale: {type: number}, hold: {type: number}}}
  start: {type: number, help: {en: "second of the recording the scene starts from", es: "segundo de la grabación desde el que empieza la escena"}}
  scale: {type: number, help: {en: "how close a zoom goes at most (default config/video.yaml › screencast.scale)", es: "cuánto se acerca un zoom como mucho (por defecto config/video.yaml › screencast.scale)"}}
  ring: {type: boolean, default: true, help: {en: "a mark around what each focus shows, when its box is known (default true)", es: "una marca alrededor de lo que enseña cada foco, cuando se conoce su caja (por defecto true)"}}
  frame: {type: choice, values: [none, window], help: {en: "none, the recording fills the frame (default); window, inside a window on the background of the style", es: "none, la grabación llena el cuadro (por defecto); window, dentro de una ventana sobre el fondo del estilo"}}
# What the gallery draws it with: a still of a screen in the colours of the theme (any image is zoomed as a recording would be),
# with one focus at a second of the scene, since the gallery has no narration to follow.
example:
  en: {recording: gallery-sample.svg, focus: [{at: 0.4, box: [0.12, 0.48, 0.36, 0.12], shape: round, hold: 1.3}]}
  es: {recording: gallery-sample.svg, focus: [{at: 0.4, box: [0.12, 0.48, 0.36, 0.12], shape: round, hold: 1.3}]}
# Other ways the gallery draws it: the props of each over those of the example.
variants:
  - {name: window, label: {en: "In a window", es: "En una ventana"}, props: {frame: window}}
