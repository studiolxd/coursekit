description: Text and a medium side by side; the points enter when the narration names them (`say` of each point).
built_from: [Background, TitleBlock, BulletList (Stagger, Text), MediaSlot, Enter]
props:
  kicker: {type: text, max_chars: 40, on_screen: true, label: true, help: "a label over the title: it need not be said"}
  title: {type: text, required: true, max_chars: 60, on_screen: true}
  points: {type: list, max_items: 4, items: {text: {type: text, max_chars: 70, on_screen: true}, say: {type: text, help: "the words of the narration that name it"}}}
  media: {type: media, help: "a path inside the media folder of the course: files/… or recordings/…"}
  side: {type: choice, values: [left, right], help: "where the medium goes (default right)"}
