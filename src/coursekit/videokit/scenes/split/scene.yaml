       points: [{text: "Twelve characters or more"}, {text: "Four words at random"}, {text: "One password per account"}]}
  es: {kicker: "La clave", title: "La longitud manda", media: "gallery-sample-photo.jpg",
       points: [{text: "Doce caracteres o más"}, {text: "Cuatro palabras al azar"}, {text: "Una contraseña por cuenta"}]}
