description:
  en: A figure that counts up when the narration says it, with what it measures and where it comes from.
  es: Una cifra que cuenta hacia arriba cuando la locución la dice, con lo que mide y de dónde sale.
built_from: [Background, StatBlock (Counter, Heading, Text, Enter)]
props:
  value: {type: number, required: true, on_screen: true}
  prefix: {type: text, max_chars: 3}
  suffix: {type: text, max_chars: 6}
  decimals: {type: number}
  label: {type: text, required: true, max_chars: 70, on_screen: true}
  source: {type: text, required: true, max_chars: 80, help: {en: "a figure is never shown without its source", es: "una cifra nunca se muestra sin su fuente"}}
  say: {type: text, help: {en: "the words of the narration that say the figure: it counts up then", es: "las palabras de la locución que dicen la cifra: entonces cuenta"}}
  locale: {type: text, help: {en: "how the number is written (default the language of the course)", es: "cómo se escribe el número (por defecto, en el idioma del curso)"}}
# What the gallery draws it with (`coursekit video gallery`), in each language of the courses.
example:
  en: {value: 81, suffix: "%", label: "of breaches start with a weak or reused password", source: "Invented figure for the gallery"}
  es: {value: 81, suffix: " %", label: "de las brechas empiezan por una contraseña débil o repetida", source: "Cifra inventada para la galería"}
