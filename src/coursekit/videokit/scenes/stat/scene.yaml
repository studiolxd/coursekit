description: A figure that counts up when the narration says it, with what it measures and where it comes from.
built_from: [Background, StatBlock (Counter, Heading, Text, Enter)]
props:
  value: {type: number, required: true, on_screen: true}
  prefix: {type: text, max_chars: 3}
  suffix: {type: text, max_chars: 6}
  decimals: {type: number}
  label: {type: text, required: true, max_chars: 70, on_screen: true}
  source: {type: text, required: true, max_chars: 80, help: "a figure is never shown without its source"}
  say: {type: text, help: "the words of the narration that say the figure: it counts up then"}
  locale: {type: text, help: "how the number is written (default the language of the course)"}
# What the gallery draws it with (`coursekit video gallery`), in each language of the courses.
example:
  en: {value: 81, suffix: "%", label: "of breaches start with a weak or reused password", source: "Invented figure for the gallery"}
  es: {value: 81, suffix: " %", label: "de las brechas empiezan por una contraseña débil o repetida", source: "Cifra inventada para la galería"}
