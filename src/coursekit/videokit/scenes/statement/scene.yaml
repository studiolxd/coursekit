label: {en: "Key phrase", es: "Frase destacada"}
description:
  en: A phrase to keep, large and alone; a word of the phrase (`stress`) is underlined when the narration says it.
  es: Una frase que retener, grande y sola; una palabra de la frase (`stress`) se subraya cuando se locuta.
built_from: [Background, Text, Heading, Underline, Enter]
props:
  kicker: {type: text, max_chars: 40, on_screen: true, label: true, help: {en: "a label over the phrase: it need not be said", es: "una etiqueta sobre la frase: no hace falta locutarla"}}
  text: {type: text, required: true, max_chars: 120, on_screen: true}
  stress: {type: text, help: {en: "a word of the phrase the narration stresses: it is underlined when it is said", es: "una palabra de la frase que la locución destaca: se subraya cuando se locuta"}}
  background: {type: choice, values: [plain, surface, accent], help: {en: "default: the background of the style of the project (config/video.yaml)", es: "por defecto: el fondo del estilo del proyecto (config/video.yaml)"}}
  align: {type: choice, values: [left, center], help: {en: "default left", es: "por defecto left"}}
# What the gallery draws it with (`coursekit video gallery`), in each language of the courses.
example:
  en: {kicker: "Remember", text: "The length of a password matters more than its symbols", stress: "length"}
  es: {kicker: "Recuerda", text: "La longitud de una contraseña importa más que sus símbolos", stress: "longitud"}
# Other ways the gallery draws it: the props of each over those of the example.
variants:
  - {name: accent, label: {en: "Accent", es: "Acento"}, props: {background: accent, align: center}}
