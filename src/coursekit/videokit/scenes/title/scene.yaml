description: The opening of a video or of a part of it, a kicker over a title; the title is underlined when the narration says `stress`.
built_from: [Background, TitleBlock (Text, Heading, Enter, Underline)]
props:
  kicker: {type: text, max_chars: 40, on_screen: true, label: true, help: "a label over the title: it need not be said"}
  title: {type: text, required: true, max_chars: 60, on_screen: true}
  stress: {type: text, help: "a word of the title the narration stresses: it is underlined when it is said"}
# What the gallery draws it with (`coursekit video gallery`), in each language of the courses.
example:
  en: {kicker: "Unit 1", title: "Long passwords protect more", stress: "Long"}
  es: {kicker: "Unidad 1", title: "Las contraseñas largas protegen más", stress: "largas"}
