label: {en: "Cover", es: "Portada"}
description:
  en: The cover of a video, of a course, of a unit or of a part, a kicker over a title and a line under it, on the background of the style, plain, the surface colour, the accent or a photo.
  es: La portada de un vídeo, de un curso, de una unidad o de una parte, un antetítulo sobre un título y una línea debajo, sobre el fondo del estilo, liso, el color de superficie, el acento o una foto.
built_from: [Ground (Background), MediaSlot, Card, TitleBlock (Text, Heading, Enter), Text]
props:
  kicker: {type: text, max_chars: 40, on_screen: true, label: true, help: {en: "a label over the title: it need not be said", es: "una etiqueta sobre el título: no hace falta locutarla"}}
  title: {type: text, required: true, max_chars: 60, on_screen: true}
  text: {type: text, max_chars: 140, on_screen: true, help: {en: "a line under the title: what the video, the course or the unit is about", es: "una línea bajo el título: de qué trata el vídeo, el curso o la unidad"}}
  background: {type: choice, values: [plain, surface, accent, photo], help: {en: "default: the background of the style of the project (config/video.yaml)", es: "por defecto: el fondo del estilo del proyecto (config/video.yaml)"}}
  photo: {type: media, when: {background: photo}, help: {en: "with background photo: a path inside the media folder of the course (files/…); describe it in `shows` of the scene", es: "con background photo: una ruta dentro de la carpeta media del curso (files/…); descríbela en `shows` de la escena"}}
  credit: {type: text, max_chars: 80, on_screen: true, help: {en: "the credit of the image of the scene (its author and its licence), small at the bottom right: a CC-BY photo requires it", es: "el crédito de la imagen de la escena (su autor y su licencia), pequeño abajo a la derecha: una foto CC-BY lo exige"}}
  layout: {type: choice, values: [side, panel, over], when: {background: photo}, help: {en: "with a photo: side, the photo on one half and the text on the other (default); panel, the text in a panel over the photo; over, the text straight over the photo, only for a photo with a large calm, even area where the text goes (with a busy photo, panel or side)", es: "con foto: side, la foto en una mitad y el texto en la otra (por defecto); panel, el texto en un panel sobre la foto; over, el texto directamente sobre la foto, solo para una foto con una zona amplia, tranquila y uniforme donde va el texto (con una foto cargada, panel o side)"}}
  align: {type: choice, values: [left, center, right], help: {en: "where the text goes across (default left); with layout side, the half of the text", es: "dónde va el texto en horizontal (por defecto left); con layout side, la mitad del texto"}}
  valign: {type: choice, values: [top, middle, bottom], help: {en: "where the text goes up and down (default middle); at the bottom it keeps clear of the captions", es: "dónde va el texto en vertical (por defecto middle); abajo deja libre la zona de los subtítulos"}}
  ink: {type: choice, values: [dark, light], when: {layout: over}, help: {en: "with layout over: light for a dark photo (default dark)", es: "con layout over: light para una foto oscura (por defecto dark)"}}
  entrance: {type: choice, values: [auto, fade, rise, slide, scale, none], help: {en: "how its elements enter (default that of config/video.yaml › motion › entrance): auto, each its own way; fade; rise; slide, from its side; scale, they grow; none, no movement", es: "cómo entran sus elementos (por defecto el de config/video.yaml › motion › entrance): auto, cada uno a su manera; fade; rise, suben; slide, desde su lado; scale, crecen; none, sin movimiento"}}
# What the gallery draws it with (`coursekit video gallery`), in each language of the courses.
example:
  en: {kicker: "Unit 1", title: "Long passwords protect more", text: "Why length beats complexity, and how to build one you remember"}
  es: {kicker: "Unidad 1", title: "Las contraseñas largas protegen más", text: "Por qué la longitud gana a la complejidad y cómo crear una que recuerdes"}
# Other ways the gallery draws it: the props of each over those of the example.
variants:
  - {name: centred, label: {en: "Centred", es: "Centrada"}, props: {align: center}}
  - {name: surface, label: {en: "Surface", es: "Superficie"}, props: {background: surface}}
  - {name: accent, label: {en: "Accent", es: "Acento"}, props: {background: accent, align: center}}
  - {name: photo-side, label: {en: "Photo beside the text", es: "Foto al lado del texto"}, props: {background: photo, photo: gallery-sample-photo.jpg, layout: side}}
  - {name: photo-panel, label: {en: "Photo with a panel", es: "Foto con panel"}, props: {background: photo, photo: gallery-sample-photo.jpg, layout: panel, valign: bottom}}
  - {name: photo-over, label: {en: "Text over the photo", es: "Texto sobre la foto"}, props: {background: photo, photo: gallery-sample-photo.jpg, layout: over, valign: top}}
  - {name: still, label: {en: "No movement", es: "Sin movimiento"}, props: {entrance: none}}
